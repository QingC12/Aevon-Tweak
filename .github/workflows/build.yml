          case "$(basename "$DEB")" in
            com.Aevon_*_iphoneos-arm64e.deb) echo "产物文件名: 符合 com.Aevon_<版本>_iphoneos-arm64e.deb" ;;
            *) echo "::error::产物文件名应以 com.Aevon_ 开头，实际: $(basename "$DEB")"; exit 1 ;;
          esac

          # 设置 bundle：必须是纯 arm64e，且真的编进了控制器子类（否则点击设置项会闪退）
          PREFS_BIN="$(find . -name 'AevonPrefs' -type f | head -n1)"
          echo "prefs bin: $PREFS_BIN"
          PREFS_ARCHS="$(lipo -archs "$PREFS_BIN")"
          echo "prefs lipo -archs: $PREFS_ARCHS"
          [ "$PREFS_ARCHS" = "arm64e" ] || { echo "::error::设置 bundle 必须是纯 arm64e，实际: $PREFS_ARCHS"; exit 1; }
          strings "$PREFS_BIN" | grep -q 'AevonRootListController' \
            || { echo "::error::设置 bundle 缺少 AevonRootListController（点击设置项会闪退）"; exit 1; }
          # V0.0.5：设置页空白是因为 specifier 没写回 _specifiers。这里确认两条关键路径都编进去了
          strings "$PREFS_BIN" | grep -q 'preferenceSpecifierNamed:target:set:get:detail:cell:edit:' \
            || { echo "::error::设置 bundle 缺少 PSSpecifier 自行构建逻辑（设置页会空白）"; exit 1; }
          strings "$PREFS_BIN" | grep -q '_specifiers' \
            || { echo "::error::设置 bundle 缺少 _specifiers 写回逻辑（设置页会空白）"; exit 1; }
          echo "设置 bundle 控制器类: 已编入；specifier 构建与写回: 已编入"
          strings "$PREFS_BIN" | grep -q 'AevonRingEditorController' \
            || { echo "::error::设置 bundle 缺少圆盘 App 编辑器（AevonRingEditorController）"; exit 1; }
          strings "$PREFS_BIN" | grep -q 'AevonRingAddController' \
            || { echo "::error::设置 bundle 缺少圆盘 App 添加页（AevonRingAddController）"; exit 1; }
          strings "$PREFS_BIN" | grep -q 'aevonOpenRingEditor' \
            || { echo "::error::设置页没有「编辑圆盘 App」入口动作（aevonOpenRingEditor）"; exit 1; }
          strings "$PREFS_BIN" | grep -q 'moveRowAtIndexPath' \
            || { echo "::error::圆盘 App 编辑器不支持拖动排序（缺 moveRowAtIndexPath）"; exit 1; }
          strings "$PREFS_BIN" | grep -q 'aevonSliderValueChanged' \
            || { echo "::error::设置页滑杆没有拖动实时回调（缺 aevonSliderValueChanged）"; exit 1; }
          # V0.0.28：滑条必须按存储值初始化（否则一碰就写 0，触发条跑到屏幕顶部）
          strings "$PREFS_BIN" | grep -q 'AevonSliderSyncV28' \
            || { echo "::error::滑条没有按存储值校正（缺 AevonSliderSyncV28）—— 滑杆会停在最左端"; exit 1; }
          strings "$PREFS_BIN" | grep -q 'aevonResetTriggerZone' \
            || { echo "::error::设置页缺少「恢复默认触发区域」按钮动作（aevonResetTriggerZone）"; exit 1; }
          PREFS_DIR_TMP="$(dirname "$PREFS_BIN")"
          # V0.0.30：恢复默认按钮在二级 Detail.plist；Root 一级页必须有二级页入口
          plutil -convert xml1 -o - "$PREFS_DIR_TMP/Detail.plist" | grep -q 'aevonResetTriggerZone' \
            || { echo "::error::Detail.plist 缺少「恢复默认触发区域」按钮"; exit 1; }
          plutil -convert xml1 -o - "$PREFS_DIR_TMP/Root.plist" | grep -q 'aevonOpenDetail' \
            || { echo "::error::Root.plist 缺少「细节调整」二级页入口"; exit 1; }
          strings "$PREFS_BIN" | grep -q 'AevonDetailPageV30' \
            || { echo "::error::二级细节调整页逻辑没有编入（缺 AevonDetailPageV30）"; exit 1; }
          echo "V0.0.30 设置侧校验: 一级只放开关 + Detail.plist 二级页 + 恢复默认 已编入"

          # Root.plist 必须随包，且开关项不少于 6 个
          ICON_DIR="$(dirname "$PREFS_BIN")"
          [ -s "$ICON_DIR/Root.plist" ] || { echo "::error::bundle 缺少 Root.plist"; exit 1; }
          SWITCH_COUNT="$(plutil -convert xml1 -o - "$ICON_DIR/Root.plist" | grep -c 'PSSwitchCell' || true)"
          echo "Root.plist 开关项: $SWITCH_COUNT"
          [ "$SWITCH_COUNT" -ge 6 ] || { echo "::error::Root.plist 开关项不足 6 个（实际 $SWITCH_COUNT）"; exit 1; }
          # V0.0.27：悬浮球已删除，设置里不应再有 BubbleEnabled
          if plutil -convert xml1 -o - "$ICON_DIR/Root.plist" | grep -q 'BubbleEnabled'; then
            echo "::error::Root.plist 仍残留 BubbleEnabled（悬浮球已移除）"
            exit 1
          fi
          # V0.1.5（AevonNoSnapV105）：吸附开关已随吸附功能删除 —— 反过来要求它绝不出现；
          # 「窗口保活」「强制前台保持」两个无效开关也一并删除（保活改为单窗恒开）。
          if plutil -convert xml1 -o - "$ICON_DIR/Root.plist" | grep -qE 'SnapEnabled|>KeepAlive<|ForceForeground|SystemGestureEdge'; then
            echo "::error::Root.plist 仍有已删除的开关项（SnapEnabled / KeepAlive / ForceForeground / SystemGestureEdge）"
            exit 1
          fi
          # V0.0.15 新增：边缘手势主入口开关必须在
          plutil -convert xml1 -o - "$ICON_DIR/Root.plist" | grep -q 'EdgeGestureEnabled' \
            || { echo "::error::Root.plist 缺少 EdgeGestureEnabled（边缘圆盘入口）开关"; exit 1; }
          # V0.0.25 新增：触发区域三个滑杆必须在「细节调整」二级页（V0.0.30 起 Root 只放开关）
          for K in RingTriggerY RingTriggerWidth RingTriggerHeight; do
            plutil -convert xml1 -o - "$ICON_DIR/Detail.plist" | grep -q "$K" \
              || { echo "::error::Detail.plist 缺少触发区域设置项 $K"; exit 1; }
          done
          # V0.0.30：一级 Root.plist 只允许开关（滑杆全部在 Detail.plist）
          if plutil -convert xml1 -o - "$ICON_DIR/Root.plist" | grep -q 'PSSliderCell'; then
            echo "::error::Root.plist 里还有滑杆（V0.0.30 起一级页只放开关，滑杆在 Detail.plist）"; exit 1
          fi
          [ -s "$ICON_DIR/Detail.plist" ] || { echo "::error::bundle 缺少 Detail.plist（二级细节调整页）"; exit 1; }
          plutil -convert xml1 -o - "$ICON_DIR/Detail.plist" | grep -q 'aevonResetTriggerZone' \
            || { echo "::error::Detail.plist 缺少「恢复默认触发区域」按钮"; exit 1; }
          plutil -convert xml1 -o - "$ICON_DIR/Root.plist" | grep -q 'aevonOpenDetail' \
            || { echo "::error::Root.plist 缺少「细节调整」二级页入口"; exit 1; }
          # V0.0.29：PSSliderCell 只认 min/max —— 缺了量程退化成 0~1，一拖就写回 0.x，
          # 触发条永远贴在屏幕顶部（用户 Aevon(22) 复现的「自动跑到顶部」根因）
          # V0.0.30：滑杆在二级 Detail.plist
          for K in '<key>min</key>' '<key>max</key>'; do
            plutil -convert xml1 -o - "$ICON_DIR/Detail.plist" | grep -qF "$K" \
              || { echo "::error::Detail.plist 滑杆缺少 $K（量程会退化成 0~1，触发条会跑到顶部）"; exit 1; }
          done
          strings "$PREFS_BIN" | grep -q 'PSSliderCell' \
            || { echo "::error::设置 bundle 没有滑杆构建逻辑（PSSliderCell）"; exit 1; }
          # V0.0.26：滑杆写值后必须广播变更通知，SpringBoard 才会立刻重排触发条
          strings "$PREFS_BIN" | grep -q 'com.aevon.prefschanged' \
            || { echo "::error::设置 bundle 没有广播 com.aevon.prefschanged（改完设置触发条不会实时变化）"; exit 1; }

          # 图标三档必须在 bundle 根目录
          ICON_DIR="$(dirname "$PREFS_BIN")"
          for i in icon.png icon@2x.png icon@3x.png; do
            [ -s "$ICON_DIR/$i" ] || { echo "::error::缺少图标 $i"; exit 1; }
          done
          echo "图标: icon.png / icon@2x.png / icon@3x.png 均存在"


          # V0.2.0（AevonAppSideV200）：路 B 第一版 —— 把判定点搬进 App 进程。
          #   ① 必须多出第二个 dylib（AevonApp.dylib），主插件内容不许混进去；
          #   ② 它的 filter 只允许「设置 / Safari」，绝不许含 springboard；
          #   ③ 必须纯 arm64e 且体积受控（只做只读探针，超过 200KB 说明混了东西）；
          #   ④ 0.2.0 不许改触摸时序：源码里不能出现两个开关被置 YES。
          APP_DYLIB="$(find . -name 'AevonApp.dylib' | head -n1)"
          echo "app dylib: $APP_DYLIB"
          [ -n "$APP_DYLIB" ] || { echo "::error::缺少 AevonApp.dylib（App 侧 dylib 没打进包里，路 B 无从验证）"; exit 1; }
          APP_ARCHS="$(lipo -archs "$APP_DYLIB")"
          echo "app lipo -archs: $APP_ARCHS"
          [ "$APP_ARCHS" = "arm64e" ] || { echo "::error::AevonApp.dylib 必须是纯 arm64e，实际: $APP_ARCHS"; exit 1; }
          APP_SIZE="$(wc -c < "$APP_DYLIB" | tr -d ' ')"
          echo "app dylib 大小: $APP_SIZE 字节"
          [ "$APP_SIZE" -lt 204800 ] || { echo "::error::AevonApp.dylib 超过 200KB（$APP_SIZE）—— App 侧必须极小，主插件逻辑混进来了"; exit 1; }
          for s in AevonAppSideV200 AevonAppObserveV200 AevonAppPrefDomainV200 AevonAppWhitelistV200; do
            strings "$APP_DYLIB" | grep -q "$s" \
              || { echo "::error::AevonApp.dylib 缺少标记 $s"; exit 1; }
          done
          for s in AevonRingMenu AevonEntryHost AevonSceneHost AevonProbeV107; do
            if strings "$APP_DYLIB" | grep -q "$s"; then
              echo "::error::AevonApp.dylib 里出现了主插件符号 $s（App 侧必须只做只读探针）"
              exit 1
            fi
          done
          APP_PLIST="$(find . -name 'AevonApp.plist' | head -n1)"
          [ -n "$APP_PLIST" ] || { echo "::error::缺少 AevonApp.plist（App 侧 dylib 不会被注入）"; exit 1; }
          # V0.2.4：注入范围已放开到全部 App（Classes=[UIApplication]），
          # 0.2.0 的「恰好 2 个 Bundles」断言在此反转（路 B 四步 Aevon(87)~(90) 全部验真）。
          plutil -convert xml1 -o - "$APP_PLIST" | grep -q '<string>UIApplication</string>' \
            || { echo "::error::AevonApp.plist 必须是 Classes=[UIApplication]（全 App 白名单，V0.2.4）"; exit 1; }
          if plutil -convert xml1 -o - "$APP_PLIST" | grep -q 'com.apple.springboard'; then
            echo "::error::AevonApp.plist 里出现了 com.apple.springboard（SB 让位由代码分支管，不进 filter）"
            exit 1
          fi
          APP_BUNDLE_COUNT="$(plutil -convert xml1 -o - "$APP_PLIST" | grep -c '<string>com\.apple\.' || true)"
          echo "App 侧注入名单: Classes=[UIApplication]（com.apple.* 显式条目 $APP_BUNDLE_COUNT 个，应为 0）"
          [ "$APP_BUNDLE_COUNT" -eq 0 ] || { echo "::error::V0.2.4 起 plist 不再枚举 App（排除表在代码里）；请删除 Bundles 枚举"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonAppSideBridgeV200' \
            || { echo "::error::主插件缺少 App 侧日志桥（AevonAppSideBridgeV200）"; exit 1; }
          if strings "$DYLIB" | grep -q 'AevonAppObserverGesture'; then
            echo "::error::主插件里混进了 App 侧识别器（AevonAppObserverGesture）"
            exit 1
          fi
          # V0.2.1（AevonAppTakeoverV201）：0.2.0 的「App 侧不许动时序」断言在此反转。
          # 历史正向标记（AevonAppSideV200 等 4 条）全部保留；只读形态的记录由这些
          # 标记承担。0.2.1 的机制恰恰就是那两个开关置 YES —— 这是 0.1.19 方案书
          # 「暂存+按序补投」的官方实现，断言改为**必须**为 YES。
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AppSide/AevonAppSide.m" \
            | grep -q 'delaysTouchesBegan = YES' \
            || { echo "::error::0.2.1 App 侧 delaysTouchesBegan 必须为 YES —— 不扣 began 就拦不住 App 那份触摸（路 B 本体）"; exit 1; }
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AppSide/AevonAppSide.m" \
            | grep -q 'cancelsTouchesInView = YES' \
            || { echo "::error::0.2.1 App 侧 cancelsTouchesInView 必须为 YES —— 不取消就谈何接管"; exit 1; }
          echo "V0.2.0 校验: AevonApp.dylib（arm64e / 2 个 App）+ 日志桥 已就位（只读断言已于 0.2.1 反转）"

          # V0.2.1（AevonAppTakeoverV201）：App 侧真接管 + 判向 + 回传。
          #   ① AevonApp.dylib 编入 4 条新标记（接管 / 判向 / 回传 / 急救）；
          #   ② 判向参数必须与 SB 侧成熟版一致（30pt 横向占优）；
          #   ③ Darwin 回传通道 com.aevon.rightedgetrigger 两端都要有；
          #   ④ 注入名单仍为 2 个（扩白名单属 0.2.2）。
          for s in AevonAppTakeoverV201 AevonAppDirectionV201 AevonAppNotifySBV201 AevonAppPanicCrossV201; do
            strings "$APP_DYLIB" | grep -q "$s" \
              || { echo "::error::AevonApp.dylib 缺少 0.2.1 标记 $s"; exit 1; }
          done
          strings "$APP_DYLIB" | grep -q 'com.aevon.rightedgetrigger' \
            || { echo "::error::AevonApp.dylib 缺少回传通知名 com.aevon.rightedgetrigger（判向成立后 SB 呼不出圆盘）"; exit 1; }
          # V0.2.2：判向阈值已提前到 8pt（见下方 V0.2.2 块），30pt 断言随之反转 ——
          # 留 8pt 断言，防止有人把阈值调回 30pt 重蹈 Aevon(88) 覆辙。
          grep -q 'dx <= -8.0' "$GITHUB_WORKSPACE/Sources/AppSide/AevonAppSide.m" \
            || { echo "::error::App 侧判向阈值不是 8pt（30pt 会被滚动容器 pan 抢先打断，Aevon(88) 根因）"; exit 1; }
          grep -q 'fabs(dx) >= fabs(dy) \* 1.2' "$GITHUB_WORKSPACE/Sources/AppSide/AevonAppSide.m" \
            || { echo "::error::App 侧判向缺少横向占优判据（|dx| ≥ |dy|×1.2，否则吃掉纵向滚动）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonAppTriggerBridgeV201' \
            || { echo "::error::主插件缺少 App 触发桥标记（AevonAppTriggerBridgeV201）"; exit 1; }
          strings "$DYLIB" | grep -q 'com.aevon.rightedgetrigger' \
            || { echo "::error::主插件缺少回传通知监听名 com.aevon.rightedgetrigger"; exit 1; }
          echo "V0.2.1 校验: App 侧真接管（delays+cancels / 30pt 判向 / 三指急救）+ Darwin 回传桥 已就位"

          # V0.2.2（AevonAppEarlyJudgeV202）：Aevon(88) 根因 —— 30pt 判向太慢，
          # App 内滚动容器的 pan ~10pt（不分方向）Began 抢先，横向呼盘手指全部在
          # App 侧被 touchesCancelled 静默打断。判向成功阈值提前到 8pt（SB 侧
          # 0.1.9 同款先例），touchesCancelled 补取证。
          for s in AevonAppEarlyJudgeV202; do
            strings "$APP_DYLIB" | grep -q "$s" \
              || { echo "::error::AevonApp.dylib 缺少 0.2.2 标记 $s"; exit 1; }
          done
          grep -q 'dx <= -8.0' "$GITHUB_WORKSPACE/Sources/AppSide/AevonAppSide.m" \
            || { echo "::error::App 侧判向阈值不是 8pt —— 30pt 会被滚动容器 pan ~10pt 抢先打断（Aevon(88) 根因）"; exit 1; }
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AppSide/AevonAppSide.m" \
            | grep -q '序列被取消' \
            || { echo "::error::touchesCancelled 取证被删 —— 竞争断裂又会隐形（Aevon(88) 教训）"; exit 1; }
          grep -q 'AevonPanicHintOnceV202' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::急救启动提示幂等标记被删（Aevon(88) 连打两遍）"; exit 1; }
          echo "V0.2.2 校验: 判向 8pt 提前 + cancelled 取证 + 急救提示幂等 已就位"

          # V0.2.3（AevonAppStuckGuardV203 / AevonAppYieldV203 / AevonAppYieldNotifyV203）：
          # Aevon(89) 根因 —— 4 根手指「began 已扣住」后在 App 进程内整段断流
          # （无 moved / 无取消 / 无抬手），全部伴随 SB 热区同时接管。
          # 三道防线：① App 侧带内 began 即广播 rightedgebegan，SB 停吞让路；
          # ② App 侧 1.5s 未判定主动 Failed 自愈；③ 首帧移动取证行。
          for s in AevonAppStuckGuardV203 AevonAppYieldNotifyV203; do
            strings "$APP_DYLIB" | grep -q "$s" \
              || { echo "::error::AevonApp.dylib 缺少 0.2.3 标记 $s"; exit 1; }
          done
          grep -q 'AevonAppYieldV203' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::SB 侧让路标记被删 —— 热区与 App 侧竞速无人让路（Aevon(89) 根因）"; exit 1; }
          grep -q 'com.aevon.rightedgebegan' "$GITHUB_WORKSPACE/Sources/AppSide/AevonAppSide.m" \
            && grep -q 'com.aevon.rightedgebegan' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::rightedgebegan 通知名两端不一致"; exit 1; }
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AppSide/AevonAppSide.m" \
            | grep -q '首帧移动' \
            || { echo "::error::首帧移动取证被删 —— 断流是「没收到」还是「没写」又会不可判"; exit 1; }
          echo "V0.2.3 校验: SB 让路通道 + App 侧卡死自愈 + 首帧移动取证 已就位"

          # V0.2.4（AevonAppAllAppsV204 / AevonAppExcludeV204）：全 App 白名单。
          #   ① App 侧 dylib 编入 2 条新标记；
          #   ② SpringBoard 分支（让位主插件）与排除表（内置 + AppSideExcludePrefixes）必须在；
          #   ③ 排除表至少要含 com.apple.springboard 与一个金融前缀（防误删兜底）。
          for s in AevonAppAllAppsV204 AevonAppExcludeV204; do
            strings "$APP_DYLIB" | grep -q "$s" \
              || { echo "::error::AevonApp.dylib 缺少 0.2.4 标记 $s"; exit 1; }
          done
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AppSide/AevonAppSide.m" \
            | grep -q 'com.apple.springboard' \
            || { echo "::error::App 侧 SpringBoard 让位分支被删 —— 会与主插件抢同一份逻辑"; exit 1; }
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AppSide/AevonAppSide.m" \
            | grep -q 'AppSideExcludePrefixes' \
            || { echo "::error::用户扩展排除键 AppSideExcludePrefixes 被删 —— 出问题的 App 将无处可排"; exit 1; }
          grep -q 'com.chinamworld' "$GITHUB_WORKSPACE/Sources/AppSide/AevonAppSide.m" \
            || { echo "::error::排除表缺金融前缀兜底（com.chinamworld）"; exit 1; }
          echo "V0.2.4 校验: 全 App 白名单（Classes=[UIApplication]）+ SB 让位 + 排除表 已就位"

          # V0.2.5（AevonAppWinAuthV205 / AevonAppTwoFrameV205）：权威判向 + 两帧确认。
          #   Aevon(91) 判读：链路在跑但用户仍报「App 跟着动」——
          #   ① 失败要求（带内 pan/swipe 必须等本识别器 Failed）必须在（权威判向）；
          #   ② 两帧确认 + 14pt 快划豁免 + 抬手快判必须在（防首帧误触发）；
          #   ③ 桥接动态域（AevonAppProbeWideV205）必须在（第三方 App 日志可见）。
          for s in AevonAppWinAuthV205 AevonAppTwoFrameV205; do
            strings "$APP_DYLIB" | grep -q "$s" \
              || { echo "::error::AevonApp.dylib 缺少 0.2.5 标记 $s"; exit 1; }
          done
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AppSide/AevonAppSide.m" \
            | grep -q 'shouldBeRequiredToFailByGestureRecognizer' \
