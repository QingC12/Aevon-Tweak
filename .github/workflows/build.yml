            || { echo "::error::V0.3.28 召盘时没申请断言"; exit 1; }
          [ "$(grep -c 'AevonGripAssertRelease();' "$GH26")" -ge 2 ] \
            || { echo "::error::V0.3.28 断言释放点不足（至少 ownPass 与 reset 两处）"; exit 1; }
          grep -qF 'AevonGripAssertTick();' "$GH26" \
            || { echo "::error::V0.3.28 没有周期性超时检查"; exit 1; }
          #    释放点必须覆盖 reset —— UIKit 保证 Ended/Cancelled/Failed 之后一定调它
          sed -n '/^- (void)reset {/,/^}/p' "$GH26" | grep -qF 'AevonGripAssertRelease();' \
            || { echo "::error::V0.3.28 reset 里没有释放断言（最可靠的一道收尾）"; exit 1; }

          echo "V0.3.28 校验: 单层 15pt 贴边带 + 带内只看位移不看方向 + 借腿动态让路 + 系统手势断言（5s 超时兜底）✓"

          # ── V0.3.29 校验（Aevon(102) 定档「A + B」）──
          # 用户反馈：「桌面触发圆盘手势时百分百触发桌面滑动」「抖音中触发手势时因为贴边，
          # 大几率会触发抖音的左滑进入视频博主主页」。定量：92 hold → 92 summon（100%），
          # 桌面 40 / 抖音 37 / QQ 12 / 设置 2 / 微信 1。
          # 根因：`presentRing` 无条件把 ringSource 写成 "global"，自建腿的手指下一帧被
          # 「收养」分支接走（只喂不吞）→ 手指裸奔到桌面与 App。Aevon(101) 日志同构，
          # 说明不是新版引入的病，是召唤率涨到 100% 之后每次都能看见。
          # ① 三个标记必须进主库二进制
          for s in AevonOwnSwallowV329 AevonOwnTouchBindV329 AevonDeskPanGuardV329; do
            strings "$MYD28" | grep -qF "$s" \
              || { echo "::error::V0.3.29 主库缺标记 $s"; exit 1; }
          done

          # ② 方案 A：ObjC 侧把手指身份递出去 + 移交簿记
          grep -qF 'uintptr_t AevonGripOwnTouchID(void)' "$GH26" \
            || { echo "::error::V0.3.29 缺 AevonGripOwnTouchID 导出（Swift 侧无从绑定）"; exit 1; }
          grep -qF 'gAevonOwnTouchID = (uintptr_t)(__bridge void *)t;' "$GH26" \
            || { echo "::error::V0.3.29 touchesBegan 没记手指身份"; exit 1; }
          grep -qF 'void AevonGripOwnHandoff(void)' "$GH26" \
            || { echo "::error::V0.3.29 缺 AevonGripOwnHandoff（会留下 2.5s 新落指死窗口）"; exit 1; }
          sed -n '/^- (void)reset {/,/^}/p' "$GH26" | grep -qF 'gAevonOwnTouchID = 0;' \
            || { echo "::error::V0.3.29 reset 没作废手指身份（指针复用会绑错手指）"; exit 1; }
          sed -n '/^- (void)ownPass:/,/^}/p' "$GH26" | grep -qF 'gAevonOwnTouchID = 0;' \
            || { echo "::error::V0.3.29 ownPass 没作废手指身份"; exit 1; }
          #   ⛔ ownHandoff 里不许改 state —— 改 state 会让 UIKit 把延迟中的触摸补投给下层
          python3 -c "import io,sys;s=io.open(sys.argv[1],encoding='utf-8').read();i=s.find('- (void)ownHandoff {');j=s.find(chr(10)+'}',i);b=s[i:j] if i>0 else '';ok=(i>0 and 'self.state' not in b and '_ownSummoned = NO;' in b);print('V0.3.29 ownHandoff 只清簿记不动 state ✓' if ok else '::error::V0.3.29 ownHandoff 改了识别器 state（会把延迟触摸补投给下层）');sys.exit(0 if ok else 1)" "$GH26"

          # ③ 方案 A：Swift 侧真绑 + 堵住「收养降级」
          grep -qF '@_silgen_name("AevonGripOwnTouchID")' "$EE" \
            || { echo "::error::V0.3.29 Swift 侧没声明 AevonGripOwnTouchID"; exit 1; }
          grep -qF '@_silgen_name("AevonGripOwnHandoff")' "$EE" \
            || { echo "::error::V0.3.29 Swift 侧没声明 AevonGripOwnHandoff"; exit 1; }
          grep -qF 'if source == "ownleg", AevonPrefs.bool("OwnSwallow", default: true) {' "$EE" \
            || { echo "::error::V0.3.29 自建腿召唤没有绑定全局吞层（回退开关叫 OwnSwallow）"; exit 1; }
          grep -qF 'ownSwallowBound = true' "$EE" \
            || { echo "::error::V0.3.29 绑定后没置 ownSwallowBound"; exit 1; }
          grep -qF 'gripAdoptedTouchID = 0' "$EE" \
            || { echo "::error::V0.3.29 绑定后没清收养指纹（shouldSwallow 会立刻放行）"; exit 1; }
          grep -qF 'ring.remoteMoved(to: point, source: "global", authoritative: ownSwallowBound)' "$EE" \
            || { echo "::error::V0.3.29 改道后的喂盘丢了权威标记（跟手会退化）"; exit 1; }
          #   ⛔ 两条收养分支都必须带 !ownsTouch，少一条就等于留了一条降级路
          [ "$(grep -cF '!ownsTouch, !appEdgePointerAdopted' "$EE")" -ge 2 ] \
            || { echo "::error::V0.3.29 收养分支没堵全（moved/ended 都要 !ownsTouch）"; exit 1; }
          #   ⛔ 吞层接手后识别器收不到 ended → reset 不来 → 断言必须显式还
          grep -qF '@_silgen_name("AevonGripAssertRelease")' "$EE" \
            || { echo "::error::V0.3.29 Swift 侧没有归还断言的通道（呼一次盘就丢右滑返回）"; exit 1; }
          [ "$(grep -cF 'if ownSwallowBound { AevonGripAssertReleaseBridge() }' "$EE")" -ge 4 ] \
            || { echo "::error::V0.3.29 断言显式归还点不足（ended/cancelled/自愈/收起 四处都要）"; exit 1; }

          # ④ 方案 B：桌面翻页 pan 强制判失败（与吞层无关的第二道）
          grep -qF 'static BOOL AevonGripDeskPanShouldFail(id recog)' "$GH26" \
            || { echo "::error::V0.3.29 缺桌面 pan 守卫"; exit 1; }
          grep -qF 'UIScrollViewPanGestureRecognizer' "$GH26" \
            || { echo "::error::V0.3.29 桌面守卫没判识别器类型"; exit 1; }
          grep -qF 'gAevonOwnSummonAtGuard = CACurrentMediaTime();' "$GH26" \
            || { echo "::error::V0.3.29 守卫窗口没有起算点"; exit 1; }
          [ "$(grep -cF 'if (state == 1 && AevonGripDeskPanShouldFail(self))' "$GH26")" -ge 2 ] \
            || { echo "::error::V0.3.29 setState 公私两个入口都要接守卫"; exit 1; }
          [ "$(grep -cF 'state = 4;' "$GH26")" -ge 2 ] \
            || { echo "::error::V0.3.29 守卫没把状态降成 Failed"; exit 1; }
          #   ⛔ 守卫必须四个条件齐全，任何一条漏掉都会误杀普通滚动
          python3 -c "import io,sys;s=io.open(sys.argv[1],encoding='utf-8').read();i=s.find('static BOOL AevonGripDeskPanShouldFail(id recog) {');j=s.find(chr(10)+'}',i);b=s[i:j] if i>0 else '';need=['gAevonOwnSummonAtGuard','UIScrollViewPanGestureRecognizer','HomeScreen','p.x < sw - 40.0'];miss=[n for n in need if n not in b];ok=(i>0 and not miss);print('V0.3.29 桌面守卫四条件齐全 ✓' if ok else '::error::V0.3.29 桌面守卫缺条件：'+','.join(miss));sys.exit(0 if ok else 1)" "$GH26"

          echo "V0.3.29 校验: 自建腿手指绑全局吞层（桌面/App 都收不到）+ 兜住收养降级 + 断言显式归还 + 桌面翻页 pan 吊销 ✓"

          # ── V0.3.30 校验（Aevon(103) 定档「落指即预绑」）──
          # 用户反馈：「修复没有效果，甚至更加严重了，现在设置、QQ、抖音全屏时呼出圆盘
          # 手势都会带动 app 内操作」。定量：63 hold → 36 召唤 → **36 次绑定成功**、
          # 0 次「身份为空」，抬手帧 37 次全部从全局通道回来 → 0.3.29 的「识别器 UITouch
          # 与 SB sendEvent 同一批实例」假设成立；桌面 pan 被吊销 21 次。
          # 真因是结构性漏帧：吞层判据在 SB `-sendEvent:`，识别器在**同一次** sendEvent
          # 内部才判定，所以「began + 首帧 moved」必然先投给 App（首帧位移中位 18pt、
          # 最大 49pt），之后才被吞 —— App 拿到一个高速横向帧后彻底静止。
          TH30="$GITHUB_WORKSPACE/Sources/AevonTouchHook.m"

          # ① 三个标记必须进主库二进制
          for s in AevonEarlyBindV330 AevonPreBindCancelV330 AevonSwallowTickV330; do
            strings "$MYD28" | grep -qF "$s" \
              || { echo "::error::V0.3.30 主库缺标记 $s"; exit 1; }
          done

          # ② ObjC：落指预绑 + 放行时撤销 + 吞帧计数
          grep -qF 'void AevonGripOwnPreBind(double x, double y)' "$GH26" \
            || { echo "::error::V0.3.30 缺落指预绑入口"; exit 1; }
          grep -qF 'AevonGripPreBindTouch(tid, x, y);' "$GH26" \
            || { echo "::error::V0.3.30 预绑没有把身份交给 Swift"; exit 1; }
          sed -n '/^- (void)ownPass:/,/^}/p' "$GH26" | grep -qF 'AevonGripPreBindCancel(0);' \
            || { echo "::error::V0.3.30 ownPass 没撤销预绑（右缘点击会被扣到 4s）"; exit 1; }
          grep -qF 'void AevonGripOwnSwallowTick(void)' "$GH26" \
            || { echo "::error::V0.3.30 缺吞帧计数入口"; exit 1; }
          grep -qF '吞层实丢' "$GH26" \
            || { echo "::error::V0.3.30 lift 日志没打吞帧数（下次日志还是分不清）"; exit 1; }
          #   ⛔ 预绑必须在 touchesBegan 里、写完身份之后、记录 hold 时刻之前
          python3 -c "import io,sys;s=io.open(sys.argv[1],encoding='utf-8').read();i=s.find('- (void)touchesBegan:');j=s.find('- (void)touchesMoved:',i);b=s[i:j] if (i>0 and j>i) else '';k1=b.find('gAevonOwnTouchID = (uintptr_t)(__bridge void *)t;');k2=b.find('AevonGripOwnPreBind((double)p.x, (double)p.y);');k3=b.find('AevonGripOwnStampHold();');ok=(i>0 and k1>0 and k2>k1 and (k3<0 or k2<k3));print('V0.3.30 预绑位于 touchesBegan 身份之后 hold 之前 ✓' if ok else '::error::V0.3.30 预绑调用点位置不对（必须在 touchesBegan 内、身份赋值之后）');sys.exit(0 if ok else 1)" "$GH26"

          # ③ Swift：预绑本体 + 转正 + 抬手帧放行
          grep -qF '@_cdecl("AevonGripPreBindTouch")' "$EE" \
            || { echo "::error::V0.3.30 Swift 侧没有预绑入口"; exit 1; }
          grep -qF '@_cdecl("AevonGripPreBindClear")' "$EE" \
            || { echo "::error::V0.3.30 Swift 侧没有撤销预绑入口"; exit 1; }
          grep -qF 'AevonPrefs.bool("EarlySwallow", default: true)' "$EE" \
            || { echo "::error::V0.3.30 预绑没有回退开关（回退开关叫 EarlySwallow）"; exit 1; }
          grep -qF 'let prebound = (globalTouchID == tid && ownsTouch)' "$EE" \
            || { echo "::error::V0.3.30 召唤时没有「转正」分支（会重绑一次，白丢状态）"; exit 1; }
          grep -qF 'if preBindTid != 0, touchID == preBindTid, phase == 3 || phase == 4 {' "$EE" \
            || { echo "::error::V0.3.30 抬手帧没有放行（App 会留「有 began 无终止帧」的孤儿触摸）"; exit 1; }
          grep -qF 'ownLegPreBindCancel(tid: preBindTid)' "$EE" \
            || { echo "::error::V0.3.30 预绑没有超时兜底"; exit 1; }
          #   ⛔ 抬手帧放行必须排在「收养指纹一律放行」之前，否则永远走不到
          python3 -c "import io,sys;s=io.open(sys.argv[1],encoding='utf-8').read();i=s.find('static func shouldSwallowGlobalTouch');j=s.find('guard CACurrentMediaTime() <= swallowDeadline',i);b=s[i:j] if (i>0 and j>i) else '';a=b.find('if preBindTid != 0, touchID == preBindTid, phase == 3 || phase == 4');c=b.find('if gripAdoptedTouchID != 0');ok=(i>0 and a>0 and (c<0 or a<c));print('V0.3.30 抬手放行排在收养放行之前 ✓' if ok else '::error::V0.3.30 抬手放行被收养分支挡在前面（永远走不到）');sys.exit(0 if ok else 1)" "$EE"

          # ④ 钩子侧：真的丢弃才计数
          grep -qF 'extern void AevonGripOwnSwallowTick(void);' "$TH30" \
            || { echo "::error::V0.3.30 钩子侧没有声明计数入口"; exit 1; }
          grep -qF 'AevonGripOwnSwallowTick();' "$TH30" \
            || { echo "::error::V0.3.30 吞层丢弃分支没有累加（下次日志证不出吞没吞）"; exit 1; }

          echo "V0.3.30 校验: 落指即预绑（漏帧从 18~49pt 降到 0）+ 抬手帧放行（消孤儿触摸）+ 吞帧计数 ✓"



      # V0.2.83（AevonSymExportV283）：导出**未 strip** 的 dylib + dSYM，只给离线符号化用。
      # 为什么要它：真机崩溃日志里只有「模块 + 偏移」，而发布用的 dylib 被 strip 到只剩
      # 60 个导出符号、0 个本地函数符号 —— 0.2.82 那份崩溃栈就是这么废掉的（连帧 1 都
      # 是 AevonBacktrace 的调用者，整条栈不是现场）。有了这份带符号的副本，
      # 下次拿到 pc 就能一条命令对出函数名，不用再靠反汇编猜。
      # 注意：这些文件**不进 deb**（deb 在打包时就已从 .theos/_ 取好），只随 artifact 上传。
      - name: 导出符号副本（未 strip dylib + dSYM）
        run: |
          mkdir -p packages/_sym
          for name in Aevon AevonApp; do
            for cand in ".theos/obj/arm64e/$name.dylib" ".theos/obj/$name.dylib"; do
              if [ -f "$cand" ]; then
                cp "$cand" "packages/_sym/$name.debug.dylib"
                echo "导出 $cand → _sym/$name.debug.dylib ($(wc -c < "$cand") 字节)"
                break
              fi
            done
            for dsym in ".theos/obj/arm64e/$name.dylib.dSYM" ".theos/obj/$name.dylib.dSYM"; do
              if [ -d "$dsym" ]; then
                cp -R "$dsym" "packages/_sym/"
                echo "导出 $dsym"
                break
              fi
            done
          done
          ls -la packages/_sym || true
          # 自检：导出的副本里本地函数符号必须 > 0（否则等于没导）
          for f in packages/_sym/*.debug.dylib; do
            [ -f "$f" ] || continue
            n=$(nm -a "$f" 2>/dev/null | grep -c ' [tT] ' || true)
            echo "$(basename "$f") 本地函数符号数 = $n"
          done

      # 产物只上传为 artifact（不发 Release）。下载方式见交付说明。
      - name: 上传产物（artifact，不发 Release）
        uses: actions/upload-artifact@v4
        with:
          name: Aevon-deb
          path: |
            packages/*.deb
            packages/_sym/**
          if-no-files-found: error

      - name: 输出产物信息到日志
        run: |
          DEB="$(ls packages/*.deb | head -n1)"
          echo "产物: $(basename "$DEB")"
          echo "大小: $(wc -c < "$DEB") 字节"
          echo "MD5: $(md5 -q "$DEB")"
