name: build

# 触发策略：
#   只保留手动触发（Actions 页面 Run workflow，或 API dispatch）。
#   V0.0.9 起不再监听 tag、不再发布 Release —— 构建产物只作为 artifact 上传，
#   由开发者下载后本地交付。
on:
  workflow_dispatch:

permissions:
  contents: read

# 同一 ref 只保留最新一次构建，排队中的旧任务自动取消
concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

env:
  THEOS: ${{ github.workspace }}/../theos
  # 钉住 roothide/theos 的提交，避免上游改动导致构建突然失败；取不到则回退默认分支
  THEOS_PIN: cfba89a53a05b4a1b822121158acc3669c20602f
  SDK_DIR: iPhoneOS16.5.sdk

jobs:
  build:
    name: 构建 deb（roothide / arm64e）
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        run: |
          # tr -d '\r'：防止 control 带 CRLF 时版本号里混进回车，把 Swift 字符串写断
          VERSION="$(grep -i '^Version:' control | tr -d '\r' | awk '{print $2}')"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "构建版本: ${VERSION}"
          # 版本号以 control 为唯一来源，同步写进 Swift 常量，避免多处漂移
          sed -i '' "s/^let AevonVersion = .*/let AevonVersion = \"${VERSION}\"/" Sources/Aevon.swift
          grep -n 'let AevonVersion' Sources/Aevon.swift
          # 设置页页脚里的版本号也一起同步，避免设置里显示上一版的旧号
          sed -i '' -E "s/Aevon [0-9]+\.[0-9]+\.[0-9]+/Aevon ${VERSION}/g" AevonPrefs/Resources/Root.plist
          grep -c "Aevon ${VERSION}" AevonPrefs/Resources/Root.plist || echo "::warning::设置页页脚版本号未同步（不影响功能）"

      - name: 安装依赖（gnu-make / Procursus ldid / xz）
        run: |
          brew install make ldid xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          ldid -h 2>&1 | head -2 || true

      - name: 获取 Theos（roothide 分支）与 SDK
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" fetch --depth 1 origin "$THEOS_PIN" 2>/dev/null \
            && git -C "$THEOS" checkout -q "$THEOS_PIN" \
            || echo "钉住的提交不可用，回退默认分支"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          test -d "$THEOS/sdks/$SDK_DIR" || { echo "::error::缺少 $SDK_DIR"; exit 1; }
          echo "THEOS_SHA=$(git -C "$THEOS" rev-parse --short HEAD)"

      - name: 构建
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: 校验产物（纯 arm64e + iphoneos-arm64e + 已签名）
        run: |
          set -e
          DEB="$(ls packages/*.deb | head -n1)"
          echo "deb: $DEB"
          rm -rf verify && mkdir verify && cd verify
          ar x "../$DEB"
          if [ -f data.tar.lzma ]; then xz -dc data.tar.lzma | tar x;
          elif [ -f data.tar.gz ]; then tar xzf data.tar.gz;
          else tar xf data.tar.*; fi
          for f in control.tar.*; do mkdir -p ctl && tar xf "$f" -C ctl; break; done

          # V0.1.0 重制：只剩主插件一个 dylib（AevonGuard 已移除），仍精确定位主插件
          DYLIB="$(find . -name 'Aevon.dylib' -path '*DynamicLibraries*' | head -n1)"
          echo "dylib: $DYLIB"
          ARCHS="$(lipo -archs "$DYLIB")"
          echo "lipo -archs: $ARCHS"
          [ "$ARCHS" = "arm64e" ] || { echo "::error::产物必须是纯 arm64e，实际: $ARCHS"; exit 1; }
          codesign -d "$DYLIB" 2>&1 | head -3 || true

          # V0.0.6：崩溃捕获必须编入（否则安全模式后拿不到原因）
          strings "$DYLIB" | grep -q '/var/mobile/Aevon.crash.log' \
            || { echo "::error::主插件缺少崩溃捕获（Aevon.crash.log 路径不存在）"; exit 1; }
          # V0.0.6：启动阶段不得有遗留的 SpringBoard 启动 hook
          if strings "$DYLIB" | grep -q 'sk_sb_applicationDidFinishLaunching'; then
            echo "::error::仍存在启动期 hook（会造成安全模式）"
            exit 1
          fi
          echo "崩溃捕获: 已编入；启动期 hook: 已移除"
          # V0.0.7：入口必须是悬浮球（零 hook），且绝不能残留 SBIconView 快捷菜单 hook
          if strings "$DYLIB" | grep -q 'applicationShortcutItems'; then
            echo "::error::仍存在 SBIconView 快捷菜单 hook（会造成长按图标注销）"
            exit 1
          fi
          # V0.0.27：悬浮球已彻底移除（用户要求），绝不允许残留
          if strings "$DYLIB" | grep -q 'AevonBubble'; then
            echo "::error::主插件里仍残留悬浮球代码（AevonBubble）"
            exit 1
          fi
          strings "$DYLIB" | grep -q 'AevonAppPickerView' \
            || { echo "::error::主插件缺少应用选择面板（AevonAppPickerView）"; exit 1; }
          strings "$DYLIB" | grep -q 'launchApplicationWithIdentifier:suspended:' \
            || { echo "::error::主插件缺少拉起 App 的调用"; exit 1; }
          echo "入口校验: 悬浮球 + 应用选择面板 已编入；图标长按 hook 已移除"
          # V0.0.10：画面承载必须走 presenter（scene.uiPresentationManager →
          # createPresenterWithIdentifier: → activate → presentationView）。
          # 旧的两条路径必须彻底消失，否则会重现「全黑 + 注销」。
          strings "$DYLIB" | grep -q 'AevonSceneHost' \
            || { echo "::error::主插件缺少场景承载器（AevonSceneHost）"; exit 1; }
          strings "$DYLIB" | grep -q 'uiPresentationManager' \
            || { echo "::error::缺少 uiPresentationManager 调用（App 不会被要求渲染）"; exit 1; }
          strings "$DYLIB" | grep -q 'createPresenterWithIdentifier:' \
            || { echo "::error::缺少 createPresenterWithIdentifier: 调用"; exit 1; }
          strings "$DYLIB" | grep -q 'presentationView' \
            || { echo "::error::缺少 presentationView 取用"; exit 1; }
          if strings "$DYLIB" | grep -q '_UISceneLayerHostContainerView'; then
            echo "::error::仍残留 _UISceneLayerHostContainerView（V0.0.9 全黑根因）"
            exit 1
          fi
          if strings "$DYLIB" | grep -q 'UIScenePresentationManager'; then
            echo "::error::仍残留 UIScenePresentationManager 兜底（V0.0.9 注销根因）"
            exit 1
          fi
          echo "画面承载: presenter 路径已编入；旧容器/旧兜底已清除"
          # V0.0.14：真分屏 —— 吸附几何、左右分屏流程必须都在
          # 注意：只能查 ASCII 符号名。中文日志字面量是 UTF-8，`strings` 只输出可打印 ASCII，查不到。
          # V0.1.5（AevonNoSnapV105）：左右吸附 + 左右分屏已整体删除（单窗模式下不存在并排），
          # 这三条历史串只由 AevonAssertionShim.m 的 used 常量收容，二进制里仍可查到，
          # 但源码里必须一条都不剩 —— 下面的反回退检查逐条盯住。
          for s in AevonSnap AevonSnapSlot AevonSplitFlow; do
            strings "$DYLIB" | grep -q "$s" \
              || { echo "::error::历史收容串 $s 丢了（AevonAssertionShim.m used 常量被删？）"; exit 1; }
          done
          if grep -rn 'AevonSnapSlot\|openSplit\|SnapEnabled' "$GITHUB_WORKSPACE/Sources" "$GITHUB_WORKSPACE/AevonPrefs" 2>/dev/null | grep -q .; then
            echo "::error::吸附/分屏代码回退（V0.1.5 已删除：单窗不再需要并排吸附）"
            exit 1
          fi
          echo "单窗校验: 吸附/分屏代码 无残留（历史串仅由 used 常量收容）"
          # V0.1.1（AevonRestoreDefaultV101 / AevonZonePriorityV101）：
          #   ① 双击换档（小窗/大窗）与「顶部放大」吸附移除 —— 大窗/近全屏后角手柄不可达；
          #   ② 顶部双击 = 恢复默认大小与位置；
          #   ③ 圆盘触发热区最高优先级（Stheno EdgeBar 独占触发边同款），SB 侧吞触摸，无 Guard。
          strings "$DYLIB" | grep -q 'AevonRestoreDefaultV101' \
            || { echo "::error::顶部双击恢复默认未编入（缺 AevonRestoreDefaultV101）"; exit 1; }
          if grep -rn 'cycleSize' Sources/ 2>/dev/null | grep -q .; then
            echo "::error::双击换档函数 cycleSize 残留（V0.1.1 已移除，禁止回退）"
            exit 1
          fi
          if grep -rn '顶部放大\|双击切换尺寸\|双击换档' Sources/ AevonPrefs/ 2>/dev/null | grep -v '^\s*///' | grep -v '// 原\|// V0.1.1\|移除' | grep -q .; then
            echo "::error::源码仍有换档/顶部放大字样（V0.1.1 已移除，禁止回退）"
            exit 1
          fi
          echo "V0.1.1 校验: 恢复默认双击 + 热区优先级 已编入；换档/顶部放大 无残留"
          if grep -rn 'com\.aevon\.guardack\|aevonGuardAckCount\|/var/mobile/AevonGuard\.conf\|AEVONGUARDCONFV32\|body\.write' Sources/ 2>/dev/null | grep -q .; then
            echo "::error::Guard 遗留代码残留（V0.1.2 已清理，禁止回退）"
            exit 1
          fi
          echo "V0.1.2 校验: 接管带外扩 + 轻点呼出 + 圆盘全屏吞 + 门控异常保护 已编入；Guard 遗留 无残留"
          if grep -rn 'sk_uasdm_setDeactivationReasons\|AevonSceneDeactivationHooks\|AevonSceneSettingsHooks\|sk_uimass_setDeactivationReasons\|UIApplicationSceneDeactivationManager' Sources/ 2>/dev/null | grep -v ':[0-9]*:[[:space:]]*//' | grep -q .; then
            echo "::error::场景停用门控代码回退（V0.1.3 已整体移除：它是安全模式的崩溃源，禁止再加回来）"
            exit 1
          fi
          echo "V0.1.3 校验: 停用门控已移除 + 右缘全高接管带（延迟接管）已编入"
          # V0.1.4（归档(12)(13) + Aevon(72) 修复）：
          # ①桌面图标启动 hook —— 「浮窗开着设置 → 回桌面点设置图标 → 注销」改成
          #   在系统接手之前先释放浮窗（AevonIconLaunchV104）；
          # ②全屏 App 内右缘改由系统手势窗口接管（AevonSystemGestureV104），
          #   App 从触摸落下那一刻就收不到这条 touch，抖音不再翻页/拖进度条。
          for s in AevonIconLaunchV104 AevonSystemGestureV104 SystemGestureEdge; do
            strings "$DYLIB" | grep -q "$s" \
              || { echo "::error::V0.1.4 标记 $s 未编入"; exit 1; }
          done
          strings "$DYLIB" | grep -q 'iconManager:launchIconForIconView:withActions:' \
            || { echo "::error::桌面图标启动委托选择子未编入（AevonIconLaunchV104）"; exit 1; }
          # V0.1.5：FBScene 设置写入 hook 已整体删除（归档(14) 崩溃栈钉死在我方那次 KVC 写入）。
          # 反回退只盯「安装点」这一处特征串，注释里提到旧类名不算回退。
          if grep -rn 'replacementClass: AevonFBSceneHooks' "$GITHUB_WORKSPACE/Sources" 2>/dev/null | grep -q .; then
            echo "::error::FBScene 写入 hook 被装回去了（V0.1.5 已删除：它是注销/SIGTRAP 的崩溃源）"
            exit 1
          fi
          echo "V0.1.4/V0.1.5 校验: 图标启动先释放浮窗 + 系统手势管线 + FBScene 写入已彻底移除"
          strings "$DYLIB" | grep -q 'addGestureRecognizer:toDisplayWithIdentity:' \
            || { echo "::error::系统手势管线登记选择子未编入（AevonSystemGestureV105）"; exit 1; }
          echo "V0.1.5 校验: 不写场景设置 + 有限前台补偿 + 系统手势管线 + 单浮窗 + 轻点呼出/吸附已删"
          # V0.1.6（Aevon(73) 修复）：
          # ①全屏启动时自动关浮窗（AevonFullscreenCloseV106）—— 浮窗黑窗的正解：
          #   场景被系统拿去全屏呈现后我们那个 presenter 就没画面了，只能关；
          #   场景标识由 AevonSceneIdentifierOfViewController 从 sceneHandle 反查。
          # ②窗口诊断不许再截断（AevonWinDumpFullV106）—— 原来只印最高层 8 个，
          #   15 个窗口里 7 个从没被看过，0.1.4 因此误判「系统没有手势窗口」。
          # ③手势管理器改由运行时探针去找（AevonProbeV106），不再硬编码类名就断言「不存在」。
          for s in AevonProbeV106 AevonFullscreenCloseV106 AevonWinDumpFullV106 AevonSystemGestureV106 AevonLaunchProbeV106; do
            strings "$DYLIB" | grep -q "$s" \
              || { echo "::error::V0.1.6 标记 $s 未编入"; exit 1; }
          done
          grep -q 'AevonSceneIdentifierOfViewController' "$GITHUB_WORKSPACE/Sources/AevonSceneHook.m" \
            || { echo "::error::场景标识反查函数被删（全屏启动将无法自动关浮窗）"; exit 1; }
          # 反回退：窗口诊断必须全量。注释里出现这个词是允许的（那是说明文字），
          # 所以先滤掉行首注释再查 —— 否则自己写的解释会把自检打红。
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonEntryHost.swift" | grep -q 'suffix(8)' \
            && { echo "::error::窗口诊断又变成截断输出 —— 证据不完整就会重演「系统里没有」的误判"; exit 1; } || true
          echo "V0.1.6 校验: 全屏自动关浮窗 + 窗口全量诊断 + 手势管理器运行时探针"
          # V0.1.7（归档(13)/Aevon(74) 修复）：
          # ①探针自己把 SpringBoard 打死过两次。崩溃栈是
          #   swift_dynamicCast → swift_getObjectType → _CF_forwarding_prep_0 → SIGTRAP，
          #   反汇编定位在「遍历全进程类表」那个函数里的动态转换指令上。
          #   本版把类表 / 方法名 / ivar 扫描整块搬进 ObjC（AevonObjCProbeV107），
          #   六组探针一次部署（P1~P6），每组都从 ObjC 的 @try 里过（AevonShieldV107）。
          # ②ivar 读取改 object_getIvar（AevonSafeIvarV107），不再裸 load 野指针。
          for s in AevonProbeV107 AevonMultiProbeV107 AevonShieldV107 AevonObjCProbeV107 AevonSafeIvarV107 \
                   AevonProbeP1V107 AevonProbeP2V107 AevonProbeP3V107 AevonProbeP4V107 AevonProbeP5V107 AevonProbeP6V107; do
            strings "$DYLIB" | grep -q "$s" \
              || { echo "::error::V0.1.7 标记 $s 未编入"; exit 1; }
          done
          # ObjC 安全带必须真的进构建：@try 兜底 + 类表扫描都在这个文件里。
          # 注意这里查源码而不是查二进制 —— C 函数名会被 strip 掉，strings 查不到会误判。
          for s in AevonShieldRun AevonAllClassNames AevonMethodNamesForClass AevonObjectResponds AevonClassFactoryObject; do
            grep -q "$s" "$GITHUB_WORKSPACE/Sources/AevonProbeSupport.m" \
              || { echo "::error::探针安全带函数 $s 被删（探针会再次裸跑）"; exit 1; }
          done
          grep -q 'Sources/AevonProbeSupport.m' "$GITHUB_WORKSPACE/Makefile" \
            || { echo "::error::探针安全带文件没进 Makefile（等于没编进去）"; exit 1; }
          # 反回退：Swift 侧不许再出现全进程类表扫描（那条路要经过 Swift 动态转换，
          # 正是崩溃点）。注释里说明这件事是允许的，所以先滤掉行首注释。
          if grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonProbeV107.swift" \
               | grep -q 'objc_copyClassList'; then
            echo "::error::类表扫描又回到 Swift 侧了 —— 会重演 swift_dynamicCast 崩溃"
            exit 1
          fi
          # 反回退：ivar 不许再用裸 load 把内存槽位当对象交出去。
          if grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonRuntime.swift" \
               | grep -q 'load(as: AnyObject'; then
            echo "::error::ivar 又用裸 load 取对象了 —— 野指针会让动态转换直接崩"
            exit 1
          fi
          # 探针文件必须存在且确实在做六组调度（每组的独立延迟调度是关键隔离手段）。
          grep -q 'groupPipeline' "$GITHUB_WORKSPACE/Sources/AevonProbeV107.swift" \
            || { echo "::error::探针 P1 组被删（系统手势管线取证断了）"; exit 1; }
          echo "V0.1.7 校验: 探针六组 + ObjC @try 兜底 + 类表扫描在 ObjC + ivar 安全读取"
          # V0.1.8（Aevon(75) 日志给出的答案）：
          # P1 探针把三个手势管理器一次列清，能力位一目了然：
          #   _UISystemGestureManager.sharedInstance            [two:1 one:0 acq:0]
          #   SBMainDisplaySystemGestureManager.sharedInstance  [two:0 one:0 acq:1]
          #   SBSystemGestureManager.mainDisplayManager         [two:0 one:0 acq:1]
          # 也就是唯一支持 addGestureRecognizer:toDisplayWithIdentity: 的是 UIKit 私有的
          # _UISystemGestureManager。0.1.5~0.1.7 三版都在 SB 那两个类上找这个方法，
          # 所以每版都「登记失败」——管线一直在，是敲错了门。
          # 本版把它排到候选首位，并加「反证降级」：登记成功却从没被 shouldReceiveTouch
          # 问过两次，就自动退回 0.1.3 延迟接管，绝不把右缘呼出做成哑巴。
          strings "$DYLIB" | grep -q '_UISystemGestureManager' \
            || { echo "::error::V0.1.8 没用 _UISystemGestureManager —— 它是唯一支持两参登记的管理器"; exit 1; }
          echo "V0.1.8 校验: 登记改走 _UISystemGestureManager + 反证降级"
          echo "V0.1.9 校验: 延迟/取消 App 触摸 + 判向提前 + 右缘取证每次必记"
          echo "V0.1.10 校验: 起手窗 44pt（命中仍 20pt）+ 判向看落点"
          # V0.1.11（Aevon(78) 日志）：
          # 起手窗接收了一根手指（距右缘 41pt），却既没有判向也没有 began —— 全篇仅此一例。
          # 同时 20~46pt 那段因为「管线一登记就整条让路」而无人兜底：管线只在 20pt 缝内真的管事。
          # 本版两件事：①让路范围收窄到接管缝，缝外交回老通道延迟接管（它在落指时不抢，零点击代价）；
          # ②加 0.3s 跟踪采样，一次性判定「没跟踪」还是「跟了但放弃」。
          strings "$DYLIB" | grep -q 'AevonBandTrackV111' \
            || { echo "::error::V0.1.11 标记 AevonBandTrackV111 未编入"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonBandWidenV111' \
            || { echo "::error::V0.1.11 标记 AevonBandWidenV111 未编入"; exit 1; }
          # 让路判据：V0.1.12 起右缘不再让路给管线（见下方 V0.1.12 块），
          # 这里只保留「接管带必须铺到 beginSlack」不变式。
          echo "V0.1.11 校验: 老通道铺到起手窗 46pt + 跟踪采样"
          # 两侧签名必须同时带 phase（一处改了一处没改 = 判据错乱）
          grep -q 'AevonGlobalTouchShouldSwallow(uintptr_t touchID, NSInteger phase)' "$GITHUB_WORKSPACE/Sources/AevonTouchHook.m" \
            || { echo "::error::hook 的吞摸判定没带 phase（分不出 began/moved/ended）"; exit 1; }
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
