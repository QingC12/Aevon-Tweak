          echo "V0.0.41 校验: 浮窗全局手势 已编入"
          # ── V0.1.0 重制：Guard 整体移除，反回退校验 ──
          if [ -n "$(find . -name 'AevonGuard.dylib' -path '*DynamicLibraries*')" ]; then
            echo "::error::V0.1.0 重制版不应再产出 AevonGuard.dylib（Guard 已整体移除）"; exit 1
          fi
          if [ -n "$(find . -name 'AevonGuard.plist')" ]; then
            echo "::error::V0.1.0 重制版不应再包含 AevonGuard.plist"; exit 1
          fi
          if grep -rq 'AevonSwitcherGuard\|AevonIdleGuard\|AevonSceneShim\|AevonIdleShim\|AevonOverlayShim' "$GITHUB_WORKSPACE/Sources" "$GITHUB_WORKSPACE/Aevon-Bridging-Header.h" 2>/dev/null; then
            echo "::error::V0.1.0 重制版不应再引用已移除的 Guard/后期垫片符号"; exit 1
