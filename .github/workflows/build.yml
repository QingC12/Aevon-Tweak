          # (411,744) 只差 1pt。覆盖率 17pt×60% = 0/4、28pt×60% = 1/4、46pt×60% = 3/4。
          # 结论：宽度可调但允许调到「必然落空」= 把「猜自己落点」的成本转给用户，本版改默认值 + 抬下限。
          for s in AevonRightEdgeDefaultV118 AevonRightEdgeMissHintV118 AevonRightEdgeWidenV118; do
