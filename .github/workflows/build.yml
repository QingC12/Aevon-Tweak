              || { echo "::error::V211 标记 $s 未收容进 AevonAssertionShim.m"; exit 1; }
          done
          echo "V0.2.11 校验: ⓘ 首次不压字 + 带区间 8~140pt/6~100% + 成立后保持在场直到抬手 + ringclose 收尾 + 心圆不压图标 已就位"

          # ---- V0.2.12（Aevon(98) 事故）：圆盘自动收起后整机只剩点击 ----
          # 事故现象：呼出圆盘后不在盘上选，圆盘自动收起 → 全屏 App 划不动，
          # 且系统手势（顶部下拉控制中心 / 底部上滑进后台 / 锁屏上滑解锁）全部失效，
          # 屏幕只剩点击可用。根因是两处状态泄漏同时发生，都必须有结构性的兜底：
          #   ① SpringBoard 侧 ownsTouch / globalTouchID 漏清 → 按 UITouch 指针吞摸，
          #      指针被池化复用后每一根新手指都命中 → SpringBoard 这一份触摸整体消失
          #      → 系统手势全废（App 那份是 backboardd 直投，所以点击还在）。
          #   ② App 侧识别器停在 .began 永不收尾 → 失败要求对本 App 所有带内平移恒 YES
          #      → App 内一切滚动被压死。
          grep -q 'AevonSwallowSelfHealV212' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::接管状态自愈被删 —— 圆盘收起后 SpringBoard 会继续吞触摸（整机只剩点击）"; exit 1; }
          grep -q 'healGlobalTakeoverIfNeeded()' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::自愈没有挂在 shouldSwallowGlobalTouch 入口上 —— 全系统触摸的必经之路才是唯一可靠的巡检点"; exit 1; }
          grep -q 'globalOwnHardLimit' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::接管状态缺绝对上限 —— moved 每次续期会让死手开关永远判不到期"; exit 1; }
          grep -q 'AevonEndAlwaysCleanV212' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::抬手/取消分支没有 defer 兜底清理 —— 任何一个 return 都会漏掉归还"; exit 1; }
          grep -q 'endedHeldGlobal' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::ended 分支的 defer 清理标记丢失"; exit 1; }
          grep -q 'cancelledHeldGlobal' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::cancelled 分支的 defer 清理标记丢失"; exit 1; }
          grep -q 'AevonReleaseAlsoClosesRingV212' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::释放接管时不再顺手收圆盘 —— 全屏圆盘视图会继续整屏吞摸"; exit 1; }
          grep -q 'AevonOwnHardDeadlineV212' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::死手开关没有改成按「收归起始时刻」算绝对上限"; exit 1; }
          grep -q 'AevonAppRingGoneGuardV212' "$GITHUB_WORKSPACE/Sources/AppSide/AevonAppSide.m" \
            || { echo "::error::App 侧没有圆盘状态位轮询 —— 识别器会永久停在 .began"; exit 1; }
          grep -q 'AevonAppRingBit' "$GITHUB_WORKSPACE/Sources/AppSide/AevonAppSide.m" \
            || { echo "::error::App 侧缺共享内存圆盘状态位读取（唯一不吃事件、不吃时序的判据）"; exit 1; }
          grep -q 'notify_register_check' "$GITHUB_WORKSPACE/Sources/AppSide/AevonAppSide.m" \
            || { echo "::error::App 侧圆盘状态位没有走 notify token 读取"; exit 1; }
          grep -q 'watchRingGoneWithToken' "$GITHUB_WORKSPACE/Sources/AppSide/AevonAppSide.m" \
            || { echo "::error::App 侧圆盘状态轮询函数丢失 —— 收尾判据又只剩「等抬手」"; exit 1; }
          grep -q 'AevonNotifyGetRing' "$GITHUB_WORKSPACE/AevonAssertionShim.h" \
            || { echo "::error::AevonNotifyGetRing 声明丢失"; exit 1; }
          grep -q 'AevonNotifyGetRing' "$GITHUB_WORKSPACE/AevonAssertionShim.m" \
            || { echo "::error::AevonNotifyGetRing 实现丢失"; exit 1; }
          grep -q 'AevonAppRingBit() == 0' "$GITHUB_WORKSPACE/Sources/AppSide/AevonAppSide.m" \
            || { echo "::error::失败要求没有接圆盘状态位总闸 —— 圆盘收起后 App 仍会被压住"; exit 1; }
          for s in AevonSwallowSelfHealV212 AevonEndAlwaysCleanV212 AevonReleaseAlsoClosesRingV212 \
                   AevonOwnHardDeadlineV212 AevonAppRingGoneGuardV212 AevonRingBitReadV212; do
            grep -q "$s" "$GITHUB_WORKSPACE/AevonAssertionShim.m" \
              || { echo "::error::V212 标记 $s 未收容进 AevonAssertionShim.m"; exit 1; }
          done
          echo "V0.2.12 校验: 接管状态全系统自愈 + 抬手/取消 defer 归还 + 释放即收盘 + 绝对上限 + App 侧圆盘状态位轮询 + 失败要求圆盘总闸 已就位"

          # ---- V0.2.13（AevonSysEdgeV213）：右缘改走系统手势管线的 withType 接口 ----
          #
          # 为什么重开这条 0.1.13 已经停手的路：三个前提同时变了。
          #   ① 登记接口换成 -addGestureRecognizer:withType: ——
          #      真机探针（Aevon(75)）只测过 toDisplayWithIdentity:（two:1/acq 位），
          #      这个带 type 的重载从未验证；Triggr（iOS 15–18）用的正是它。
          #   ② 识别器换成 UIScreenEdgePanGestureRecognizer（私有 init，type=2）——
          #      系统自己的边缘识别器，从边缘落手就进入判定，失败由 UIKit 归还，
          #      不需要「扣住 began 再整段补投」（0.1.19 判定不可做的那条死路）。
          #   ③ 触摸策略回到 UIKit 默认（cancelsTouchesInView=YES / delaysTouchesBegan=NO），
          #      即 Apple 给左缘返回手势用的那套：先给 App began，识别成功再 cancel。
          #
          # 本段只保证「这版确实编进去了、回退路径还在」，不保证真机上一定生效。
          grep -q 'Sources/AevonSysEdgeShim.m' "$GITHUB_WORKSPACE/Makefile" \
            || { echo "::error::AevonSysEdgeShim.m 没进 Makefile（等于没编进去）"; exit 1; }
          grep -q 'Sources/AevonSysEdgeV213.swift' "$GITHUB_WORKSPACE/Makefile" \
            || { echo "::error::AevonSysEdgeV213.swift 没进 Makefile"; exit 1; }
          for s in AevonSysEdgeV213 AevonSysEdgeWithTypeV213 AevonSysEdgeAllowTypeV213 \
                   AevonSysEdgePrivInitV213 AevonSysEdgeRegionV213; do
            strings "$DYLIB" | grep -q "$s" \
              || { echo "::error::V0.2.13 标记 $s 未编入"; exit 1; }
          done
          # 接口名必须真的编进二进制（NSSelectorFromString 的字面量在 __cstring）
          for sel in 'addGestureRecognizer:withType:' 'addGestureRecognizer:toDisplayWithIdentity:' \
                     'initWithTarget:action:type:options:' '_setEdgeRegionSize:' \
                     '_isGestureWithTypeAllowed:' '_shouldEnableSystemGestureWithType:'; do
            strings "$DYLIB" | grep -q "$sel" \
              || { echo "::error::V0.2.13 缺接口 $sel"; exit 1; }
          done
          # 触摸策略必须是 UIKit 默认值；绝不许再出现「手动延迟 began」那套
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonSysEdgeV213.swift" \
            | grep -q 'delaysTouchesBegan = false' \
            || { echo "::error::新通道又去延迟 began 了 —— 会退回 0.1.13 的补投死路"; exit 1; }
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonSysEdgeV213.swift" \
            | grep -q 'cancelsTouchesInView = true' \
            || { echo "::error::cancelsTouchesInView 不是 true —— App 那条触摸不会被取消，圆盘动 App 也动"; exit 1; }
          # 判向失败必须主动 Failed 归还（这是「右缘竖滑照样滚屏」的唯一保证）。
          # 注意不能写成 `gesture.state = .failed` —— Swift 侧 state 只读，必须走 ObjC 垫片。
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonSysEdgeV213.swift" \
            | grep -q 'AevonSysEdgeForceFail(gesture)' \
            || { echo "::error::判为纵向时不 Failed —— 右缘竖滑会被我们扣住"; exit 1; }
          grep -q 'void AevonSysEdgeForceFail' "$GITHUB_WORKSPACE/Sources/AevonSysEdgeShim.m" \
            || { echo "::error::ForceFail 垫片被删（Swift 无处可写 state）"; exit 1; }
          # 回退必须可用（用户明确要求：不行就回到 0.2.12 的方案）
          # ★ 0.2.17：这条通道已经是 0.2.16 实测里最快的一条（12 次呼盘里 6 次当先、
          #   判向 15~49ms、零长扣），所以从「用户可一键回退」改成「常开 + 偏好域逃生口」。
          grep -q 'AevonPrefs.bool("SysEdgeEnabled", default: true)' "$GITHUB_WORKSPACE/Sources/AevonSysEdgeV213.swift" \
            || { echo "::error::右缘系统手势通道不是常开（0.2.17 起设置页不再给开关）"; exit 1; }
          grep -q 'AevonSysEdgeV213.shared.install()' "$GITHUB_WORKSPACE/Sources/Aevon.swift" \
            || { echo "::error::新通道没有被安装（启动流程里没调 install）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonPipelineStandDownV113' \
            || { echo "::error::老通道停手标记丢失 —— 回退路径断了"; exit 1; }
          echo "V0.2.13 校验: 系统手势 withType 接口 + 私有 init + UIKit 默认触摸策略 + 纵向 Failed 归还 + 一键回退 已就位"

          # ---- V0.2.14（Aevon(100) 判读）：热区不再「按下即接管」+ began 看门狗 ----
          #
          # Aevon(100) 的账：15 次热区落指里 14 次「接管=是」，而 `ownsTouch` 只让
          # `UIApplication -sendEvent:` 不往下投 —— 只丢得掉 SpringBoard 自己那一份，
          # 前台 App 那份由 backboardd 直投、从没被碰过。而热区矩形（x 412~430 · y 664~932）
          # 正好压在底部系统手势区上：底部上滑回桌面 / 锁屏上滑解锁 / 顶部下拉都挂在
          # SpringBoard 自己的 `UISystemGestureView` 上 —— 被丢掉的正是它们。
          # 收益 0、代价是整个系统手势，所以本版把「吞」从落指推迟到呼盘。
          grep -q 'AevonSwallowOnRingV214' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::V0.2.14 标记缺失 —— 热区吞摸时机没改回「呼盘之后」"; exit 1; }
          # 热区 App 前台分支必须是「观察」：began 之后 ownsTouch 不许为 true
          python3 -c "import os,re,sys; s=open(os.environ['GITHUB_WORKSPACE']+'/Sources/AevonEdgeEntry.swift',encoding='utf-8').read(); m=re.search(r'globalFired = false\n\s+lastTouchPoint = point\n\s+lastTouchAt = CACurrentMediaTime\(\)\n\s+ownsTouch = (true|false)', s); sys.exit(0 if (m and m.group(1)=='false') else 1)" \
            || { echo "::error::热区又开始「按下即接管」—— 底部/顶部系统手势会被一起吞掉"; exit 1; }
          # 呼盘时才开吞，且必须有时限闸（0.6s 内的手指才算活着，UITouch 指针会复用）
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            | grep -q 'nowForSwallow - lastTouchAt < 0.6' \
            || { echo "::error::呼盘开吞缺 lastTouchAt 时限闸 —— 陈旧指针会吞到下一根无关手指"; exit 1; }
          # began 看门狗：Aevon(100) 那次识别器在 began 上扣了 2.03 秒
          grep -q 'AevonSysEdgeBegunBudgetV214' "$GITHUB_WORKSPACE/Sources/AevonSysEdgeV213.swift" \
            || { echo "::error::系统手势 began 看门狗被删 —— 识别器会重新长扣系统手势"; exit 1; }
          # 判向不许再读 translation(in:)（Aevon(100) 实测读到 dx=-421 dy=-796）
          if grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonSysEdgeV213.swift" | grep -q 'translation(in:'; then
            echo "::error::判向又去读 translation(in:) —— 该读数在私有 init 的识别器上不可信"; exit 1
          fi
          # 默认关 + 老用户一次性写盘迁移
          grep -q 'AevonPrefs.bool("SysEdgeEnabled", default: true)' "$GITHUB_WORKSPACE/Sources/AevonSysEdgeV213.swift" \
            || { echo "::error::SysEdgeEnabled 必须默认开（0.2.17 起常开）"; exit 1; }
          grep -q 'AevonSysEdgeOffMigrateV214' "$GITHUB_WORKSPACE/Sources/AevonSysEdgeV213.swift" \
            || { echo "::error::缺 SysEdgeEnabled 一次性关闭迁移（0.2.13 装过的设备会带着 true 升上来）"; exit 1; }
          echo "V0.2.14 校验: 热区改观察（不吞系统手势区）+ 呼盘后才吞（0.6s 时限）+ 系统手势 began 0.12s 看门狗 + 默认关与一次性迁移 已就位"

          # ---- V0.2.15（Aevon(101)）：SB 侧吞摸整条链路下线 ----
          #
          # 证据链：
          #   · 12:31:18~12:31:30 十二秒零触摸日志，但 30 秒一次的窗口栈照常打印 → 主线程活着；
          #   · 12:31:30 三指急救生效 → 三指事件确实穿过了 sendEvent（swallowCount < active 不吞），
          #     而单指全被吞 → 桌面翻页 / Dock / 图标一起死。这就是 `ownsTouch` 泄漏的那一类表现；
          #   · 全屏 App 侧的「圆盘出来、页面不跟滚」是 App 内识别器的功劳
          #     （12:30:56 / 12:32:55 两次「App 触摸已被合法取消」），跟 SB 吞不吞无关。
          # 结论：SB 侧吞摸对 App 收益为 0，代价是整个桌面与系统手势 → 焊死。
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            | grep -q 'AevonPrefs.bool("SBSwallow", default: false)' \
            || { echo "::error::SB 侧吞摸没被焊死 —— 桌面会重新出现整机单指失灵"; exit 1; }
          test "$(grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" | grep -c 'AevonNoSBSwallowV215')" -ge 2 \
            || { echo "::error::V0.2.15 标记不足两处（吞摸焊死 + 全局呼盘下线）"; exit 1; }
          # 只留浮窗拖拽这一条吞：浮窗是 SB 自己的窗口，不吞会带着桌面一起拖
          grep -q 'floatGestureActive, touchID == floatTouchID' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::浮窗拖拽的吞摸被一起删了 —— 拖窗会拖着桌面"; exit 1; }
          # 桌面手势条必须自己就能被命中（不再依赖任何全局通道）
          test "$(grep -c 'AevonEdgeEntry.isPureDesktop' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift")" -ge 2 \
            || { echo "::error::桌面手势条 hitTest 又变成恒 nil —— 桌面呼盘会彻底消失"; exit 1; }
          # App 侧必须跟随总开关（Aevon(101) 12:33:08：主开关已关，App 侧还在挂识别器）
          grep -q 'AevonAppPrefBool(@"Enabled", YES)' "$GITHUB_WORKSPACE/Sources/AppSide/AevonAppSide.m" \
            || { echo "::error::App 侧没读总开关 Enabled —— 关了插件 App 里还在接管"; exit 1; }
          echo "V0.2.15 校验: SB 侧吞摸下线（只留浮窗拖拽）+ 桌面手势条自己接触摸 + App 侧跟随总开关"

          # ---- V0.2.16（Aevon(102)）：圆盘指针不再死绑在一条通道上 ----
          #
          # 15 次呼盘：`systemgesture` 9 / `appedge` 4 / `strip` 2。
          # `presentRing` 把圆盘指针绑成呼盘来源的字符串，而 `systemgesture` 这个字符串
          # 只被 0.1.13 就停手的 `AevonSystemGestureV105` 使用（P7-4「愿接=0」）——
          # 绑上去就等于绑到一条死通道：
          #   · 手指继续往圆心滑 → 一条 moved 都进不来，图标不高亮也不旋转 =「选不中」；
          #   · 抬手 → ended 也进不来 → 指针一直挂着，只能等 1.2 秒超时后由下一次
          #     触摸（圆盘自己的 touchesBegan）接管 =「必须抬手再摸一次」。
          grep -q 'AevonRingPointerHandoffV216' "$GITHUB_WORKSPACE/Sources/AevonRingMenu.swift" \
            || { echo "::error::圆盘缺指针通道交接 —— 呼盘通道一死，手指就再也选不中"; exit 1; }
          test "$(grep -c 'AevonRingPointerHandoffV216' "$GITHUB_WORKSPACE/Sources/AevonRingMenu.swift")" -ge 2 \
            || { echo "::error::V0.2.16 标记不足两处（交接实现 + 交接日志）"; exit 1; }
          grep -q 'pointerHandoffInterval: CFTimeInterval = 0.12' "$GITHUB_WORKSPACE/Sources/AevonRingMenu.swift" \
            || { echo "::error::交接阈值不是 0.12s —— 比识别器 Failed 还慢，圆盘会愣一下"; exit 1; }
          # 死绑门必须消失：moved / ended 一律走 claimPointer
          if grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonRingMenu.swift" | grep -q 'source == pointerSource'; then
            echo "::error::圆盘又按 source 死绑指针 —— 绑到死通道就等于手指断粮"; exit 1
          fi
          # 系统手势喂料方与呼盘方必须是同一个字符串（以前 systemedge / systemgesture 各说各话）
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonSysEdgeV213.swift" \
            | grep -q 'ring.remoteMoved(to: point, source: "systemgesture")' \
            || { echo "::error::系统手势喂料源名与呼盘源名不一致 —— 圆盘收不到任何移动"; exit 1; }
          if grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonSysEdgeV213.swift" | grep -q '"systemedge"'; then
            echo "::error::又出现 systemedge —— 与呼盘来源 systemgesture 不是同一个字符串"; exit 1
          fi
          # 圆盘一开就必须停止判向（否则判成纵向 → Failed → 断粮）
          grep -q 'if fired, let ring = AevonRingMenu.presented' "$GITHUB_WORKSPACE/Sources/AevonSysEdgeV213.swift" \
            || { echo "::error::系统手势识别器在圆盘开着时还在判向 —— 会把圆盘的喂料一起判死"; exit 1; }
          echo "V0.2.16 校验: 圆盘指针通道交接（0.12s 静默可换道）+ 源名统一 + 圆盘开启后只喂指针 已就位"

          # ---- V0.2.17（Aevon(103) 判读）：圆盘松手即收 + 设置页精简 + 圆盘手势定档 ----
          #
          # 用户的账只有两条：
          #   ① 「划出圆盘后松手在盘外时自动收起圆盘（不要圆盘保持开启）」；
          #   ② 「插件设置中的一些选项并没有用到，或者可以在插件代码中设置为默认开启，精简选项」。
          #
          # ① 的沿革：0.0.28 起 `handlePointerEnded` 有一条「从没进过圆盘 = 呼盘那一下抬手 →
          #   圆盘保持展开」（AevonRingKeepOpenV28）。0.2.16 把指针通道交接做完之后，正确用法
          #   已经是「按住不松、直接滑到图标再松」，那个分支只剩一个后果：随手划一下、抬手，
          #   屏上多一个必须再点一次才消失的圆盘。本版删掉该分支。
          grep -q 'AevonRingLiftDismissV217' "$GITHUB_WORKSPACE/Sources/AevonRingMenu.swift" \
            || { echo "::error::圆盘松手不再无条件收起（缺 AevonRingLiftDismissV217）"; exit 1; }
          if grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonRingMenu.swift" | grep -q '!everInside'; then
            echo "::error::「盘外抬手保持展开」的分支又回来了（0.2.17 已按用户要求删除）"; exit 1
          fi
          # 旧标记必须仍在字节里（历史断言 AevonRingKeepOpenV28 由 used 常量收容）
          strings "$DYLIB" | grep -q 'AevonRingKeepOpenV28' \
            || { echo "::error::历史标记 AevonRingKeepOpenV28 从二进制里消失（应只删实现、留标记）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingLiftDismissV217' \
            || { echo "::error::V0.2.17 松手收起标记未编入"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonPrefsSlimV217' \
            || { echo "::error::V0.2.17 设置页精简标记未编入"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonSysEdgeAlwaysOnV217' \
            || { echo "::error::V0.2.17 系统手势常开标记未编入"; exit 1; }
          for s in AevonFloatTouchAlwaysV217 AevonProbeDefaultOffV217 \
                   AevonRingLiftDismissV217 AevonPrefsSlimV217 AevonSysEdgeAlwaysOnV217; do
            grep -q "$s" "$GITHUB_WORKSPACE/AevonAssertionShim.m" \
              || { echo "::error::V0.2.17 标记 $s 未收容进 AevonAssertionShim.m"; exit 1; }
          done
          # ② 六个开关撤出设置页：失效的（整指吞 ×2 / 系统手势通道 / 常亮预览）与
          #    该恒开的（浮窗可触摸）、该砍的（多任务长按）—— 一级页必须正好 6 个开关。
          ROOT_SW="$(python3 -c "import plistlib,os;d=plistlib.load(open(os.environ['GITHUB_WORKSPACE']+'/AevonPrefs/Resources/Root.plist','rb'));print(sum(1 for i in d['items'] if i.get('cell')=='PSSwitchCell'))")"
          [ "$ROOT_SW" -eq 6 ] || { echo "::error::一级页开关数不是 6（实际 $ROOT_SW）—— 精简后的清单固定为 Enabled/EdgeGestureEnabled/AppSideEnabled/LogEnabled/CrashGuard/ProbeV107"; exit 1; }
          ROOT_KEYS="$(python3 -c "import plistlib,os;d=plistlib.load(open(os.environ['GITHUB_WORKSPACE']+'/AevonPrefs/Resources/Root.plist','rb'));print(','.join(i['key'] for i in d['items'] if i.get('cell')=='PSSwitchCell'))")"
          [ "$ROOT_KEYS" = "Enabled,EdgeGestureEnabled,AppSideEnabled,LogEnabled,CrashGuard,ProbeV107" ] \
            || { echo "::error::一级页开关清单与定档清单不一致（实际 $ROOT_KEYS）"; exit 1; }
          # 总开关默认开（新装即生效）；探针默认关（每次启动约 70 行）
          grep -q 'AevonPrefs.bool("Enabled", default: true)' "$GITHUB_WORKSPACE/Sources/Aevon.swift" \
            || { echo "::error::总开关不是默认开（0.2.17 起装上即生效）"; exit 1; }
          grep -q 'AevonPrefs.bool("ProbeV107", default: false)' "$GITHUB_WORKSPACE/Sources/AevonProbeV107.swift" \
            || { echo "::error::运行时探针不是默认关（定档后不该每次启动写 70 行）"; exit 1; }
          # 浮窗可触摸恒开
          grep -q 'AevonFloatTouchAlwaysV217' "$GITHUB_WORKSPACE/Sources/AevonSceneHost.swift" \
            || { echo "::error::浮窗可触摸没有改成恒开"; exit 1; }
          if grep -q 'AevonPrefs.bool("TouchEnabled"' "$GITHUB_WORKSPACE/Sources/AevonSceneHost.swift"; then
            echo "::error::浮窗还在读 TouchEnabled（开关已撤，读它等于留了一条没人能改的死路）"; exit 1
          fi
          # 多任务长按的安装入口必须停（设置里那个「（实验）」从没成功过一次）
          if grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/Aevon.swift" | grep -q 'SwitcherLongPress'; then
            echo "::error::多任务长按 hook 又被装上（0.2.17 已撤）"; exit 1
          fi
          # 常开迁移必须存在（0.2.14 把 SysEdgeEnabled 写成 false 的设备会带着 false 升上来）
          grep -q 'SysEdgeOnMigratedV217' "$GITHUB_WORKSPACE/Sources/AevonSysEdgeV213.swift" \
            || { echo "::error::缺 SysEdgeEnabled 一次性改开的迁移（老设备升级后这条通道仍是关的）"; exit 1; }
          echo "V0.2.17 校验: 松手即收（AevonRingLiftDismissV217）+ 一级页锁定 6 个开关 + 系统手势常开与一次性迁移 + 浮窗恒可触摸 + 探针默认关 已就位"

          # ---- V0.2.18（Aevon(104)）：划过图标的跳跃 +50% / 放大加大 / 关闭只认抬手 ----
          #
          # 用户这次的账有三条，前两条是手感，第三条是把规则讲清楚：
          #   ① 「图标跳动的高度增加 50%」；
          #   ② 「划过图标时放大效果再大一点，让圆盘看起来更 Q 弹」；
          #   ③ 「手指没离开屏幕就算在圆盘里，只有离开屏幕时在盘外 / 在图标间隙里才收」。
          #
          # ①② 落在 AevonRingMenu 的四个常量上（8 → 12pt、1.18 → 1.30、阻尼 .42 → .34、
          #   初速 2.8 → 3.4）。这里把数值钉死在断言里：手感是用户点名要的，
          #   以后谁想调，先在这四条上吵赢。
          grep -q 'static let hoverLift: CGFloat = 12' "$GITHUB_WORKSPACE/Sources/AevonRingMenu.swift" \
            || { echo "::error::图标跳跃高度不是 12pt（用户要求 8 → 12，+50%）"; exit 1; }
          grep -q 'static let hoverScale: CGFloat = 1.30' "$GITHUB_WORKSPACE/Sources/AevonRingMenu.swift" \
            || { echo "::error::划过图标的放大倍数不是 1.30（1.18 已被用户否掉：不够 Q 弹）"; exit 1; }
          grep -q 'static let hoverSpringDamping: CGFloat = 0.34' "$GITHUB_WORKSPACE/Sources/AevonRingMenu.swift" \
            || { echo "::error::跳跃弹簧阻尼不是 0.34（阻尼越大回摆越少，Q 弹感来自低阻尼）"; exit 1; }
          grep -q 'static let hoverSpringVelocity: CGFloat = 3.4' "$GITHUB_WORKSPACE/Sources/AevonRingMenu.swift" \
            || { echo "::error::跳跃弹簧初速不是 3.4"; exit 1; }
          # 放大到 1.30 之后，命中判定再拿 frame 就会跟着膨胀 30%，隔壁图标被抢 ——
          # 一律用 bounds（不受 transform 影响）。这条是「放大」带出来的必然副作用。
          if grep -q 'icon\.frame\.width' "$GITHUB_WORKSPACE/Sources/AevonRingMenu.swift"; then
            echo "::error::圆盘命中判定又用 frame.width 了（放大 1.30 后判定半径会跟着膨胀，隔壁图标被抢）"; exit 1
          fi
          grep -q 'let baseSize = icon.bounds.width' "$GITHUB_WORKSPACE/Sources/AevonRingMenu.swift" \
            && grep -q 'candidate.bounds.width \* AevonRingMenu.hitFactor' "$GITHUB_WORKSPACE/Sources/AevonRingMenu.swift" \
            || { echo "::error::圆盘命中判定的两处（径向容差 / 弧长阈值）没有全部改用 bounds"; exit 1; }
          # ③ 手指在屏 = 谁都不许收。三件事必须同时在：
          #   · 圆盘自己记着「手指还在屏上」；
          #   · SpringBoard 侧三个超时强收全部读这一位；
          #   · 12 秒硬上限在圆盘开着时不生效（它会把喂料清掉，圆盘当场定住）。
          grep -q 'private(set) var isFingerDown = false' "$GITHUB_WORKSPACE/Sources/AevonRingMenu.swift" \
            || { echo "::error::圆盘没有「手指是否在屏上」的状态（AevonRingFingerDownV218）"; exit 1; }
          grep -q 'var pointerIdleSeconds' "$GITHUB_WORKSPACE/Sources/AevonRingMenu.swift" \
            || { echo "::error::圆盘没有指针静默时长（30 秒安全网要用）"; exit 1; }
          grep -q 'let ringHoldsFinger = AevonRingMenu.presented?.isFingerDown == true' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::死手开关没有读「手指在屏上」（会替圆盘超时收起）"; exit 1; }
          test "$(grep -c 'if !ringHoldsFinger' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift")" -ge 3 \
            || { echo "::error::三个超时强收没有全部让路（接管超期 / 收归超 12 秒 / 右缘超期）"; exit 1; }
          grep -q 'now - globalOwnedAt > globalOwnHardLimit, !AevonRingMenu.isPresented' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::12 秒硬上限在圆盘开着时仍会强夺（圆盘会先定住再被收）"; exit 1; }
          if grep -q 'now > ringOpenedAt + ringOpenLimit' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift"; then
            echo "::error::圆盘安全网又按「展开时长」算了（手指在屏上也会被收）"; exit 1
          fi
          for s in AevonRingJumpPunchV218 AevonRingHitStableV218 AevonRingFingerDownV218 AevonRingCloseOnLiftV218; do
            grep -q "$s" "$GITHUB_WORKSPACE/AevonAssertionShim.m" \
              || { echo "::error::V0.2.18 标记 $s 未收容进 AevonAssertionShim.m"; exit 1; }
            strings "$DYLIB" | grep -q "$s" \
              || { echo "::error::V0.2.18 标记 $s 未编入二进制"; exit 1; }
          done
          # 旧文案必须归零，新文案必须在（Swift 字面量是 UTF-8，直接按字节查）
          python3 -c "import sys; d=open(sys.argv[1],'rb').read(); assert '抬手未选中'.encode('utf-8') in d, 'missing'" "$DYLIB" \
            || { echo "::error::圆盘抬手日志不是新文案（缺「抬手未选中」）"; exit 1; }
          python3 -c "import sys; d=open(sys.argv[1],'rb').read(); sys.exit(1 if '松手未选中'.encode('utf-8') in d else 0)" "$DYLIB" \
            || { echo "::error::旧文案「松手未选中」还在二进制里"; exit 1; }
          # 历史动画标记不许丢（0.0.35 的跳跃、0.0.30 的出场弹簧、0.2.17 的抬手即收）
          for s in AevonRingHopV35 AevonRingSpringV30 AevonRingSpringV33 AevonRingLiftDismissV217; do
            strings "$DYLIB" | grep -q "$s" \
              || { echo "::error::历史圆盘动画 / 收尾标记 $s 从二进制里消失"; exit 1; }
          done
          echo "V0.2.18 校验: 跳跃 12pt（+50%）+ 放大 1.30 + 阻尼 0.34 + 命中改 bounds + 手指在屏时三个定时器全部让路（只认抬手）已就位"

      # 产物只上传为 artifact（不发 Release）。下载方式见交付说明。
      - name: 上传产物（artifact，不发 Release）
        uses: actions/upload-artifact@v4
        with:
          name: Aevon-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: 输出产物信息到日志
        run: |
          DEB="$(ls packages/*.deb | head -n1)"
          echo "产物: $(basename "$DEB")"
          echo "大小: $(wc -c < "$DEB") 字节"
          echo "MD5: $(md5 -q "$DEB")"
