          # 滑条下限的**纪律升级**（V0.2.11 / Aevon(97)，不是放宽）：
          # 0.1.18 把下限钉在 24，理由是「8~23 属于设了也必然落空的区间」。但用户 Aevon(97)
          # 明确要求「可以随意更改，无法继续降低高度」—— 默认值该守纪律，滑条不该。
          # 所以这一条从「下限必须是 24」升级为：
          #   ① 下限必须是 8（想更贴边就得能调下去）；
