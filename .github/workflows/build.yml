name: build

# 触发策略：
#   只保留手动触发（Actions 页面 Run workflow，或 API dispatch）。
#   V0.0.9 起不再监听 tag、不再发布 Release —— 构建产物只作为 artifact 上传，
#   由开发者下载后本地交付。
on:
  workflow_dispatch:

permissions:
  contents: read

# 同一 ref 只保留最新一次构建，排队中的旧任务自动取消
concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

env:
  THEOS: ${{ github.workspace }}/../theos
  # 钉住 roothide/theos 的提交，避免上游改动导致构建突然失败；取不到则回退默认分支
  THEOS_PIN: cfba89a53a05b4a1b822121158acc3669c20602f
  SDK_DIR: iPhoneOS16.5.sdk

jobs:
  build:
    name: 构建 deb（roothide / arm64e）
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        run: |
          # tr -d '\r'：防止 control 带 CRLF 时版本号里混进回车，把 Swift 字符串写断
          VERSION="$(grep -i '^Version:' control | tr -d '\r' | awk '{print $2}')"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "构建版本: ${VERSION}"
          # 版本号以 control 为唯一来源，同步写进 Swift 常量，避免多处漂移
          sed -i '' "s/^let AevonVersion = .*/let AevonVersion = \"${VERSION}\"/" Sources/Aevon.swift
          grep -n 'let AevonVersion' Sources/Aevon.swift

      - name: 安装依赖（gnu-make / Procursus ldid / xz）
        run: |
          brew install make ldid xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          ldid -h 2>&1 | head -2 || true

      - name: 获取 Theos（roothide 分支）与 SDK
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" fetch --depth 1 origin "$THEOS_PIN" 2>/dev/null \
            && git -C "$THEOS" checkout -q "$THEOS_PIN" \
            || echo "钉住的提交不可用，回退默认分支"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          test -d "$THEOS/sdks/$SDK_DIR" || { echo "::error::缺少 $SDK_DIR"; exit 1; }
          echo "THEOS_SHA=$(git -C "$THEOS" rev-parse --short HEAD)"

      - name: 构建
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: 校验产物（纯 arm64e + iphoneos-arm64e + 已签名）
        run: |
          set -e
          DEB="$(ls packages/*.deb | head -n1)"
          echo "deb: $DEB"
          rm -rf verify && mkdir verify && cd verify
          ar x "../$DEB"
          if [ -f data.tar.lzma ]; then xz -dc data.tar.lzma | tar x;
          elif [ -f data.tar.gz ]; then tar xzf data.tar.gz;
          else tar xf data.tar.*; fi
          for f in control.tar.*; do mkdir -p ctl && tar xf "$f" -C ctl; break; done

          DYLIB="$(find . -name '*.dylib' -path '*DynamicLibraries*' | head -n1)"
          echo "dylib: $DYLIB"
          ARCHS="$(lipo -archs "$DYLIB")"
          echo "lipo -archs: $ARCHS"
          [ "$ARCHS" = "arm64e" ] || { echo "::error::产物必须是纯 arm64e，实际: $ARCHS"; exit 1; }
          codesign -d "$DYLIB" 2>&1 | head -3 || true

          # V0.0.6：崩溃捕获必须编入（否则安全模式后拿不到原因）
          strings "$DYLIB" | grep -q '/var/mobile/Aevon.crash.log' \
            || { echo "::error::主插件缺少崩溃捕获（Aevon.crash.log 路径不存在）"; exit 1; }
          # V0.0.6：启动阶段不得有遗留的 SpringBoard 启动 hook
          if strings "$DYLIB" | grep -q 'sk_sb_applicationDidFinishLaunching'; then
            echo "::error::仍存在启动期 hook（会造成安全模式）"
            exit 1
          fi
          echo "崩溃捕获: 已编入；启动期 hook: 已移除"

          # V0.0.7：入口必须是悬浮球（零 hook），且绝不能残留 SBIconView 快捷菜单 hook
          if strings "$DYLIB" | grep -q 'applicationShortcutItems'; then
            echo "::error::仍存在 SBIconView 快捷菜单 hook（会造成长按图标注销）"
            exit 1
          fi
          strings "$DYLIB" | grep -q 'AevonBubble' \
            || { echo "::error::主插件缺少悬浮球入口（AevonBubble）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonAppPickerView' \
            || { echo "::error::主插件缺少应用选择面板（AevonAppPickerView）"; exit 1; }
          strings "$DYLIB" | grep -q 'launchApplicationWithIdentifier:suspended:' \
            || { echo "::error::主插件缺少拉起 App 的调用"; exit 1; }
          echo "入口校验: 悬浮球 + 应用选择面板 已编入；图标长按 hook 已移除"

          # V0.0.10：画面承载必须走 presenter（scene.uiPresentationManager →
          # createPresenterWithIdentifier: → activate → presentationView）。
          # 旧的两条路径必须彻底消失，否则会重现「全黑 + 注销」。
          strings "$DYLIB" | grep -q 'AevonSceneHost' \
            || { echo "::error::主插件缺少场景承载器（AevonSceneHost）"; exit 1; }
          strings "$DYLIB" | grep -q 'uiPresentationManager' \
            || { echo "::error::缺少 uiPresentationManager 调用（App 不会被要求渲染）"; exit 1; }
          strings "$DYLIB" | grep -q 'createPresenterWithIdentifier:' \
            || { echo "::error::缺少 createPresenterWithIdentifier: 调用"; exit 1; }
          strings "$DYLIB" | grep -q 'presentationView' \
            || { echo "::error::缺少 presentationView 取用"; exit 1; }
          if strings "$DYLIB" | grep -q '_UISceneLayerHostContainerView'; then
            echo "::error::仍残留 _UISceneLayerHostContainerView（V0.0.9 全黑根因）"
            exit 1
          fi
          if strings "$DYLIB" | grep -q 'UIScenePresentationManager'; then
            echo "::error::仍残留 UIScenePresentationManager 兜底（V0.0.9 注销根因）"
            exit 1
          fi
          echo "画面承载: presenter 路径已编入；旧容器/旧兜底已清除"

          # V0.0.14：真分屏 —— 吸附几何、左右分屏流程必须都在
          # 注意：只能查 ASCII 符号名。中文日志字面量是 UTF-8，`strings` 只输出可打印 ASCII，查不到。
          strings "$DYLIB" | grep -q 'AevonSnap' \
            || { echo "::error::主插件缺少吸附几何（AevonSnap）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonSnapSlot' \
            || { echo "::error::主插件缺少吸附槽位类型（AevonSnapSlot）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonSplitFlow' \
            || { echo "::error::主插件缺少左右分屏流程（AevonSplitFlow）"; exit 1; }
          echo "分屏校验: 吸附几何 + 左右分屏流程 已编入"

          # V0.0.15：边缘手势入口 + 圆盘选择器
          strings "$DYLIB" | grep -q 'AevonEdgeEntry\|AevonEdgeStripView' \
            || { echo "::error::缺少边缘手势入口（AevonEdge）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingMenu' \
            || { echo "::error::缺少圆盘选择器（AevonRingMenu）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingIcon' \
            || { echo "::error::缺少圆盘图标单元（AevonRingIcon）"; exit 1; }
          # V0.0.16：整圆形态 + 自接管触摸（图标不再挂手势识别器）
          strings "$DYLIB" | grep -q 'AevonRingFullCircle' \
            || { echo "::error::圆盘不是整圆版本（缺少 AevonRingFullCircle 标记）"; exit 1; }
          # V0.0.17：边缘条自己接管原生触摸（不再用 UIScreenEdgePanGestureRecognizer）
          strings "$DYLIB" | grep -q 'AevonEdgeTouch' \
            || { echo "::error::边缘入口仍是手势识别器版本（缺少 AevonEdgeTouch 标记）"; exit 1; }
          # V0.0.18：入口合并为唯一窗口（悬浮球 + 手势条同窗口）+ 触摸探针
          # 注意：strings 只输出可打印 ASCII，中文日志串查不到，这里只校验 ASCII 符号名
          strings "$DYLIB" | grep -q 'AevonEntryHost' \
            || { echo "::error::入口没有合并到统一窗口（缺少 AevonEntryHost 标记）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonEntryWindow' \
            || { echo "::error::缺少统一入口窗口类（AevonEntryWindow）"; exit 1; }
          echo "圆盘校验: 边缘入口（原生触摸）+ 整圆形态 + 图标单元 + 统一入口窗口 已编入"

          # V0.0.20：圆盘改多圈（8/12/16）+ 场景看门狗
          # 注意：Swift 的 enum + static let 没有运行时元数据，类型名不会进二进制，
          # 一律靠日志里的 ASCII 标记串校验。
          strings "$DYLIB" | grep -q 'AevonRingMultiRing' \
            || { echo "::error::圆盘不是多圈版本（缺少 AevonRingMultiRing 标记）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonSceneWatch' \
            || { echo "::error::缺少场景看门狗（AevonSceneWatch 标记）"; exit 1; }
          echo "多圈校验: 多圈圆盘 + 场景看门狗 已编入"

          # V0.0.21：场景白名单（只认 SBWindowScene）+ 圆盘 75% 锚点
          strings "$DYLIB" | grep -q 'AevonSceneWhiteListV21' \
            || { echo "::error::入口窗口没有做场景白名单（缺 AevonSceneWhiteListV21）—— 会用灵动岛场景挂窗口"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingAnchor75V21' \
            || { echo "::error::圆盘圆心不是 75% 锚点（缺 AevonRingAnchor75V21）"; exit 1; }
          # V0.0.22：唯一入口容器（可整体搬进 App 画面容器）+ 原生图标 + 系统 App
          strings "$DYLIB" | grep -q 'AevonSingleContainerV22' \
            || { echo "::error::入口不是唯一容器版本（缺 AevonSingleContainerV22）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonSceneVCHookV22' \
            || { echo "::error::缺少 App 画面容器钩子标记（AevonSceneVCHookV22）"; exit 1; }
          strings "$DYLIB" | grep -q 'SBDeviceApplicationSceneViewController' \
            || { echo "::error::App 画面容器钩子没编进二进制（SBDeviceApplicationSceneViewController）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonEntryContainerView' \
            || { echo "::error::缺少唯一入口容器类（AevonEntryContainerView）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingNativeIconV22' \
            || { echo "::error::圆盘没有恢复原生图标（缺 AevonRingNativeIconV22）"; exit 1; }
          strings "$DYLIB" | grep -q 'iconImageWithInfo:' \
            || { echo "::error::图标取图缺少 SBIconModel 通道（iconImageWithInfo:）"; exit 1; }
          echo "V0.0.22 校验: 唯一容器 + App 画面容器钩子 + 原生图标 已编入"

          ARCH="$(grep -i '^Architecture:' ctl/control | cut -d' ' -f2-)"
          echo "deb Architecture: $ARCH"
          [ "$ARCH" = "iphoneos-arm64e" ] || { echo "::error::deb 架构应为 iphoneos-arm64e，实际: $ARCH"; exit 1; }

          PKG="$(grep -i '^Package:' ctl/control | cut -d' ' -f2-)"
          echo "deb Package: $PKG"
          [ "$PKG" = "com.aevon" ] || { echo "::error::包名应为 com.aevon（dpkg 要求全小写），实际: $PKG"; exit 1; }

          case "$(basename "$DEB")" in
            com.Aevon_*_iphoneos-arm64e.deb) echo "产物文件名: 符合 com.Aevon_<版本>_iphoneos-arm64e.deb" ;;
            *) echo "::error::产物文件名应以 com.Aevon_ 开头，实际: $(basename "$DEB")"; exit 1 ;;
          esac

          # 设置 bundle：必须是纯 arm64e，且真的编进了控制器子类（否则点击设置项会闪退）
          PREFS_BIN="$(find . -name 'AevonPrefs' -type f | head -n1)"
          echo "prefs bin: $PREFS_BIN"
          PREFS_ARCHS="$(lipo -archs "$PREFS_BIN")"
          echo "prefs lipo -archs: $PREFS_ARCHS"
          [ "$PREFS_ARCHS" = "arm64e" ] || { echo "::error::设置 bundle 必须是纯 arm64e，实际: $PREFS_ARCHS"; exit 1; }
          strings "$PREFS_BIN" | grep -q 'AevonRootListController' \
            || { echo "::error::设置 bundle 缺少 AevonRootListController（点击设置项会闪退）"; exit 1; }
          # V0.0.5：设置页空白是因为 specifier 没写回 _specifiers。这里确认两条关键路径都编进去了
          strings "$PREFS_BIN" | grep -q 'preferenceSpecifierNamed:target:set:get:detail:cell:edit:' \
            || { echo "::error::设置 bundle 缺少 PSSpecifier 自行构建逻辑（设置页会空白）"; exit 1; }
          strings "$PREFS_BIN" | grep -q '_specifiers' \
            || { echo "::error::设置 bundle 缺少 _specifiers 写回逻辑（设置页会空白）"; exit 1; }
          echo "设置 bundle 控制器类: 已编入；specifier 构建与写回: 已编入"

          # Root.plist 必须随包，且开关项不少于 6 个
          ICON_DIR="$(dirname "$PREFS_BIN")"
          [ -s "$ICON_DIR/Root.plist" ] || { echo "::error::bundle 缺少 Root.plist"; exit 1; }
          SWITCH_COUNT="$(plutil -convert xml1 -o - "$ICON_DIR/Root.plist" | grep -c 'PSSwitchCell' || true)"
          echo "Root.plist 开关项: $SWITCH_COUNT"
          [ "$SWITCH_COUNT" -ge 6 ] || { echo "::error::Root.plist 开关项不足 6 个（实际 $SWITCH_COUNT）"; exit 1; }
          # 悬浮球开关必须在 Root.plist 里（否则入口关不掉/开不了）
          plutil -convert xml1 -o - "$ICON_DIR/Root.plist" | grep -q 'BubbleEnabled' \
            || { echo "::error::Root.plist 缺少 BubbleEnabled 开关"; exit 1; }
          # V0.0.14 新增：吸附开关必须在 Root.plist 里
          plutil -convert xml1 -o - "$ICON_DIR/Root.plist" | grep -q 'SnapEnabled' \
            || { echo "::error::Root.plist 缺少 SnapEnabled（边缘吸附）开关"; exit 1; }
          # V0.0.15 新增：边缘手势主入口开关必须在
          plutil -convert xml1 -o - "$ICON_DIR/Root.plist" | grep -q 'EdgeGestureEnabled' \
            || { echo "::error::Root.plist 缺少 EdgeGestureEnabled（边缘圆盘入口）开关"; exit 1; }

          # 图标三档必须在 bundle 根目录
          ICON_DIR="$(dirname "$PREFS_BIN")"
          for i in icon.png icon@2x.png icon@3x.png; do
            [ -s "$ICON_DIR/$i" ] || { echo "::error::缺少图标 $i"; exit 1; }
          done
          echo "图标: icon.png / icon@2x.png / icon@3x.png 均存在"

      # 产物只上传为 artifact（不发 Release）。下载方式见交付说明。
      - name: 上传产物（artifact，不发 Release）
        uses: actions/upload-artifact@v4
        with:
          name: Aevon-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: 输出产物信息到日志
        run: |
          DEB="$(ls packages/*.deb | head -n1)"
          echo "产物: $(basename "$DEB")"
          echo "大小: $(wc -c < "$DEB") 字节"
          echo "MD5: $(md5 -q "$DEB")"
