          grep -q 'AevonPanicHint.show' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::急救状态提示条没有接进急救流程（关了开关用户看不见）"; exit 1; }
          grep -q 'RightEdgePanicOffV119' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::急救关闭标记 RightEdgePanicOffV119 缺失（重启后不会提醒用户）"; exit 1; }
          grep -q 'AevonPrefs.set("RightEdgeTakeover", false)' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::急救没有关掉右缘接管开关（急救完还会复发）"; exit 1; }
          # ⑤ 出过事故的功能不许默认开 —— 0.2.17 起更强：它们连开关都不在设置页
          if grep -qE 'RightEdgeTakeover|BandTakeoverFromBegan' "$GITHUB_WORKSPACE/AevonPrefs/Resources/Root.plist"; then
            echo "::error::整指吞开关又回到设置页（0.1.16 出过整屏卡死、0.2.15 已下线）"; exit 1
          fi
          # ⑥ 首次启动必须把危险开关复位（偏好跨版本保留，只改默认值救不了老用户）
          grep -q 'SafeTakeoverResetV117' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::首次启动安全复位被删（带着 0.1.16 的开关升级上来会直接复发）"; exit 1; }
          # ⑦ 提示条两档时长（设置变化 3 秒 / 接管成功 0.35 秒），且不许常驻
          grep -q 'show(duration: 3.0)' "$GITHUB_WORKSPACE/Sources/AevonSystemGestureV104.swift" \
            || { echo "::error::提示条 3 秒预览被删"; exit 1; }
          grep -q 'show(duration: 0.35)' "$GITHUB_WORKSPACE/Sources/AevonSystemGestureV104.swift" \
            || { echo "::error::提示条接管闪示被删"; exit 1; }
          echo "V0.1.17 校验: 全屏自绘已删（1×1 隐藏占位）+ 按需提示条 + 死手开关 + 三指急救"

