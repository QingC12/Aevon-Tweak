            echo "::error::V0.3.26 全局通道单点测速回潮（AevonTermWinVelV326）"; exit 1
          fi
          grep -qF 'func floatTermWindowVelocity' "$EE" \
            || { echo "::error::V0.3.26 全局通道没有窗口测速"; exit 1; }
          for k in 'floatTermFollowLift: CGFloat = 48' 'floatTermBigLift: CGFloat = 120' \
