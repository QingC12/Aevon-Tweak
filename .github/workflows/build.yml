          fi
          # 闪示必须挂在「接管成功」两个点上（起手 + 判向成立各一次）
          test "$(grep -c 'AevonSystemGestureV105.flashBandIndicator()' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift")" -ge 2 \
            || { echo "::error::接管成功没有闪示（起手 / 判向成立两处都要调）"; exit 1; }
          # 设置变了要即时预览，但不能顺手改触发区逻辑
          grep -q 'rightEdgeSignature = bandSignatureNow' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::右缘配置指纹未接进 0.2s 轮询（改了宽度要注销才生效）"; exit 1; }
          echo "V0.1.16 校验: 接管带可视化开关 + 设置即时预览（自绘部分已由 V0.1.17 反转断言守住）"

          # V0.1.17（Aevon(84) 全屏卡死事故 → 安全修复版）
          #
          # 事故：用户打开「显示右缘接管带」后整个屏幕失去操作，必须卸载才恢复。
          # 日志停在 15:44:19.092「容器已搬家 → App 画面进入」之后一行不剩（连触摸日志也没了）
          # = SpringBoard 主线程卡死。0.1.16 相对 0.1.15 只多了「全屏视图自绘 + 命中认领 + touchesBegan」，
          # 所以整块删除，并且此后 CI 反向锁死：谁把这几样加回来，构建直接红。
          for s in AevonNoBandDrawV117 AevonBandHintV117 AevonDeadManV117 AevonPanicThreeFingerV117; do
            strings "$DYLIB" | grep -q "$s" \
              || { echo "::error::V0.1.17 标记 $s 未编入"; exit 1; }
          done
          # ① 带视图四个口子全部关闭（draw / hitTest / point(inside:) / touchesBegan / 重绘）
          for bad in 'override func draw(' 'override func hitTest(' 'override func point(inside' 'override func touchesBegan' 'setNeedsDisplay()' 'flashBand()'; do
            if grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonSystemGestureV104.swift" | grep -qF "$bad"; then
              echo "::error::带视图仍在跑 [$bad] —— 这是 0.1.16 卡死整屏的源头"; exit 1
            fi
          done
          # ② 它必须是「1×1 + 隐藏 + 非交互」的占位，不能是全屏视图
          grep -q 'band.isUserInteractionEnabled = false' "$GITHUB_WORKSPACE/Sources/AevonSystemGestureV104.swift" \
            || { echo "::error::带视图不是非交互（会重新参与命中）"; exit 1; }
          grep -q 'band.isHidden = true' "$GITHUB_WORKSPACE/Sources/AevonSystemGestureV104.swift" \
            || { echo "::error::带视图没有隐藏（全屏透明视图会参与布局/渲染）"; exit 1; }
          grep -q 'band.frame = CGRect(x: 0, y: 0, width: 1, height: 1)' "$GITHUB_WORKSPACE/Sources/AevonSystemGestureV104.swift" \
            || { echo "::error::带视图没有退回 1×1（全屏后备存储是卡死的一环）"; exit 1; }
          # ③ 死手开关必须真的挂在 0.2 秒轮询里（定义 1 处 + 调用 1 处）
          test "$(grep -c 'enforceDeadManSwitch()' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift")" -ge 2 \
            || { echo "::error::死手开关没接进 0.2s 轮询（接管泄漏后无法自愈）"; exit 1; }
          grep -q 'static let deadManGrace: CFTimeInterval = 1.0' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::死手宽限期被改（默认 1 秒）"; exit 1; }
          # ★ 0.2.18 反转（AevonRingCloseOnLiftV218）：从「展开超过 20 秒就收」改成
