          for s in AevonGripOnlyV251 AevonDockTapV251 AevonDouyinWarmupV251 AevonDeactGateV251 \
                   AevonEdgeStripRetiredV251 AevonAppTakeoverRetiredV251 AevonSysEdgeRetiredV251; do
            strings "$DYLIB" | grep -q "$s" \
              || { echo "::error::0.2.51 缺标记 $s"; exit 1; }
          done
          grep -q 'AevonInstallDeactivationGate' "$GITHUB_WORKSPACE/AevonSceneDriverShim.m" \
            || { echo "::error::0.2.51 缺场景停用闸安装入口（回桌面守画）"; exit 1; }
          grep -q 'AevonFloatGuardsScene' "$GITHUB_WORKSPACE/Sources/AevonWindowManager.swift" \
            || { echo "::error::0.2.51 缺浮窗场景判据（Swift 侧）"; exit 1; }
          grep -q 'canvasWarmupDelay' "$GITHUB_WORKSPACE/Sources/AevonSceneHost.swift" \
            || { echo "::error::0.2.51 缺画布预热豁免参数"; exit 1; }
          grep -q '边条轻点 → 吸附停靠' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::0.2.51 全局通道缺边条轻点停靠分支"; exit 1; }
          grep -q 'handleEdgeTap' "$GITHUB_WORKSPACE/Sources/AevonWindowView.swift" \
            || { echo "::error::0.2.51 视图层缺边条轻点识别器"; exit 1; }
          test ! -f "$GITHUB_WORKSPACE/Sources/AevonSystemGestureV104.swift" \
            || { echo "::error::0.2.51 旧系统手势文件应已删除"; exit 1; }
          test ! -f "$GITHUB_WORKSPACE/Sources/AevonSysEdgeV213.swift" \
            || { echo "::error::0.2.51 旧系统手势 Swift 应已删除"; exit 1; }
          test ! -f "$GITHUB_WORKSPACE/Sources/AevonGeometryOverlay.swift" \
            || { echo "::error::0.2.51 几何预览应已删除"; exit 1; }
          test ! -f "$GITHUB_WORKSPACE/Sources/AevonSysEdgeShim.m" \
            || { echo "::error::0.2.51 系统手势垫片应已删除"; exit 1; }
          echo "V0.2.51 校验: 把手-only（呼盘唯一入口）+ 边条轻点停靠（双通道）+ 场景停用闸（回桌面守画，Stheno 方向）+ 抖音整屏预热 + 三通道退役 + App 侧识别器退役 + 设置页瘦身 已就位"


      # 产物只上传为 artifact（不发 Release）。下载方式见交付说明。
      - name: 上传产物（artifact，不发 Release）
        uses: actions/upload-artifact@v4
        with:
          name: Aevon-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: 输出产物信息到日志
        run: |
          DEB="$(ls packages/*.deb | head -n1)"
          echo "产物: $(basename "$DEB")"
          echo "大小: $(wc -c < "$DEB") 字节"
          echo "MD5: $(md5 -q "$DEB")"
