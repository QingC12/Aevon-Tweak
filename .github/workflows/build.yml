          test "$(grep -c 'if touchID == rightEdgeTouchID {' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift")" -ge 2 \
            || { echo "::error::右缘状态清理不全（ended / cancelled 两处都必须清）"; exit 1; }
          grep -q 'if touchID == rightEdgeTouchID, !rightEdgeDirLogged' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::右缘判向取证被删（moved 分支）"; exit 1; }
          # 识别器必须仍然停手：0.1.13 的延迟补投根因不能因为本版改回旧路
          strings "$DYLIB" | grep -q 'AevonPipelineStandDownV113' \
            || { echo "::error::识别器停手标记丢失 —— 会退回 0.1.12 的延迟补投"; exit 1; }
          echo "V0.1.15 校验: 右缘接管带（began 整指吞）+ 宽高可调 + 抬手清状态 + 识别器仍停手"

          # V0.1.16（AevonRightEdgeShowBandV116）：接管带可视化 —— 只画，不改触摸行为。
          #
          # Aevon(83) 给的结论是「机制已经通了」（右缘 3/3 起手→判向→呼出），
          # 但也暴露两件事：① 28pt 宽在真机上根本看不见，三次落点全在 y=656~671 那一小段，
          # 用户无法确认带在哪；② 0.1.15 的「命中共」取证结构性不可能出现 ——
          # 总入口在 began 就 return 掉了原 sendEvent，hitTest 不跑，bandView 永远收不到 touches。
          # 本版只加绘制：画出带的真实范围 + 接管时闪一下，并把「命中共为空是预期」写进交付说明。
          for s in AevonRightEdgeShowBandV116 AevonBandIndicatorV116; do
            strings "$DYLIB" | grep -q "$s" \
              || { echo "::error::V0.1.16 标记 $s 未编入"; exit 1; }
          done
          # 可视化必须由偏好开关控制，且默认关（不能默认就把带画在用户屏幕上）
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            | grep -q 'AevonPrefs.bool("RightEdgeShowBand", default: false)' \
            || { echo "::error::RightEdgeShowBand 开关读法被改（默认必须是 false）"; exit 1; }
          # ★ 0.2.17 反转：常亮预览开关撤掉（进「细节调整」自动亮 3 秒、拖滑条实时跟手就够用，
          #   常亮反而是屏幕上两块一直挡视线的边框）。读法保留在代码里当逃生口，UI 不再给。
          if grep -q 'RightEdgeShowBand' "$GITHUB_WORKSPACE/AevonPrefs/Resources/Root.plist" \
             || grep -q 'RightEdgeShowBand' "$GITHUB_WORKSPACE/AevonPrefs/Resources/Detail.plist"; then
            echo "::error::设置页又出现 RightEdgeShowBand 常亮开关（0.2.17 已撤）"; exit 1
          fi
          # ★ V0.1.17 反转（Aevon(84) 全屏卡死事故）：带视图**不许**再有自绘与命中认领。
          # 0.1.16 这里断言「必须有 draw」—— 那条断言现在反过来了，理由写在 0.1.17 块里。
          if grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonSystemGestureV104.swift" \
               | grep -q 'override func draw(_ rect: CGRect)'; then
            echo "::error::带视图又出现了 draw 自绘（0.1.16 因此卡死整屏，绝不加回）"; exit 1
