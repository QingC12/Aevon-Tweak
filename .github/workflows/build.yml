          grep -q '<integer>8</integer>' "$GITHUB_WORKSPACE/AevonPrefs/Resources/Detail.plist" \
            || { echo "::error::Detail.plist 右缘宽度下限不是 8（用户要求可继续降低）"; exit 1; }
          grep -q '<integer>46</integer>' "$GITHUB_WORKSPACE/AevonPrefs/Resources/Detail.plist" \
