          #   正在慢慢找图标」的人当成超时收掉 —— 那正好违反了用户定的关闭规则。
          grep -q 'static let ringOpenLimit: CFTimeInterval = 30' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::圆盘安全网不是 30 秒（0.2.18 起改按静默时长，不再按展开时长）"; exit 1; }
          grep -q 'ring.pointerIdleSeconds' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::圆盘安全网没接指针静默时长（又按展开时长了）"; exit 1; }
          # ④ 三指急救：判定必须在所有闸门之前，且必须能真正把开关写盘关掉。
          #   V0.1.19 起语义升级为两档（三指成形只释放接管、按住 2 秒才写盘关开关），
          #   旧形态的判定串保留为「兼容分支」，同时新增四条硬断言把两档钉住 ——
          #   不是放宽，是换了形态之后一条都不能少。
          if grep -q 'if activeTouches.count >= 3 { panicRelease() }' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift"; then
            echo "三指急救：旧形态（0.1.18 及以前）"
          elif grep -q 'panicReleaseNow("三指同时按下")' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            && grep -q 'static let panicHoldDisableAfter: CFTimeInterval = 2.0' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            && grep -q 'static let panicHoldHintAfter: CFTimeInterval = 0.6' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            && grep -q 'panicCooldownUntil' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift"; then
            echo "三指急救：0.1.19 两档形态（成形只释放 / 按住 2 秒才关开关 / 0.8 秒冷却）"
