name: build

# 触发策略：
#   只保留手动触发（Actions 页面 Run workflow，或 API dispatch）。
#   V0.0.9 起不再监听 tag、不再发布 Release —— 构建产物只作为 artifact 上传，
#   由开发者下载后本地交付。
on:
  workflow_dispatch:

permissions:
  contents: read

# 同一 ref 只保留最新一次构建，排队中的旧任务自动取消
concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

env:
  THEOS: ${{ github.workspace }}/../theos
  # 钉住 roothide/theos 的提交，避免上游改动导致构建突然失败；取不到则回退默认分支
  THEOS_PIN: cfba89a53a05b4a1b822121158acc3669c20602f
  SDK_DIR: iPhoneOS16.5.sdk

jobs:
  build:
    name: 构建 deb（roothide / arm64e）
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        run: |
          # tr -d '\r'：防止 control 带 CRLF 时版本号里混进回车，把 Swift 字符串写断
          VERSION="$(grep -i '^Version:' control | tr -d '\r' | awk '{print $2}')"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "构建版本: ${VERSION}"
          # 版本号以 control 为唯一来源，同步写进 Swift 常量，避免多处漂移
          sed -i '' "s/^let AevonVersion = .*/let AevonVersion = \"${VERSION}\"/" Sources/Aevon.swift
          grep -n 'let AevonVersion' Sources/Aevon.swift
          # 设置页页脚里的版本号也一起同步，避免设置里显示上一版的旧号
          sed -i '' -E "s/Aevon [0-9]+\.[0-9]+\.[0-9]+/Aevon ${VERSION}/g" AevonPrefs/Resources/Root.plist
          grep -c "Aevon ${VERSION}" AevonPrefs/Resources/Root.plist || echo "::warning::设置页页脚版本号未同步（不影响功能）"

      - name: 安装依赖（gnu-make / Procursus ldid / xz）
        run: |
          brew install make ldid xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          ldid -h 2>&1 | head -2 || true

      - name: 获取 Theos（roothide 分支）与 SDK
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" fetch --depth 1 origin "$THEOS_PIN" 2>/dev/null \
            && git -C "$THEOS" checkout -q "$THEOS_PIN" \
            || echo "钉住的提交不可用，回退默认分支"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          test -d "$THEOS/sdks/$SDK_DIR" || { echo "::error::缺少 $SDK_DIR"; exit 1; }
          echo "THEOS_SHA=$(git -C "$THEOS" rev-parse --short HEAD)"

      - name: 构建
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: 校验产物（纯 arm64e + iphoneos-arm64e + 已签名）
        run: |
          set -e
          DEB="$(ls packages/*.deb | head -n1)"
          echo "deb: $DEB"
          rm -rf verify && mkdir verify && cd verify
          ar x "../$DEB"
          if [ -f data.tar.lzma ]; then xz -dc data.tar.lzma | tar x;
          elif [ -f data.tar.gz ]; then tar xzf data.tar.gz;
          else tar xf data.tar.*; fi
          for f in control.tar.*; do mkdir -p ctl && tar xf "$f" -C ctl; break; done

          # V0.1.0 重制：只剩主插件一个 dylib（AevonGuard 已移除），仍精确定位主插件
          DYLIB="$(find . -name 'Aevon.dylib' -path '*DynamicLibraries*' | head -n1)"
          echo "dylib: $DYLIB"
          ARCHS="$(lipo -archs "$DYLIB")"
          echo "lipo -archs: $ARCHS"
          [ "$ARCHS" = "arm64e" ] || { echo "::error::产物必须是纯 arm64e，实际: $ARCHS"; exit 1; }
          codesign -d "$DYLIB" 2>&1 | head -3 || true

          # V0.0.6：崩溃捕获必须编入（否则安全模式后拿不到原因）
          strings "$DYLIB" | grep -q '/var/mobile/Aevon.crash.log' \
            || { echo "::error::主插件缺少崩溃捕获（Aevon.crash.log 路径不存在）"; exit 1; }
          # V0.0.6：启动阶段不得有遗留的 SpringBoard 启动 hook
          if strings "$DYLIB" | grep -q 'sk_sb_applicationDidFinishLaunching'; then
            echo "::error::仍存在启动期 hook（会造成安全模式）"
            exit 1
          fi
          echo "崩溃捕获: 已编入；启动期 hook: 已移除"

          # V0.0.7：入口必须是悬浮球（零 hook），且绝不能残留 SBIconView 快捷菜单 hook
          if strings "$DYLIB" | grep -q 'applicationShortcutItems'; then
            echo "::error::仍存在 SBIconView 快捷菜单 hook（会造成长按图标注销）"
            exit 1
          fi
          # V0.0.27：悬浮球已彻底移除（用户要求），绝不允许残留
          if strings "$DYLIB" | grep -q 'AevonBubble'; then
            echo "::error::主插件里仍残留悬浮球代码（AevonBubble）"
            exit 1
          fi
          strings "$DYLIB" | grep -q 'AevonAppPickerView' \
            || { echo "::error::主插件缺少应用选择面板（AevonAppPickerView）"; exit 1; }
          strings "$DYLIB" | grep -q 'launchApplicationWithIdentifier:suspended:' \
            || { echo "::error::主插件缺少拉起 App 的调用"; exit 1; }
          echo "入口校验: 悬浮球 + 应用选择面板 已编入；图标长按 hook 已移除"

          # V0.0.10：画面承载必须走 presenter（scene.uiPresentationManager →
          # createPresenterWithIdentifier: → activate → presentationView）。
          # 旧的两条路径必须彻底消失，否则会重现「全黑 + 注销」。
          strings "$DYLIB" | grep -q 'AevonSceneHost' \
            || { echo "::error::主插件缺少场景承载器（AevonSceneHost）"; exit 1; }
          strings "$DYLIB" | grep -q 'uiPresentationManager' \
            || { echo "::error::缺少 uiPresentationManager 调用（App 不会被要求渲染）"; exit 1; }
          strings "$DYLIB" | grep -q 'createPresenterWithIdentifier:' \
            || { echo "::error::缺少 createPresenterWithIdentifier: 调用"; exit 1; }
          strings "$DYLIB" | grep -q 'presentationView' \
            || { echo "::error::缺少 presentationView 取用"; exit 1; }
          if strings "$DYLIB" | grep -q '_UISceneLayerHostContainerView'; then
            echo "::error::仍残留 _UISceneLayerHostContainerView（V0.0.9 全黑根因）"
            exit 1
          fi
          if strings "$DYLIB" | grep -q 'UIScenePresentationManager'; then
            echo "::error::仍残留 UIScenePresentationManager 兜底（V0.0.9 注销根因）"
            exit 1
          fi
          echo "画面承载: presenter 路径已编入；旧容器/旧兜底已清除"

          # V0.0.14：真分屏 —— 吸附几何、左右分屏流程必须都在
          # 注意：只能查 ASCII 符号名。中文日志字面量是 UTF-8，`strings` 只输出可打印 ASCII，查不到。
          # V0.1.5（AevonNoSnapV105）：左右吸附 + 左右分屏已整体删除（单窗模式下不存在并排），
          # 这三条历史串只由 AevonAssertionShim.m 的 used 常量收容，二进制里仍可查到，
          # 但源码里必须一条都不剩 —— 下面的反回退检查逐条盯住。
          for s in AevonSnap AevonSnapSlot AevonSplitFlow; do
            strings "$DYLIB" | grep -q "$s" \
              || { echo "::error::历史收容串 $s 丢了（AevonAssertionShim.m used 常量被删？）"; exit 1; }
          done
          if grep -rn 'AevonSnapSlot\|openSplit\|SnapEnabled' "$GITHUB_WORKSPACE/Sources" "$GITHUB_WORKSPACE/AevonPrefs" 2>/dev/null | grep -q .; then
            echo "::error::吸附/分屏代码回退（V0.1.5 已删除：单窗不再需要并排吸附）"
            exit 1
          fi
          echo "单窗校验: 吸附/分屏代码 无残留（历史串仅由 used 常量收容）"

          # V0.1.1（AevonRestoreDefaultV101 / AevonZonePriorityV101）：
          #   ① 双击换档（小窗/大窗）与「顶部放大」吸附移除 —— 大窗/近全屏后角手柄不可达；
          #   ② 顶部双击 = 恢复默认大小与位置；
          #   ③ 圆盘触发热区最高优先级（Stheno EdgeBar 独占触发边同款），SB 侧吞触摸，无 Guard。
          strings "$DYLIB" | grep -q 'AevonRestoreDefaultV101' \
            || { echo "::error::顶部双击恢复默认未编入（缺 AevonRestoreDefaultV101）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonZonePriorityV101' \
            || { echo "::error::热区最高优先级未编入（缺 AevonZonePriorityV101）—— 划圆盘会触发 App 左滑"; exit 1; }
          if grep -rn 'cycleSize' Sources/ 2>/dev/null | grep -q .; then
            echo "::error::双击换档函数 cycleSize 残留（V0.1.1 已移除，禁止回退）"
            exit 1
          fi
          if grep -rn '顶部放大\|双击切换尺寸\|双击换档' Sources/ AevonPrefs/ 2>/dev/null | grep -v '^\s*///' | grep -v '// 原\|// V0.1.1\|移除' | grep -q .; then
            echo "::error::源码仍有换档/顶部放大字样（V0.1.1 已移除，禁止回退）"
            exit 1
          fi
          echo "V0.1.1 校验: 恢复默认双击 + 热区优先级 已编入；换档/顶部放大 无残留"

          # V0.1.2（归档(12) 修复）：①接管带外扩+轻点呼出+圆盘全屏吞（穿透）②停用门控
          # 原始实现异常保护（浮窗开着设置→桌面点图标→注销）③Guard 遗留清理
          # （guard.conf 写入器 / ack 检查 / guardack 通道）。
          for s in AevonTakeoverBandV102 AevonTapSummonV102 AevonRingFullSwallowV102 AevonGateSafeV102 AevonForensicBandV102 AevonGuardCleanupV102; do
            strings "$DYLIB" | grep -q "$s" \
              || { echo "::error::V0.1.2 标记 $s 未编入"; exit 1; }
          done
          if grep -rn 'com\.aevon\.guardack\|aevonGuardAckCount\|/var/mobile/AevonGuard\.conf\|AEVONGUARDCONFV32\|body\.write' Sources/ 2>/dev/null | grep -q .; then
            echo "::error::Guard 遗留代码残留（V0.1.2 已清理，禁止回退）"
            exit 1
          fi
          echo "V0.1.2 校验: 接管带外扩 + 轻点呼出 + 圆盘全屏吞 + 门控异常保护 已编入；Guard 遗留 无残留"

          # V0.1.3（归档(13) 修复）：①「场景停用门控」整体移除 —— 归档(12)/(13) 两次
          # 实锤它就是安全模式/自动注销的唯一来源（FBS 状态机断言，SIGTRAP 无法用 @try 兜）；
          # ②接管带改成「右缘整条 × 全屏高 + 延迟接管」—— 取证抓到漏摸全在屏幕顶部右缘，
          # 旧的纵向不铺满永远漏。
          for s in AevonTakeoverBandV103 AevonBandDeferV103 AevonGateRemovedV103; do
            strings "$DYLIB" | grep -q "$s" \
              || { echo "::error::V0.1.3 标记 $s 未编入"; exit 1; }
          done
          if grep -rn 'sk_uasdm_setDeactivationReasons\|AevonSceneDeactivationHooks\|AevonSceneSettingsHooks\|sk_uimass_setDeactivationReasons\|UIApplicationSceneDeactivationManager' Sources/ 2>/dev/null | grep -v ':[0-9]*:[[:space:]]*//' | grep -q .; then
            echo "::error::场景停用门控代码回退（V0.1.3 已整体移除：它是安全模式的崩溃源，禁止再加回来）"
            exit 1
          fi
          echo "V0.1.3 校验: 停用门控已移除 + 右缘全高接管带（延迟接管）已编入"

          # V0.1.4（归档(12)(13) + Aevon(72) 修复）：
          # ①桌面图标启动 hook —— 「浮窗开着设置 → 回桌面点设置图标 → 注销」改成
          #   在系统接手之前先释放浮窗（AevonIconLaunchV104）；
          # ②全屏 App 内右缘改由系统手势窗口接管（AevonSystemGestureV104），
          #   App 从触摸落下那一刻就收不到这条 touch，抖音不再翻页/拖进度条。
          for s in AevonIconLaunchV104 AevonSystemGestureV104 SystemGestureEdge; do
            strings "$DYLIB" | grep -q "$s" \
              || { echo "::error::V0.1.4 标记 $s 未编入"; exit 1; }
          done
          strings "$DYLIB" | grep -q 'iconManager:launchIconForIconView:withActions:' \
            || { echo "::error::桌面图标启动委托选择子未编入（AevonIconLaunchV104）"; exit 1; }
          # V0.1.5：FBScene 设置写入 hook 已整体删除（归档(14) 崩溃栈钉死在我方那次 KVC 写入）。
          # 反回退只盯「安装点」这一处特征串，注释里提到旧类名不算回退。
          if grep -rn 'replacementClass: AevonFBSceneHooks' "$GITHUB_WORKSPACE/Sources" 2>/dev/null | grep -q .; then
            echo "::error::FBScene 写入 hook 被装回去了（V0.1.5 已删除：它是注销/SIGTRAP 的崩溃源）"
            exit 1
          fi
          echo "V0.1.4/V0.1.5 校验: 图标启动先释放浮窗 + 系统手势管线 + FBScene 写入已彻底移除"

          # V0.1.5（归档(14) 修复）：
          # ①注销根治 —— 不再向 FBScene 写任何 settings（AevonNoFBSWriteV105），
          #   前台补偿改为有限 8 次（AevonSoftKeepAliveV105）；
          # ②抖音跟手 —— 右缘改走 SpringBoard 系统手势管线
          #   （addGestureRecognizer:toDisplayWithIdentity: + AevonGestureBandView）；
          # ③单浮窗（AevonSingleWindowV105）＋ 轻点呼出删除（AevonNoTapSummonV105）
          #   ＋ 左右吸附删除（AevonNoSnapV105）。
          for s in AevonNoFBSWriteV105 AevonSoftKeepAliveV105 AevonSystemGestureV105 AevonGestureBandView AevonSingleWindowV105 AevonNoTapSummonV105 AevonNoSnapV105; do
            strings "$DYLIB" | grep -q "$s" \
              || { echo "::error::V0.1.5 标记 $s 未编入"; exit 1; }
          done
          strings "$DYLIB" | grep -q 'addGestureRecognizer:toDisplayWithIdentity:' \
            || { echo "::error::系统手势管线登记选择子未编入（AevonSystemGestureV105）"; exit 1; }
          echo "V0.1.5 校验: 不写场景设置 + 有限前台补偿 + 系统手势管线 + 单浮窗 + 轻点呼出/吸附已删"

          # V0.1.6（Aevon(73) 修复）：
          # ①全屏启动时自动关浮窗（AevonFullscreenCloseV106）—— 浮窗黑窗的正解：
          #   场景被系统拿去全屏呈现后我们那个 presenter 就没画面了，只能关；
          #   场景标识由 AevonSceneIdentifierOfViewController 从 sceneHandle 反查。
          # ②窗口诊断不许再截断（AevonWinDumpFullV106）—— 原来只印最高层 8 个，
          #   15 个窗口里 7 个从没被看过，0.1.4 因此误判「系统没有手势窗口」。
          # ③手势管理器改由运行时探针去找（AevonProbeV106），不再硬编码类名就断言「不存在」。
          for s in AevonProbeV106 AevonFullscreenCloseV106 AevonWinDumpFullV106 AevonSystemGestureV106 AevonLaunchProbeV106; do
            strings "$DYLIB" | grep -q "$s" \
              || { echo "::error::V0.1.6 标记 $s 未编入"; exit 1; }
          done
          grep -q 'AevonSceneIdentifierOfViewController' "$GITHUB_WORKSPACE/Sources/AevonSceneHook.m" \
            || { echo "::error::场景标识反查函数被删（全屏启动将无法自动关浮窗）"; exit 1; }
          # 反回退：窗口诊断必须全量。注释里出现这个词是允许的（那是说明文字），
          # 所以先滤掉行首注释再查 —— 否则自己写的解释会把自检打红。
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonEntryHost.swift" | grep -q 'suffix(8)' \
            && { echo "::error::窗口诊断又变成截断输出 —— 证据不完整就会重演「系统里没有」的误判"; exit 1; } || true
          echo "V0.1.6 校验: 全屏自动关浮窗 + 窗口全量诊断 + 手势管理器运行时探针"

          # V0.1.7（归档(13)/Aevon(74) 修复）：
          # ①探针自己把 SpringBoard 打死过两次。崩溃栈是
          #   swift_dynamicCast → swift_getObjectType → _CF_forwarding_prep_0 → SIGTRAP，
          #   反汇编定位在「遍历全进程类表」那个函数里的动态转换指令上。
          #   本版把类表 / 方法名 / ivar 扫描整块搬进 ObjC（AevonObjCProbeV107），
          #   六组探针一次部署（P1~P6），每组都从 ObjC 的 @try 里过（AevonShieldV107）。
          # ②ivar 读取改 object_getIvar（AevonSafeIvarV107），不再裸 load 野指针。
          for s in AevonProbeV107 AevonMultiProbeV107 AevonShieldV107 AevonObjCProbeV107 AevonSafeIvarV107 \
                   AevonProbeP1V107 AevonProbeP2V107 AevonProbeP3V107 AevonProbeP4V107 AevonProbeP5V107 AevonProbeP6V107; do
            strings "$DYLIB" | grep -q "$s" \
              || { echo "::error::V0.1.7 标记 $s 未编入"; exit 1; }
          done
          # ObjC 安全带必须真的进构建：@try 兜底 + 类表扫描都在这个文件里。
          # 注意这里查源码而不是查二进制 —— C 函数名会被 strip 掉，strings 查不到会误判。
          for s in AevonShieldRun AevonAllClassNames AevonMethodNamesForClass AevonObjectResponds AevonClassFactoryObject; do
            grep -q "$s" "$GITHUB_WORKSPACE/Sources/AevonProbeSupport.m" \
              || { echo "::error::探针安全带函数 $s 被删（探针会再次裸跑）"; exit 1; }
          done
          grep -q 'Sources/AevonProbeSupport.m' "$GITHUB_WORKSPACE/Makefile" \
            || { echo "::error::探针安全带文件没进 Makefile（等于没编进去）"; exit 1; }
          # 反回退：Swift 侧不许再出现全进程类表扫描（那条路要经过 Swift 动态转换，
          # 正是崩溃点）。注释里说明这件事是允许的，所以先滤掉行首注释。
          if grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonProbeV107.swift" \
               | grep -q 'objc_copyClassList'; then
            echo "::error::类表扫描又回到 Swift 侧了 —— 会重演 swift_dynamicCast 崩溃"
            exit 1
          fi
          # 反回退：ivar 不许再用裸 load 把内存槽位当对象交出去。
          if grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonRuntime.swift" \
               | grep -q 'load(as: AnyObject'; then
            echo "::error::ivar 又用裸 load 取对象了 —— 野指针会让动态转换直接崩"
            exit 1
          fi
          # 探针文件必须存在且确实在做六组调度（每组的独立延迟调度是关键隔离手段）。
          grep -q 'groupPipeline' "$GITHUB_WORKSPACE/Sources/AevonProbeV107.swift" \
            || { echo "::error::探针 P1 组被删（系统手势管线取证断了）"; exit 1; }
          echo "V0.1.7 校验: 探针六组 + ObjC @try 兜底 + 类表扫描在 ObjC + ivar 安全读取"

          # V0.1.8（Aevon(75) 日志给出的答案）：
          # P1 探针把三个手势管理器一次列清，能力位一目了然：
          #   _UISystemGestureManager.sharedInstance            [two:1 one:0 acq:0]
          #   SBMainDisplaySystemGestureManager.sharedInstance  [two:0 one:0 acq:1]
          #   SBSystemGestureManager.mainDisplayManager         [two:0 one:0 acq:1]
          # 也就是唯一支持 addGestureRecognizer:toDisplayWithIdentity: 的是 UIKit 私有的
          # _UISystemGestureManager。0.1.5~0.1.7 三版都在 SB 那两个类上找这个方法，
          # 所以每版都「登记失败」——管线一直在，是敲错了门。
          # 本版把它排到候选首位，并加「反证降级」：登记成功却从没被 shouldReceiveTouch
          # 问过两次，就自动退回 0.1.3 延迟接管，绝不把右缘呼出做成哑巴。
          strings "$DYLIB" | grep -q '_UISystemGestureManager' \
            || { echo "::error::V0.1.8 没用 _UISystemGestureManager —— 它是唯一支持两参登记的管理器"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonSystemGestureV108' \
            || { echo "::error::V0.1.8 标记 AevonSystemGestureV108 未编入"; exit 1; }
          grep -q 'noteBandTouchSeenByGlobalChannel' "$GITHUB_WORKSPACE/Sources/AevonSystemGestureV104.swift" \
            || { echo "::error::管线有效性反证被删（登记成功却拿不到触摸时会变哑巴）"; exit 1; }
          grep -q 'noteBandTouchSeenByGlobalChannel' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            || { echo "::error::反证调用点被删（降级永远不会触发）"; exit 1; }
          echo "V0.1.8 校验: 登记改走 _UISystemGestureManager + 反证降级"

          # V0.1.9（Aevon(76) 日志）：
          # 登记成功了（_UISystemGestureManager × FBSDisplayIdentity），识别器也确实进了触摸流
          # （收到全屏任意位置触摸），但抖音还是会跟动 —— 因为 0.1.5~0.1.8 把
          # delaysTouchesBegan / cancelsTouchesInView 都设成了 false：
          # UIPan 要位移才 began，在它 began 之前 App 已经拿到 began 和位移，抖音横滑手势就成立了。
          # 本版两个开关翻成 true、判向阈值提前到 8pt，并把右缘取证改成每次必记。
          strings "$DYLIB" | grep -q 'AevonSystemGestureV109' \
            || { echo "::error::V0.1.9 标记 AevonSystemGestureV109 未编入"; exit 1; }
          # 中文取证明细在 Swift 二进制里是分段常量、strings 查不到，改查源码（与历史做法一致）。
          for s in "右缘触摸被拒" "判向 dx="; do
            grep -q "$s" "$GITHUB_WORKSPACE/Sources/AevonSystemGestureV104.swift" \
              || { echo "::error::V0.1.9 取证文案 $s 被删"; exit 1; }
          done
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonSystemGestureV104.swift" \
            | grep -q 'delaysTouchesBegan = true' \
            || { echo "::error::delaysTouchesBegan 又关掉了 —— App 会在识别器 began 前先动手（抖音跟动根因）"; exit 1; }
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonSystemGestureV104.swift" \
            | grep -q 'cancelsTouchesInView = true' \
            || { echo "::error::cancelsTouchesInView 又关掉了 —— 收下之后不会取消 App 那条触摸"; exit 1; }
          echo "V0.1.9 校验: 延迟/取消 App 触摸 + 判向提前 + 右缘取证每次必记"

          # V0.1.10（Aevon(77) 日志）：
          # 「偶尔触发抖音」的落点被抓到了：真正想呼盘的那几次在 x=386/391/397/402（距右缘 28~44pt）。
          # 而 0.1.8 起系统手势管线一旦登记成功，0.1.3 老通道就整条让路（bandOwnedByPipeline），
          # 老通道的接管带是 36pt、管线的窗口只有 20pt —— 20~36pt 中间成了一条**谁都不管的缝**，
          # 36~44pt 更是彻底没人看。所以本版把管线的「起手窗」放到 44pt，
          # 但视图命中仍只认 20pt（带内轻点照旧保护），判向改看落点而非 began 时的位置。
          strings "$DYLIB" | grep -q 'AevonSystemGestureV110' \
            || { echo "::error::V0.1.10 标记 AevonSystemGestureV110 未编入"; exit 1; }
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonSystemGestureV104.swift" \
            | grep -q 'static let beginSlack: CGFloat = 44' \
            || { echo "::error::起手窗被删或改窄 —— 20~36pt 会重新变成谁都不管的缝（Aevon(77) 根因）"; exit 1; }
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonSystemGestureV104.swift" \
            | grep -q 'func observesTouch' \
            || { echo "::error::观察窗判据 observesTouch 被删（起手窗形同虚设）"; exit 1; }
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonSystemGestureV104.swift" \
            | grep -q 'let fromEdge = inset <= AevonGestureBandView.beginSlack' \
            || { echo "::error::判向不再校验落点（贴边起手会被当成带外）"; exit 1; }
          grep -q '起手距右缘' "$GITHUB_WORKSPACE/Sources/AevonSystemGestureV104.swift" \
            || { echo "::error::V0.1.10 判向/began 取证文案被删"; exit 1; }
          echo "V0.1.10 校验: 起手窗 44pt（命中仍 20pt）+ 判向看落点"

          # V0.1.11（Aevon(78) 日志）：
          # 起手窗接收了一根手指（距右缘 41pt），却既没有判向也没有 began —— 全篇仅此一例。
          # 同时 20~46pt 那段因为「管线一登记就整条让路」而无人兜底：管线只在 20pt 缝内真的管事。
          # 本版两件事：①让路范围收窄到接管缝，缝外交回老通道延迟接管（它在落指时不抢，零点击代价）；
          # ②加 0.3s 跟踪采样，一次性判定「没跟踪」还是「跟了但放弃」。
          strings "$DYLIB" | grep -q 'AevonBandTrackV111' \
            || { echo "::error::V0.1.11 标记 AevonBandTrackV111 未编入"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonBandWidenV111' \
            || { echo "::error::V0.1.11 标记 AevonBandWidenV111 未编入"; exit 1; }
          grep -q 'AevonBandTrackV111' "$GITHUB_WORKSPACE/Sources/AevonSystemGestureV104.swift" \
            || { echo "::error::跟踪采样被删（起手窗失灵时又只能靠猜）"; exit 1; }
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonSystemGestureV104.swift" \
            | grep -q 'scheduleTrackSample(inset:' \
            || { echo "::error::跟踪采样调用点被删"; exit 1; }
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            | grep -q 'max(zone.width, AevonGestureBandView.beginSlack)' \
            || { echo "::error::老通道接管带被改窄 —— 20~46pt 会重新变成没人兜底的缝"; exit 1; }
          # 让路判据：V0.1.12 起右缘不再让路给管线（见下方 V0.1.12 块），
          # 这里只保留「接管带必须铺到 beginSlack」不变式。
          echo "V0.1.11 校验: 老通道铺到起手窗 46pt + 跟踪采样"

          # V0.1.12（Aevon(79) 日志）：
          # 15 次呼出全部落在右下角热区（x=417~425，距右缘 5~13pt）且全部成功、抖音一次没动
          # —— 说明「偶尔触发」必然发生在热区之外。热区之外以前是「began 给 App，看清方向才吞」，
          # 判定期内 App 已经吃到 6pt 横向位移，而抖音自己的横滑阈值就在这个量级，
          # 快一点/斜一点它就抢先立起来。本版换成「began 照给 App、移动帧先扣住」，
          # 纯 SB 侧确定生效，不再赌系统手势管线的跟踪能力（0.1.11 已证它靠不住）。
          strings "$DYLIB" | grep -q 'AevonBandHoldMovedV112' \
            || { echo "::error::V0.1.12 标记 AevonBandHoldMovedV112 未编入"; exit 1; }
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            | grep -q 'static let bandHoldLimit: CFTimeInterval = 0.6' \
            || { echo "::error::扣帧判定期被删或改长 —— 右缘可能变成划不动"; exit 1; }
          # 抬手必须放行：began 给出去了却扣住 ended，App 会留下孤儿触摸
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            | grep -q 'if phase == 3 || phase == 4 { return false }' \
            || { echo "::error::抬手帧不再放行 —— App 会留下没有 ended 的孤儿触摸"; exit 1; }
          # 纵向必须立刻放行：扣帧是为了防横滑，不是为了拦滚动
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            | grep -q 'abs(dy) >= 5, abs(dy) > abs(dx)' \
            || { echo "::error::纵向放行判据被删 —— 右缘带内上下滑会被扣住"; exit 1; }
          # began 必须放行（否则带内轻点全废 = 抖音右侧按钮点不到）
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            | grep -q 'if phase == 0 { return false }' \
            || { echo "::error::began 被吞了 —— 带内轻点/LongPress 全废"; exit 1; }
          # 两侧签名必须同时带 phase（一处改了一处没改 = 判据错乱）
          grep -q 'AevonGlobalTouchShouldSwallow(uintptr_t touchID, NSInteger phase)' "$GITHUB_WORKSPACE/Sources/AevonTouchHook.m" \
            || { echo "::error::hook 的吞摸判定没带 phase（分不出 began/moved/ended）"; exit 1; }
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            | grep -q 'shouldSwallowGlobalTouch(_ touchID: UInt, phase: Int)' \
            || { echo "::error::Swift 侧判据签名与 hook 不一致"; exit 1; }
          echo "V0.1.12 校验: 右缘只扣移动帧 + 抬手必放行 + 纵向立刻放行 + 判定期 0.6s"

          # V0.1.13（Aevon(80) 日志）：
          # 这份日志 20 次右缘呼出**全部落在右下角热区**、全部干净，起手窗只落进 1 次（x=394）
          # 且那根手指 0.3 秒内几乎没动 —— 没抓到故障现场。但复盘出一个机制漏洞：
          # 识别器一旦 shouldReceiveTouch 返回 true，因为 delaysTouchesBegan=true，
          # App 的 began 就被扣在 UIKit 手势环境里；而 shouldBegin 在「老通道持有这根手指」时
          # 直接 false → 识别器必然 failed → UIKit 把被扣住的 began 连同其后全部移动一次性补投给 App。
          # 这次补投发生在手势环境内部，UIApplication -sendEvent: 看不见，吞不掉 ——
          # 热区（识别器在 shouldReceiveTouch 就拒，20 条「原因=落在热区」）因此一直干净，
          # 起手窗（识别器接了）才会「圆盘出来了、抖音也跟动」。
          # 本版：①识别器整条停手（不再接收任何触摸，补投链断掉）；
          #       ②起手窗两态化 —— 默认整段交回 App（0.1.12 的「扣移动帧」判死：
          #         began 与 ended 都给了 App，ended 的落点就是抬起位置，位移照样算得出来）；
          #         打开「右缘全域接管」则按下即吞（App 连 began 都收不到）。
          strings "$DYLIB" | grep -q 'AevonPipelineStandDownV113' \
            || { echo "::error::V0.1.13 标记 AevonPipelineStandDownV113 未编入"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonBandTakeoverBeganV113' \
            || { echo "::error::V0.1.13 标记 AevonBandTakeoverBeganV113 未编入"; exit 1; }
          # 识别器必须停手：pipelineAllowed 恒 false（读诊断键，默认 false），且 shouldReceiveTouch 首行就查它
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonSystemGestureV104.swift" \
            | grep -q 'AevonPrefs.bool("PipelineTakeoverEnabled", default: false)' \
            || { echo "::error::识别器又允许接收触摸了 —— 它会扣住 App 的 began 再整段补投（Aevon(80) 根因）"; exit 1; }
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonSystemGestureV104.swift" \
            | grep -q 'guard AevonSystemGestureV105.pipelineAllowed else { return false }' \
            || { echo "::error::shouldReceiveTouch 没查 pipelineAllowed（停手护闸被拆）"; exit 1; }
          # 起手窗两态：默认不干预，开关打开才按下即接管
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            | grep -q 'AevonPrefs.bool("BandTakeoverFromBegan", default: false)' \
            || { echo "::error::起手窗两态开关被删（会退回 0.1.12 那种挡不住 ended 位移的中间态）"; exit 1; }
          # ★ 0.2.17 反转（AevonPrefsSlimV217）：SB 侧整指吞 0.2.15 已下线、0.2.17 把开关
          #   从设置页撤掉。留一个「永远不生效的开关」比没有更糟：用户打开它、试几次、什么也没发生。
          #   现在断言的是「它不许回到 Root.plist」。
          if grep -q 'BandTakeoverFromBegan' "$GITHUB_WORKSPACE/AevonPrefs/Resources/Root.plist"; then
            echo "::error::Root.plist 又出现 BandTakeoverFromBegan（0.2.17 已撤，整指吞不许回到设置页）"; exit 1
          fi
          # 抬手清状态必须连 globalTouchID 一起清（按下即接管模式下两套状态共用一根手指）
          test "$(grep -c 'if touchID == globalTouchID {' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift")" -ge 2 \
            || { echo "::error::带内抬手/取消只清 bandTouchID —— 会留下指向已释放 UITouch 的 globalTouchID"; exit 1; }
          echo "V0.1.13 校验: 识别器停手（断延迟补投）+ 起手窗两态（默认不干预 / 开关按下即接管）"

          # V0.1.14（AevonProbeP7V114 / 宿主审计）：**只加探针，不改行为**。
          # 0.1.5~0.1.13 九个版本都在改「策略」，却从没量过一件事：
          # 我们自己的视图，在右缘那个坐标上到底有没有被窗口问过。
          # 所以这版五组只回答「宿主」：窗口级命中链 / 入口窗口与容器关系 /
          # 既有系统识别器的宿主视图 / 我们那个识别器有没有宿主 / BKS 谓词能否表达几何。
          # 行为必须与 0.1.13 完全一致 —— 宁可这一版什么都不修，也不能因为探针把手机弄坏。
          for s in AevonProbeP7V114 AevonWindowHitV114 AevonHostAuditV114 \
                   AevonRecognizerHostV114 AevonOwnRecognizerV114 AevonDeferProbeV114; do
            strings "$DYLIB" | grep -q "$s" \
              || { echo "::error::V0.1.14 标记 $s 未编入"; exit 1; }
          done
          # 探针文件必须真的进构建（不在 Makefile 里等于没编进去）
          grep -q 'Sources/AevonProbeP7V114.swift' "$GITHUB_WORKSPACE/Makefile" \
            || { echo "::error::P7 探针文件没进 Makefile"; exit 1; }
          # 五组必须真的被调度（没挂到 runAll 里，装了也白装）
          grep -q 'AevonProbeP7V114.groups()' "$GITHUB_WORKSPACE/Sources/AevonProbeV107.swift" \
            || { echo "::error::P7 五组没挂进探针调度"; exit 1; }
          # 五组各一个入口函数，少一个就是「组没了」
          for f in windowHitChain entryHost systemRecognizerHosts ownRecognizer deferringCapability; do
            grep -q "func $f(" "$GITHUB_WORKSPACE/Sources/AevonProbeP7V114.swift" \
              || { echo "::error::P7 探针组 $f 被删"; exit 1; }
          done
          # 只读纪律：探针里不许出现任何「改状态」的调用（加了识别器/改了 delegate/swizzle 都算）
          if grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonProbeP7V114.swift" \
               | grep -qE 'addGestureRecognizer|removeGestureRecognizer|\.delegate *=|swizzle|addSubview'; then
            echo "::error::P7 探针里出现了改状态的调用 —— 探针必须只读"
            exit 1
          fi
          # 每组都必须从 ObjC @try 里过（Swift 的 do/catch 捕不到 doesNotRecognizeSelector:）
          test "$(grep -c 'AevonShieldRun' "$GITHUB_WORKSPACE/Sources/AevonProbeP7V114.swift")" -ge 1 \
            || { echo "::error::P7 探针没有走 AevonShieldRun 兜底"; exit 1; }
          # 宿主审计三件套必须在 ObjC 侧（沿 ivar 挖对象只能在 ObjC 做）
          for f in AevonDescribeRecognizersOfObject AevonObjectIvarSummary AevonViewHostChain; do
            grep -q "$f" "$GITHUB_WORKSPACE/Sources/AevonProbeSupport.m" \
              || { echo "::error::宿主审计函数 $f 不在 ObjC 安全带里"; exit 1; }
          done
          echo "V0.1.14 校验: 宿主审计五组 + 只读纪律 + ObjC @try 兜底（行为与 0.1.13 一致）"

          # V0.1.15（Aevon(82) 的 P7 结论 → 右缘做成「第二个热区」）：
          # P7 四条实测把所有旧假设推翻：
          #   · P7-1 右缘 (424,400) 最高命中 = AevonGestureBandView（在 SBMainSwitcherWindow
          #     level=5 里压着 SBDeviceApplicationSceneView）→ 命中早就赢了，不是瓶颈；
          #   · P7-2 入口窗口三个落点全 nil（穿透）→ 它不参与裁决；
          #   · P7-3 我们的识别器与 14 个系统识别器同宿 UISystemGestureView(0,0,430,932)；
          #   · P7-5 BKSHIDEventDeferringPredicate 只有 environment/display/token，无几何 → 判死。
          # 所以本版只做一件事：右缘在 UIApplication -sendEvent: 层 began 即整指接管，
          # 与热区共用 ownsTouch 生命周期；不再碰识别器、不再扣移动帧。
          for s in AevonRightEdgeTakeoverV115 AevonRightEdgeWidthV115 AevonBandTouchBeganV115; do
            strings "$DYLIB" | grep -q "$s" \
              || { echo "::error::V0.1.15 标记 $s 未编入"; exit 1; }
          done
          # 右缘必须真的在 began 就接管（不是"只记录"）：必须同时设 ownsTouch 与 globalTouchID
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            | grep -q 'AevonRightEdge.band(in: screen).contains(point)' \
            || { echo "::error::右缘接管带判据被删/改 —— 右缘会退回「只记录不接管」"; exit 1; }
          # 开关必须存在。V0.1.17 反转默认值：Aevon(84) 出过「装上就整屏点不动」的事故，
          # 这种「整指吞」功能此后一律默认关，由用户显式打开（0.1.15/0.1.16 的默认开已作废）。
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            | grep -q 'AevonPrefs.bool("RightEdgeTakeover", default: false)' \
            || { echo "::error::RightEdgeTakeover 必须默认关（出过全屏卡死事故）"; exit 1; }
          # ★ 0.2.17 反转：同上，SB 侧整指吞的开关已从设置页撤掉（代码里的读法保留，
          #   供急救写盘与探针历史串使用，运行期恒 false）。
          if grep -q 'RightEdgeTakeover' "$GITHUB_WORKSPACE/AevonPrefs/Resources/Root.plist"; then
            echo "::error::Root.plist 又出现 RightEdgeTakeover（0.2.17 已撤，整指吞不许回到设置页）"; exit 1
          fi
          # 带宽/带高必须可调。V0.1.18 改默认值：Aevon(85) 四次落点 0 次进带（17pt 时），
          # 46pt×60% 能盖住 3/4 → 默认直接给上限，下限抬到 24（不许再出现「设了也没用」的区间）。
          grep -q 'RightEdgeWidth' "$GITHUB_WORKSPACE/AevonPrefs/Resources/Detail.plist" \
            || { echo "::error::Detail.plist 缺 RightEdgeWidth 滑条"; exit 1; }
          grep -q 'RightEdgeHeight' "$GITHUB_WORKSPACE/AevonPrefs/Resources/Detail.plist" \
            || { echo "::error::Detail.plist 缺 RightEdgeHeight 滑条"; exit 1; }
          grep -v '^[[:space:]]*//' "$GITHUB_WORKSPACE/Sources/AevonEdgeEntry.swift" \
            | grep -q 'static let defaultWidth: Double = 46' \
            || { echo "::error::右缘默认宽度不是 46pt（Aevon(85) 实测 28pt 只覆盖 1/4 落点）"; exit 1; }
