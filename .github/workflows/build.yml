          # ── V0.0.37：场景停用门控 + Stheno 外侧边缘手势 + 全局几何记忆 ──
          # ── V0.1.3：V0.0.37 的「场景停用门控」已整体移除（安全模式崩溃源，见上面反回退）。
          # 历史串 AevonDeactivationGateV37 只由 AevonAssertionShim.m 的 used 常量收容，
