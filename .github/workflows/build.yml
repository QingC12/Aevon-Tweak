name: build

# 触发策略：
#   只保留手动触发（Actions 页面 Run workflow，或 API dispatch）。
#   V0.0.9 起不再监听 tag、不再发布 Release —— 构建产物只作为 artifact 上传，
#   由开发者下载后本地交付。
on:
  workflow_dispatch:

permissions:
  contents: read

# 同一 ref 只保留最新一次构建，排队中的旧任务自动取消
concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

env:
  THEOS: ${{ github.workspace }}/../theos
  # 钉住 roothide/theos 的提交，避免上游改动导致构建突然失败；取不到则回退默认分支
  THEOS_PIN: cfba89a53a05b4a1b822121158acc3669c20602f
  SDK_DIR: iPhoneOS16.5.sdk

jobs:
  build:
    name: 构建 deb（roothide / arm64e）
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        run: |
          # tr -d '\r'：防止 control 带 CRLF 时版本号里混进回车，把 Swift 字符串写断
          VERSION="$(grep -i '^Version:' control | tr -d '\r' | awk '{print $2}')"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "构建版本: ${VERSION}"
          # 版本号以 control 为唯一来源，同步写进 Swift 常量，避免多处漂移
          sed -i '' "s/^let AevonVersion = .*/let AevonVersion = \"${VERSION}\"/" Sources/Aevon.swift
          grep -n 'let AevonVersion' Sources/Aevon.swift
          # 设置页页脚里的版本号也一起同步，避免设置里显示上一版的旧号
          sed -i '' -E "s/Aevon [0-9]+\.[0-9]+\.[0-9]+/Aevon ${VERSION}/g" AevonPrefs/Resources/Root.plist
          grep -c "Aevon ${VERSION}" AevonPrefs/Resources/Root.plist || echo "::warning::设置页页脚版本号未同步（不影响功能）"

      - name: 安装依赖（gnu-make / Procursus ldid / xz）
        run: |
          brew install make ldid xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          ldid -h 2>&1 | head -2 || true

      - name: 获取 Theos（roothide 分支）与 SDK
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" fetch --depth 1 origin "$THEOS_PIN" 2>/dev/null \
            && git -C "$THEOS" checkout -q "$THEOS_PIN" \
            || echo "钉住的提交不可用，回退默认分支"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          test -d "$THEOS/sdks/$SDK_DIR" || { echo "::error::缺少 $SDK_DIR"; exit 1; }
          echo "THEOS_SHA=$(git -C "$THEOS" rev-parse --short HEAD)"

      - name: 构建
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: 校验产物（纯 arm64e + iphoneos-arm64e + 已签名）
        run: |
          set -e
          DEB="$(ls packages/*.deb | head -n1)"
          echo "deb: $DEB"
          rm -rf verify && mkdir verify && cd verify
          ar x "../$DEB"
          if [ -f data.tar.lzma ]; then xz -dc data.tar.lzma | tar x;
          elif [ -f data.tar.gz ]; then tar xzf data.tar.gz;
          else tar xf data.tar.*; fi
          for f in control.tar.*; do mkdir -p ctl && tar xf "$f" -C ctl; break; done

          # V0.0.27：包里现在有两个 dylib（Aevon + AevonGuard），必须精确定位主插件
          DYLIB="$(find . -name 'Aevon.dylib' -path '*DynamicLibraries*' | head -n1)"
          echo "dylib: $DYLIB"
          ARCHS="$(lipo -archs "$DYLIB")"
          echo "lipo -archs: $ARCHS"
          [ "$ARCHS" = "arm64e" ] || { echo "::error::产物必须是纯 arm64e，实际: $ARCHS"; exit 1; }
          codesign -d "$DYLIB" 2>&1 | head -3 || true

          # V0.0.6：崩溃捕获必须编入（否则安全模式后拿不到原因）
          strings "$DYLIB" | grep -q '/var/mobile/Aevon.crash.log' \
            || { echo "::error::主插件缺少崩溃捕获（Aevon.crash.log 路径不存在）"; exit 1; }
          # V0.0.6：启动阶段不得有遗留的 SpringBoard 启动 hook
          if strings "$DYLIB" | grep -q 'sk_sb_applicationDidFinishLaunching'; then
            echo "::error::仍存在启动期 hook（会造成安全模式）"
            exit 1
          fi
          echo "崩溃捕获: 已编入；启动期 hook: 已移除"

          # V0.0.7：入口必须是悬浮球（零 hook），且绝不能残留 SBIconView 快捷菜单 hook
          if strings "$DYLIB" | grep -q 'applicationShortcutItems'; then
            echo "::error::仍存在 SBIconView 快捷菜单 hook（会造成长按图标注销）"
            exit 1
          fi
          # V0.0.27：悬浮球已彻底移除（用户要求），绝不允许残留
          if strings "$DYLIB" | grep -q 'AevonBubble'; then
            echo "::error::主插件里仍残留悬浮球代码（AevonBubble）"
            exit 1
          fi
          strings "$DYLIB" | grep -q 'AevonAppPickerView' \
            || { echo "::error::主插件缺少应用选择面板（AevonAppPickerView）"; exit 1; }
          strings "$DYLIB" | grep -q 'launchApplicationWithIdentifier:suspended:' \
            || { echo "::error::主插件缺少拉起 App 的调用"; exit 1; }
          echo "入口校验: 悬浮球 + 应用选择面板 已编入；图标长按 hook 已移除"

          # V0.0.10：画面承载必须走 presenter（scene.uiPresentationManager →
          # createPresenterWithIdentifier: → activate → presentationView）。
          # 旧的两条路径必须彻底消失，否则会重现「全黑 + 注销」。
          strings "$DYLIB" | grep -q 'AevonSceneHost' \
            || { echo "::error::主插件缺少场景承载器（AevonSceneHost）"; exit 1; }
          strings "$DYLIB" | grep -q 'uiPresentationManager' \
            || { echo "::error::缺少 uiPresentationManager 调用（App 不会被要求渲染）"; exit 1; }
          strings "$DYLIB" | grep -q 'createPresenterWithIdentifier:' \
            || { echo "::error::缺少 createPresenterWithIdentifier: 调用"; exit 1; }
          strings "$DYLIB" | grep -q 'presentationView' \
            || { echo "::error::缺少 presentationView 取用"; exit 1; }
          if strings "$DYLIB" | grep -q '_UISceneLayerHostContainerView'; then
            echo "::error::仍残留 _UISceneLayerHostContainerView（V0.0.9 全黑根因）"
            exit 1
          fi
          if strings "$DYLIB" | grep -q 'UIScenePresentationManager'; then
            echo "::error::仍残留 UIScenePresentationManager 兜底（V0.0.9 注销根因）"
            exit 1
          fi
          echo "画面承载: presenter 路径已编入；旧容器/旧兜底已清除"

          # V0.0.14：真分屏 —— 吸附几何、左右分屏流程必须都在
          # 注意：只能查 ASCII 符号名。中文日志字面量是 UTF-8，`strings` 只输出可打印 ASCII，查不到。
          strings "$DYLIB" | grep -q 'AevonSnap' \
            || { echo "::error::主插件缺少吸附几何（AevonSnap）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonSnapSlot' \
            || { echo "::error::主插件缺少吸附槽位类型（AevonSnapSlot）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonSplitFlow' \
            || { echo "::error::主插件缺少左右分屏流程（AevonSplitFlow）"; exit 1; }
          echo "分屏校验: 吸附几何 + 左右分屏流程 已编入"

          # V0.0.15：边缘手势入口 + 圆盘选择器
          strings "$DYLIB" | grep -q 'AevonEdgeEntry\|AevonEdgeStripView' \
            || { echo "::error::缺少边缘手势入口（AevonEdge）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingMenu' \
            || { echo "::error::缺少圆盘选择器（AevonRingMenu）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingIcon' \
            || { echo "::error::缺少圆盘图标单元（AevonRingIcon）"; exit 1; }
          # V0.0.16：整圆形态 + 自接管触摸（图标不再挂手势识别器）
          strings "$DYLIB" | grep -q 'AevonRingFullCircle' \
            || { echo "::error::圆盘不是整圆版本（缺少 AevonRingFullCircle 标记）"; exit 1; }
          # V0.0.17：边缘条自己接管原生触摸（不再用 UIScreenEdgePanGestureRecognizer）
          strings "$DYLIB" | grep -q 'AevonEdgeTouch' \
            || { echo "::error::边缘入口仍是手势识别器版本（缺少 AevonEdgeTouch 标记）"; exit 1; }
          # V0.0.18：入口合并为唯一窗口（悬浮球 + 手势条同窗口）+ 触摸探针
          # 注意：strings 只输出可打印 ASCII，中文日志串查不到，这里只校验 ASCII 符号名
          strings "$DYLIB" | grep -q 'AevonEntryHost' \
            || { echo "::error::入口没有合并到统一窗口（缺少 AevonEntryHost 标记）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonEntryWindow' \
            || { echo "::error::缺少统一入口窗口类（AevonEntryWindow）"; exit 1; }
          echo "圆盘校验: 边缘入口（原生触摸）+ 整圆形态 + 图标单元 + 统一入口窗口 已编入"

          # V0.0.20：圆盘改多圈（8/12/16）+ 场景看门狗
          # 注意：Swift 的 enum + static let 没有运行时元数据，类型名不会进二进制，
          # 一律靠日志里的 ASCII 标记串校验。
          strings "$DYLIB" | grep -q 'AevonRingMultiRing' \
            || { echo "::error::圆盘不是多圈版本（缺少 AevonRingMultiRing 标记）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonSceneWatch' \
            || { echo "::error::缺少场景看门狗（AevonSceneWatch 标记）"; exit 1; }
          echo "多圈校验: 多圈圆盘 + 场景看门狗 已编入"

          # V0.0.21：场景白名单（只认 SBWindowScene）+ 圆盘 75% 锚点
          strings "$DYLIB" | grep -q 'AevonSceneWhiteListV21' \
            || { echo "::error::入口窗口没有做场景白名单（缺 AevonSceneWhiteListV21）—— 会用灵动岛场景挂窗口"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingAnchor75V21' \
            || { echo "::error::圆盘圆心不是 75% 锚点（缺 AevonRingAnchor75V21）"; exit 1; }
          # V0.0.22：唯一入口容器（可整体搬进 App 画面容器）+ 原生图标 + 系统 App
          strings "$DYLIB" | grep -q 'AevonSingleContainerV22' \
            || { echo "::error::入口不是唯一容器版本（缺 AevonSingleContainerV22）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonSceneVCHookV22' \
            || { echo "::error::缺少 App 画面容器钩子标记（AevonSceneVCHookV22）"; exit 1; }
          strings "$DYLIB" | grep -q 'SBDeviceApplicationSceneViewController' \
            || { echo "::error::App 画面容器钩子没编进二进制（SBDeviceApplicationSceneViewController）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonEntryContainerView' \
            || { echo "::error::缺少唯一入口容器类（AevonEntryContainerView）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingNativeIconV22' \
            || { echo "::error::圆盘没有恢复原生图标（缺 AevonRingNativeIconV22）"; exit 1; }
          strings "$DYLIB" | grep -q 'iconImageWithInfo:' \
            || { echo "::error::图标取图缺少 SBIconModel 通道（iconImageWithInfo:）"; exit 1; }
          echo "V0.0.22 校验: 唯一容器 + App 画面容器钩子 + 原生图标 已编入"

          # V0.0.23：全局触摸通道（不依赖命中测试）+ 圆盘面积 75% / 外多内少 / 逆时针旋转
          # 标记串一律 ≥16 字节，避免被 Swift 小字符串内联优化掉。
          strings "$DYLIB" | grep -q 'AevonGlobalTouchV23' \
            || { echo "::error::缺少全局触摸通道（AevonGlobalTouchV23）—— App 前台仍会划不出圆盘"; exit 1; }
          strings "$DYLIB" | grep -q 'sendEvent:' \
            || { echo "::error::全局触摸通道没编进二进制（找不到 sendEvent: 选择器）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingLayoutFitV23' \
            || { echo "::error::圆盘不是 75% 面积 / 外多内少版本（缺 AevonRingLayoutFitV23）"; exit 1; }
          # V0.0.28：逆时针半圈机制（AevonRingCounterClockV23）已按需求移除，不再校验
          echo "V0.0.23 校验: 全局触摸通道 + 圆盘 75% 面积 已编入"

          # V0.0.24：圆盘接管期丢弃 touched（App 不再跟着滚动）+ 圆心去文字
          # 注意：`AevonGlobalTouchShouldSwallow` 这种纯 C 函数符号只在 LC_SYMTAB 里，
          # macOS 的 strings 默认不扫符号表，查不到 —— 所以校验 objc 文件里强制保留的 ASCII 标记。
          strings "$DYLIB" | grep -q 'AevonTouchSwallowHookV24' \
            || { echo "::error::sendEvent 里没有「接管期丢弃」逻辑（缺 AevonTouchSwallowHookV24）—— 滑圆盘时 App 仍会跟着动"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingSwallowV24' \
            || { echo "::error::圆盘没有登记触摸接管（缺 AevonRingSwallowV24）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingCenterTextFreeV24' \
            || { echo "::error::圆心仍在显示文字（缺 AevonRingCenterTextFreeV24）"; exit 1; }
          echo "V0.0.24 校验: 触摸接管 + 圆心纯图标 已编入"

          # V0.0.25：热区可配置（位置/宽/高）+ 热区按下即接管 + 圆盘无选中文字
          strings "$DYLIB" | grep -q 'AevonTriggerZoneV25' \
            || { echo "::error::触发热区没有统一到配置（缺 AevonTriggerZoneV25）—— 右侧一大片仍能划出圆盘"; exit 1; }
          strings "$DYLIB" | grep -q 'RingTriggerWidth' \
            || { echo "::error::没有读取触发宽度设置项（RingTriggerWidth）"; exit 1; }
          strings "$DYLIB" | grep -q 'RingTriggerHeight' \
            || { echo "::error::没有读取触发高度设置项（RingTriggerHeight）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingNoLabelV25' \
            || { echo "::error::圆盘仍在显示选中文字（缺 AevonRingNoLabelV25）"; exit 1; }
          echo "V0.0.25 校验: 可配置热区 + 无选中文字 已编入"

          # V0.0.26：设置改动实时生效（Darwin 通知 + 轮询兜底）+ 触发条明暗自适应
          #           + 圆盘无任何提示文字 + 逆时针转半圈才解锁旋转
          strings "$DYLIB" | grep -q 'AevonTriggerZoneLiveV26' \
            || { echo "::error::触发区改动没有实时重排（缺 AevonTriggerZoneLiveV26）—— 设置里拖滑杆触发条不会动"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonPrefsLiveV26' \
            || { echo "::error::没有监听设置变更通知（缺 AevonPrefsLiveV26）"; exit 1; }
          strings "$DYLIB" | grep -q 'com.aevon.prefschanged' \
            || { echo "::error::dylib 里没有设置变更通知名（com.aevon.prefschanged）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonStripAdaptiveTintV26' \
            || { echo "::error::触发条颜色没有随系统明暗切换（缺 AevonStripAdaptiveTintV26）—— 浅色背景下看不见"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingNoHintV26' \
            || { echo "::error::圆盘底部提示文字没有移除（缺 AevonRingNoHintV26）"; exit 1; }
          echo "V0.0.26 校验: 触发区实时生效 + 触发条明暗自适应 + 无提示文字 已编入"

          # ── V0.0.28：圆盘两模式（选择 / 旋转）+ 内圈收紧 + 抬手指不收起圆盘 ──
          # 用户 Aevon(21)：取消「逆时针转半圈解锁」，改成「按住圆心 1 秒开关旋转」。
          strings "$DYLIB" | grep -q 'AevonRingHoldRotateV28' \
            || { echo "::error::圆盘没有「按住圆心 1 秒切旋转」（缺 AevonRingHoldRotateV28）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingTwoModeV28' \
            || { echo "::error::圆盘没有选择 / 旋转两模式（缺 AevonRingTwoModeV28）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingInnerTightV28' \
            || { echo "::error::圆盘内圈没有收紧（缺 AevonRingInnerTightV28）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingKeepOpenV28' \
            || { echo "::error::抬手指会把圆盘一起收起（缺 AevonRingKeepOpenV28）"; exit 1; }
          # 旧的「半圈解锁」必须彻底消失，否则两套门槛会互相打架
          if strings "$DYLIB" | grep -q 'AevonRingRotateArmV26'; then
            echo "::error::仍残留旧的「逆时针半圈解锁」机制（AevonRingRotateArmV26）"
            exit 1
          fi
          echo "V0.0.28 校验: 圆心按住切旋转 + 内圈收紧 + 抬手保持展开 已编入"

          # ── V0.0.29：滑杆量程修复 + 圆盘展开期下半屏拦截 + 间距均匀布局 ──
          strings "$DYLIB" | grep -q 'AevonRingHalfGuardV29' \
            || { echo "::error::圆盘展开期没有下半屏拦截（缺 AevonRingHalfGuardV29）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingDenseV29' \
            || { echo "::error::圆盘不是「间距均匀」布局版本（缺 AevonRingDenseV29）"; exit 1; }
          strings "$DYLIB" | grep -q 'com.aevon.ringopen' \
            || { echo "::error::没有广播圆盘展开状态（缺 com.aevon.ringopen）"; exit 1; }
          echo "V0.0.29 校验: 下半屏拦截 + 间距均匀布局 + 圆盘状态广播 已编入"

          # ── V0.0.30：底边锚定热区 + 弹簧阻尼动画 + 简化面板 ──
          strings "$DYLIB" | grep -q 'AevonTriggerBottomV30' \
            || { echo "::error::触发区不是底边锚定语义（缺 AevonTriggerBottomV30）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingSpringV30' \
            || { echo "::error::圆盘没有弹簧出入场动画（缺 AevonRingSpringV30）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingDampV30' \
            || { echo "::error::圆盘旋转没有阻尼跟手（缺 AevonRingDampV30）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonPanelSimpleV30' \
            || { echo "::error::面板没有简化为单窗模式（缺 AevonPanelSimpleV30）"; exit 1; }
          echo "V0.0.30 校验: 底边锚定 + 弹簧阻尼动画 + 简化面板 已编入"

          # ── V0.0.31：方形图标 + 大小自适应 + 位置固定记忆 + Guard 文件通道 ──
          strings "$DYLIB" | grep -q 'AevonRingSquareV31' \
            || { echo "::error::圆盘图标不是方形（缺 AevonRingSquareV31）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingAutoSizeV31' \
            || { echo "::error::圆盘图标大小没有自适应（缺 AevonRingAutoSizeV31）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingPinnedV31' \
            || { echo "::error::圆盘图标位置没有固定记忆（缺 AevonRingPinnedV31）"; exit 1; }
          strings "$DYLIB" | grep -q 'AEVONGUARDCONFV31' \
            || { echo "::error::没有写 guard.conf 文件通道（缺 AEVONGUARDCONFV31）"; exit 1; }
          echo "V0.0.31 校验: 方形图标 + 自适应大小 + 位置记忆 + Guard 文件通道 已编入"

          # ── V0.0.32：notify(3) 跨进程热区通道（沙盒 App 配置主通道）──
          strings "$DYLIB" | grep -q 'AevonGuardNotifyV32' \
            || { echo "::error::缺少 notify 跨进程热区通道（缺 AevonGuardNotifyV32）—— 抖音/QQ 里 Guard 读不到配置"; exit 1; }
          echo "V0.0.32 校验: notify 跨进程热区通道 已编入"

          # ── V0.0.33：热区按下无条件接管 + 圆盘速度弹簧 + Guard 圆盘期吞区加宽 ──
          strings "$DYLIB" | grep -q 'AevonTouchOwnV33' \
            || { echo "::error::热区接管仍门控 mountedInAppScene（缺 AevonTouchOwnV33）—— 容器搬家瞬间 App 会收到 began"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingSpringV33' \
            || { echo "::error::圆盘旋转不是速度弹簧（缺 AevonRingSpringV33）"; exit 1; }
          echo "V0.0.33 校验: 热区无条件接管 + 圆盘速度弹簧 已编入"

          # ── V0.0.27：App 侧触摸拦截（独立小 dylib，注入前台 App 进程）──
          # 用户 Aevon(20)：SpringBoard 里吞事件挡不住 QQ 左滑删除会话 / 抖音左滑进主页，
          # 那些是 App 进程收到触摸后自己判定的。所以必须有 AevonGuard。
          GUARD_DYLIB="$(find . -name 'AevonGuard.dylib' -path '*DynamicLibraries*' | head -n1)"
          echo "guard dylib: $GUARD_DYLIB"
          [ -n "$GUARD_DYLIB" ] || { echo "::error::缺少 AevonGuard.dylib（App 侧手势拦截，缺了 App 左滑照样触发）"; exit 1; }
          GUARD_ARCHS="$(lipo -archs "$GUARD_DYLIB")"
          echo "AevonGuard lipo -archs: $GUARD_ARCHS"
          [ "$GUARD_ARCHS" = "arm64e" ] || { echo "::error::AevonGuard 必须是纯 arm64e，实际: $GUARD_ARCHS"; exit 1; }
          strings "$GUARD_DYLIB" | grep -q 'AevonAppGuardV27' \
            || { echo "::error::AevonGuard 没有编入热区拦截逻辑（缺 AevonAppGuardV27）"; exit 1; }
          strings "$GUARD_DYLIB" | grep -q 'AevonGuardRingZoneV29' \
            || { echo "::error::AevonGuard 没有「圆盘展开期吞下半屏」逻辑（缺 AevonGuardRingZoneV29）"; exit 1; }
          strings "$GUARD_DYLIB" | grep -q 'AevonGuardFileConfV31' \
            || { echo "::error::AevonGuard 没有 guard.conf 文件通道配置（缺 AevonGuardFileConfV31）"; exit 1; }
          strings "$GUARD_DYLIB" | grep -q 'AevonGuardNotifyV32' \
            || { echo "::error::AevonGuard 没有 notify 主配置通道（缺 AevonGuardNotifyV32）"; exit 1; }
          strings "$GUARD_DYLIB" | grep -q 'AevonGuardRingForceV32' \
            || { echo "::error::AevonGuard 圆盘展开期没有无条件吞下半屏（缺 AevonGuardRingForceV32）—— 抖音会暂停/误触"; exit 1; }
          strings "$GUARD_DYLIB" | grep -q 'AevonGuardRingWideV33' \
            || { echo "::error::AevonGuard 圆盘期吞区没有加宽（缺 AevonGuardRingWideV33）—— 上半屏滑动仍触发 App"; exit 1; }
          # ── V0.0.34：圆盘状态走 notify(3) 共享内存位（Darwin 广播不可靠的根治）──
          strings "$DYLIB" | grep -q 'AevonNotifyRingBitV34' \
            || { echo "::error::SB 侧没有写圆盘状态位（缺 AevonNotifyRingBitV34）—— Guard 靠猜，App 照收触摸"; exit 1; }
          strings "$GUARD_DYLIB" | grep -q 'AevonGuardStateRingV34' \
            || { echo "::error::AevonGuard 圆盘状态没有读共享内存位（缺 AevonGuardStateRingV34）"; exit 1; }
          strings "$GUARD_DYLIB" | grep -q 'AevonGuardLogV34' \
            || { echo "::error::AevonGuard 没有日志通道（缺 AevonGuardLogV34）—— 无法验证注入与拦截"; exit 1; }
          echo "V0.0.34 校验: 圆盘状态共享内存位 + Guard 日志 已编入"
          # ── V0.0.35：Guard 全 App 注入（UIKit bundle filter）+ ack 回执 + hover 向上跳跃 ──
          strings "$DYLIB" | grep -q 'AevonRingHopV35' \
            || { echo "::error::划过图标没有向上跳跃动画（缺 AevonRingHopV35）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonGuardAckV35' \
            || { echo "::error::SB 侧没有 ack 确证逻辑（缺 AevonGuardAckV35）"; exit 1; }
          strings "$GUARD_DYLIB" | grep -q 'AevonGuardAckV35' \
            || { echo "::error::AevonGuard 没有 ack 回执（缺 AevonGuardAckV35）—— 无法确证注入"; exit 1; }
          echo "V0.0.35 校验: Guard UIKit filter + ack 回执 + hover 跳跃 已编入"
          # ── V0.0.36：浮窗外壳搬进入口容器 + 四周缩放 ──
          strings "$DYLIB" | grep -q 'AevonFloatInEntryV36' \
            || { echo "::error::浮窗外壳没有搬进入口容器（缺 AevonFloatInEntryV36）—— App 前台浮窗不可见"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonEdgeResizeV36' \
            || { echo "::error::浮窗没有四周缩放手势（缺 AevonEdgeResizeV36）"; exit 1; }
          echo "V0.0.36 校验: 浮窗单窗口化 + 四周缩放 已编入"
          # ── V0.0.37：场景停用门控 + Stheno 外侧边缘手势 + 全局几何记忆 ──
          strings "$DYLIB" | grep -q 'AevonDeactivationGateV37' \
            || { echo "::error::场景停用门控没有编入（缺 AevonDeactivationGateV37）—— 全屏 App 里浮窗内容点不动"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonSthenoEdgeBarV37' \
            || { echo "::error::浮窗没有 Stheno 外侧边缘手势（缺 AevonSthenoEdgeBarV37）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonMedusaFrameV37' \
            || { echo "::error::浮窗没有全局几何记忆（缺 AevonMedusaFrameV37）"; exit 1; }
          strings "$GUARD_DYLIB" | grep -q 'AevonGuardRingExactV37' \
            || { echo "::error::AevonGuard 圆盘状态判定没有修正（缺 AevonGuardRingExactV37）—— 圆盘收起后 60 秒内整屏被吞"; exit 1; }
          # V0.0.37：浮窗尺寸/位置设置项已移除（Stheno 式全局记忆替代），不许残留
          DETAIL_PLIST_V37="$(find . -name 'Detail.plist' -path '*AevonPrefs.bundle*' | head -n1)"
          if grep -q 'FloatWindowWidth\|FloatWindowY\|aevonApplyFloatWindow' "$DETAIL_PLIST_V37"; then
            echo "::error::Detail.plist 仍残留浮窗尺寸/位置设置项（V0.0.37 已移除）"
            exit 1
          fi
          echo "V0.0.37 校验: 场景停用门控 + 外侧边缘手势 + 全局几何记忆 已编入；旧浮窗设置项 已移除"

          # ── V0.0.38：外侧手势命中修复 + 长按触发移除 ──
          strings "$DYLIB" | grep -q 'AevonOutsideHitV38' \
            || { echo "::error::外侧手势命中修复没有编入（缺 AevonOutsideHitV38）—— 窗外边条/外角块会命中不到"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonSwipeOnlyV38' \
            || { echo "::error::长按触发没有移除干净（缺 AevonSwipeOnlyV38）"; exit 1; }
          if strings "$DYLIB" | grep -q '识别器长按\|边缘长按\|全局长按\|窗口层长按'; then
            echo "::error::长按触发路径仍有残留"; exit 1
          fi
          echo "V0.0.38 校验: 外侧手势命中修复 + 仅左滑触发 已编入"

          # ── V0.0.39：启动异常保护 + 崩溃回溯 + 圆盘长按移除删除 + 图标 ──
          strings "$DYLIB" | grep -q 'AevonBootShieldV39' \
            || { echo "::error::启动异常保护没有编入（缺 AevonBootShieldV39）—— 自动注销问题会复发"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonCrashTraceV39' \
            || { echo "::error::崩溃捕获器没有调用栈回溯（缺 AevonCrashTraceV39）"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonRingNoHoldRemoveV39' \
            || { echo "::error::圆盘长按移除没有删除干净（缺 AevonRingNoHoldRemoveV39）"; exit 1; }
          if strings "$DYLIB" | grep -q '长按移除'; then
            echo "::error::圆盘长按移除日志仍有残留"; exit 1
          fi
          ICON="$(find . -path '*Library/Aevon/AevonIcon.png' | head -n1)"
          [ -n "$ICON" ] || { echo "::error::deb 缺少 /var/jb/Library/Aevon/AevonIcon.png（包图标）"; exit 1; }
          ICON2="$(find . -path '*Library/Aevon/AevonIcon@2x.png' | head -n1)"
          [ -n "$ICON2" ] || { echo "::error::deb 缺少 AevonIcon@2x.png"; exit 1; }
          PREFICON="$(find . -path '*AevonPrefs.bundle/icon@3x.png' | head -n1)"
          [ -n "$PREFICON" ] || { echo "::error::deb 缺少设置 bundle 图标 icon@3x.png"; exit 1; }
          echo "V0.0.39 校验: 启动异常保护 + 崩溃回溯 + 圆盘长按移除已删 + 图标齐全 已编入"

          # ── V0.0.40：崩溃归因（外部模块崩溃不再误禁 Aevon）+ Sileo 图标纯路径 ──
          strings "$DYLIB" | grep -q 'AevonCrashAttrV40' \
            || { echo "::error::崩溃归因没有编入（缺 AevonCrashAttrV40）—— 外部插件崩溃会再次误禁 Aevon"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonSileoIconV40' \
            || { echo "::error::Sileo 图标修复没有编入（缺 AevonSileoIconV40）"; exit 1; }
          echo "V0.0.40 校验: 崩溃归因 + Sileo 图标纯路径 已编入"

          # ── V0.0.41：浮窗手势改由全局触摸通道驱动（全屏 App 里也能拖动 / 缩放 / 关闭）──
          # 标记本体在 AevonAssertionShim.m 里是 __cstring 字面量（Swift 侧字面量会被 LLVM 折叠）。
          strings "$DYLIB" | grep -q 'AevonFloatGlobalV41' \
            || { echo "::error::浮窗全局手势没有编入（缺 AevonFloatGlobalV41）—— 全屏 App 里浮窗仍无法操作"; exit 1; }
          echo "V0.0.41 校验: 浮窗全局手势 已编入"

          # ── V0.0.42：Stheno 式停靠 / 观感（贴边避让，根治吸附成巨窗后无法缩放）──
          strings "$DYLIB" | grep -q 'AevonSthenoDockV42' \
            || { echo "::error::停靠避让没有编入（缺 AevonSthenoDockV42）—— 吸附后四角仍会出屏"; exit 1; }
          strings "$DYLIB" | grep -q 'AevonFloatLookV42' \
            || { echo "::error::浮窗观感（圆角/投影）没有编入（缺 AevonFloatLookV42）"; exit 1; }
          echo "V0.0.42 校验: 停靠避让 + 圆角投影 已编入"

          # ── V0.0.43：Stheno 式几何与手势（贴边 5pt / 默认小窗 / 侧条轻点停靠 / 底边双击关闭）──
          strings "$DYLIB" | grep -q 'AevonSthenoGestureV43' \
            || { echo "::error::Stheno 手势体系没有编入（缺 AevonSthenoGestureV43）"; exit 1; }
          # 中文日志串改用 python 按字节搜：
          #   ① macOS 的 strings 只提取 ASCII，中文 UTF-8 永远不出现；
          #   ② BSD grep 在 C locale 下搜多字节模式会静默不匹配。
          #   两次误报都是这两个原因，不是代码没编进去。
          python3 - "$DYLIB" <<'PY'
          import sys, pathlib
          data = pathlib.Path(sys.argv[1]).read_bytes()
          need = ["侧条轻点", "侧条开始移动", "底边双击", "停靠小窗"]
          miss = [s for s in need if s.encode("utf-8") not in data]
          if miss:
              print("::error::缺少日志串: " + ", ".join(miss))
              sys.exit(1)
          if "全局通道命中关闭钮".encode("utf-8") in data:
              print("::error::仍存在顶部关闭钮逻辑（V0.0.43 应已移除）")
              sys.exit(1)
          print("V0.0.43 校验: 贴边 5pt + 侧条轻点停靠 + 侧条长按移动 + 底边双击关闭 已编入")
          PY

          # ── V0.0.44：观感与交互修正（去顶部空白 / 实时缩放保圆角 / 轻点还原 / 互相避让 / 描边）──
          for m in AevonSthenoGestureV44 AevonLiveResizeV44 AevonDockRestoreV44 \
                   AevonDockAvoidV44 AevonFloatEdgeGlowV44 AevonTopBlankCropV44; do
            strings "$DYLIB" | grep -q "$m" \
              || { echo "::error::V0.0.44 标记缺失: $m"; exit 1; }
          done
          python3 - "$DYLIB" <<'PY'
          import sys, pathlib
          data = pathlib.Path(sys.argv[1]).read_bytes()
          need = ["底边条拖动", "还原主悬浮窗", "自动避让停靠小窗", "全程实时渲染"]
          miss = [s for s in need if s.encode("utf-8") not in data]
          if miss:
              print("::error::缺少 V0.0.44 日志串: " + ", ".join(miss))
              sys.exit(1)
          print("V0.0.44 校验: 去顶部空白 + 实时缩放保圆角 + 轻点还原 + 互相避让 + 描边 已编入")
          PY
          strings "$GUARD_DYLIB" | grep -q 'sendEvent:' \
            || { echo "::error::AevonGuard 没有 hook UIApplication sendEvent:"; exit 1; }
          GUARD_PLIST="$(find . -name 'AevonGuard.plist' -path '*DynamicLibraries*' | head -n1)"
          echo "guard plist: $GUARD_PLIST"
          [ -n "$GUARD_PLIST" ] || { echo "::error::缺少 AevonGuard.plist（注入范围）"; exit 1; }
          # V0.0.35（AevonGuardUIKitV35）：必须是 Bundles=com.apple.UIKit（全 GUI App 注入）；
          # 旧 Mode=Any 空 Filter 在 roothide ellekit 上可能被跳过（Aevon(28)：零 [Guard] 日志）
          plutil -convert xml1 -o - "$GUARD_PLIST" | grep -q 'com.apple.UIKit' \
            || { echo "::error::AevonGuard.plist 不是 Bundles=com.apple.UIKit（Guard 可能不会注入 App 进程）"; exit 1; }
          echo "V0.0.27 校验: App 侧触摸拦截 dylib 已编入"

          # V0.0.27：圆盘列表实时同步 + 悬浮球移除
          strings "$DYLIB" | grep -q 'AevonRingListLiveV27' \
            || { echo "::error::圆盘列表没有实时同步标记（缺 AevonRingListLiveV27）"; exit 1; }

          ARCH="$(grep -i '^Architecture:' ctl/control | cut -d' ' -f2-)"
          echo "deb Architecture: $ARCH"
          [ "$ARCH" = "iphoneos-arm64e" ] || { echo "::error::deb 架构应为 iphoneos-arm64e，实际: $ARCH"; exit 1; }

          # ── V0.0.31/32：插件图标（Sileo Icon 字段 + 图标文件，路径不含空格）──
          # V0.0.40（AevonSileoIconV40）：file:// scheme Sileo 不解析
          #（UIImage(contentsOfFile:) 只认纯路径），改纯绝对路径。
          grep -qi '^Icon:' ctl/control \
            || { echo "::error::control 缺少 Icon: 字段（Sileo 不显示插件图标）"; exit 1; }
          find . -path '*Library/Aevon/AevonIcon.png' | grep -q . \
            || { echo "::error::deb 缺少插件图标文件 Library/Aevon/AevonIcon.png（Sileo Icon 指向它）"; exit 1; }
          grep -q '^Icon: /var/jb/Library/Aevon/AevonIcon.png' ctl/control \
            || { echo "::error::control Icon: 应为纯路径 /var/jb/Library/Aevon/AevonIcon.png（Sileo 不解析 file:// scheme）"; exit 1; }
          find . -name 'icon@2x.png' -path '*AevonPrefs.bundle*' | grep -q . \
            || { echo "::error::AevonPrefs.bundle 缺少 icon@2x.png（系统设置不显示插件图标）"; exit 1; }
          find . -name 'icon@3x.png' -path '*AevonPrefs.bundle*' | grep -q . \
            || { echo "::error::AevonPrefs.bundle 缺少 icon@3x.png（系统设置不显示插件图标）"; exit 1; }
          echo "V0.0.40 图标校验: Sileo Icon 纯路径 + 图标文件 已就位"

          PKG="$(grep -i '^Package:' ctl/control | cut -d' ' -f2-)"
          echo "deb Package: $PKG"
          [ "$PKG" = "com.aevon" ] || { echo "::error::包名应为 com.aevon（dpkg 要求全小写），实际: $PKG"; exit 1; }

          case "$(basename "$DEB")" in
            com.Aevon_*_iphoneos-arm64e.deb) echo "产物文件名: 符合 com.Aevon_<版本>_iphoneos-arm64e.deb" ;;
            *) echo "::error::产物文件名应以 com.Aevon_ 开头，实际: $(basename "$DEB")"; exit 1 ;;
          esac

          # 设置 bundle：必须是纯 arm64e，且真的编进了控制器子类（否则点击设置项会闪退）
          PREFS_BIN="$(find . -name 'AevonPrefs' -type f | head -n1)"
          echo "prefs bin: $PREFS_BIN"
          PREFS_ARCHS="$(lipo -archs "$PREFS_BIN")"
          echo "prefs lipo -archs: $PREFS_ARCHS"
          [ "$PREFS_ARCHS" = "arm64e" ] || { echo "::error::设置 bundle 必须是纯 arm64e，实际: $PREFS_ARCHS"; exit 1; }
          strings "$PREFS_BIN" | grep -q 'AevonRootListController' \
            || { echo "::error::设置 bundle 缺少 AevonRootListController（点击设置项会闪退）"; exit 1; }
          # V0.0.5：设置页空白是因为 specifier 没写回 _specifiers。这里确认两条关键路径都编进去了
          strings "$PREFS_BIN" | grep -q 'preferenceSpecifierNamed:target:set:get:detail:cell:edit:' \
            || { echo "::error::设置 bundle 缺少 PSSpecifier 自行构建逻辑（设置页会空白）"; exit 1; }
          strings "$PREFS_BIN" | grep -q '_specifiers' \
            || { echo "::error::设置 bundle 缺少 _specifiers 写回逻辑（设置页会空白）"; exit 1; }
          echo "设置 bundle 控制器类: 已编入；specifier 构建与写回: 已编入"
          strings "$PREFS_BIN" | grep -q 'AevonRingEditorController' \
            || { echo "::error::设置 bundle 缺少圆盘 App 编辑器（AevonRingEditorController）"; exit 1; }
          strings "$PREFS_BIN" | grep -q 'AevonRingAddController' \
            || { echo "::error::设置 bundle 缺少圆盘 App 添加页（AevonRingAddController）"; exit 1; }
          strings "$PREFS_BIN" | grep -q 'aevonOpenRingEditor' \
            || { echo "::error::设置页没有「编辑圆盘 App」入口动作（aevonOpenRingEditor）"; exit 1; }
          strings "$PREFS_BIN" | grep -q 'moveRowAtIndexPath' \
            || { echo "::error::圆盘 App 编辑器不支持拖动排序（缺 moveRowAtIndexPath）"; exit 1; }
          strings "$PREFS_BIN" | grep -q 'aevonSliderValueChanged' \
            || { echo "::error::设置页滑杆没有拖动实时回调（缺 aevonSliderValueChanged）"; exit 1; }
          # V0.0.28：滑条必须按存储值初始化（否则一碰就写 0，触发条跑到屏幕顶部）
          strings "$PREFS_BIN" | grep -q 'AevonSliderSyncV28' \
            || { echo "::error::滑条没有按存储值校正（缺 AevonSliderSyncV28）—— 滑杆会停在最左端"; exit 1; }
          strings "$PREFS_BIN" | grep -q 'aevonResetTriggerZone' \
            || { echo "::error::设置页缺少「恢复默认触发区域」按钮动作（aevonResetTriggerZone）"; exit 1; }
          PREFS_DIR_TMP="$(dirname "$PREFS_BIN")"
          # V0.0.30：恢复默认按钮在二级 Detail.plist；Root 一级页必须有二级页入口
          plutil -convert xml1 -o - "$PREFS_DIR_TMP/Detail.plist" | grep -q 'aevonResetTriggerZone' \
            || { echo "::error::Detail.plist 缺少「恢复默认触发区域」按钮"; exit 1; }
          plutil -convert xml1 -o - "$PREFS_DIR_TMP/Root.plist" | grep -q 'aevonOpenDetail' \
            || { echo "::error::Root.plist 缺少「细节调整」二级页入口"; exit 1; }
          strings "$PREFS_BIN" | grep -q 'AevonDetailPageV30' \
            || { echo "::error::二级细节调整页逻辑没有编入（缺 AevonDetailPageV30）"; exit 1; }
          echo "V0.0.30 设置侧校验: 一级只放开关 + Detail.plist 二级页 + 恢复默认 已编入"

          # Root.plist 必须随包，且开关项不少于 6 个
          ICON_DIR="$(dirname "$PREFS_BIN")"
          [ -s "$ICON_DIR/Root.plist" ] || { echo "::error::bundle 缺少 Root.plist"; exit 1; }
          SWITCH_COUNT="$(plutil -convert xml1 -o - "$ICON_DIR/Root.plist" | grep -c 'PSSwitchCell' || true)"
          echo "Root.plist 开关项: $SWITCH_COUNT"
          [ "$SWITCH_COUNT" -ge 6 ] || { echo "::error::Root.plist 开关项不足 6 个（实际 $SWITCH_COUNT）"; exit 1; }
          # V0.0.27：悬浮球已删除，设置里不应再有 BubbleEnabled
          if plutil -convert xml1 -o - "$ICON_DIR/Root.plist" | grep -q 'BubbleEnabled'; then
            echo "::error::Root.plist 仍残留 BubbleEnabled（悬浮球已移除）"
            exit 1
          fi
          # V0.0.14 新增：吸附开关必须在 Root.plist 里
          plutil -convert xml1 -o - "$ICON_DIR/Root.plist" | grep -q 'SnapEnabled' \
            || { echo "::error::Root.plist 缺少 SnapEnabled（边缘吸附）开关"; exit 1; }
          # V0.0.15 新增：边缘手势主入口开关必须在
          plutil -convert xml1 -o - "$ICON_DIR/Root.plist" | grep -q 'EdgeGestureEnabled' \
            || { echo "::error::Root.plist 缺少 EdgeGestureEnabled（边缘圆盘入口）开关"; exit 1; }
          # V0.0.25 新增：触发区域三个滑杆必须在「细节调整」二级页（V0.0.30 起 Root 只放开关）
          for K in RingTriggerY RingTriggerWidth RingTriggerHeight; do
            plutil -convert xml1 -o - "$ICON_DIR/Detail.plist" | grep -q "$K" \
              || { echo "::error::Detail.plist 缺少触发区域设置项 $K"; exit 1; }
          done
          # V0.0.30：一级 Root.plist 只允许开关（滑杆全部在 Detail.plist）
          if plutil -convert xml1 -o - "$ICON_DIR/Root.plist" | grep -q 'PSSliderCell'; then
            echo "::error::Root.plist 里还有滑杆（V0.0.30 起一级页只放开关，滑杆在 Detail.plist）"; exit 1
          fi
          [ -s "$ICON_DIR/Detail.plist" ] || { echo "::error::bundle 缺少 Detail.plist（二级细节调整页）"; exit 1; }
          plutil -convert xml1 -o - "$ICON_DIR/Detail.plist" | grep -q 'aevonResetTriggerZone' \
            || { echo "::error::Detail.plist 缺少「恢复默认触发区域」按钮"; exit 1; }
          plutil -convert xml1 -o - "$ICON_DIR/Root.plist" | grep -q 'aevonOpenDetail' \
            || { echo "::error::Root.plist 缺少「细节调整」二级页入口"; exit 1; }
          # V0.0.29：PSSliderCell 只认 min/max —— 缺了量程退化成 0~1，一拖就写回 0.x，
          # 触发条永远贴在屏幕顶部（用户 Aevon(22) 复现的「自动跑到顶部」根因）
          # V0.0.30：滑杆在二级 Detail.plist
          for K in '<key>min</key>' '<key>max</key>'; do
            plutil -convert xml1 -o - "$ICON_DIR/Detail.plist" | grep -qF "$K" \
              || { echo "::error::Detail.plist 滑杆缺少 $K（量程会退化成 0~1，触发条会跑到顶部）"; exit 1; }
          done
          strings "$PREFS_BIN" | grep -q 'PSSliderCell' \
            || { echo "::error::设置 bundle 没有滑杆构建逻辑（PSSliderCell）"; exit 1; }
          # V0.0.26：滑杆写值后必须广播变更通知，SpringBoard 才会立刻重排触发条
          strings "$PREFS_BIN" | grep -q 'com.aevon.prefschanged' \
            || { echo "::error::设置 bundle 没有广播 com.aevon.prefschanged（改完设置触发条不会实时变化）"; exit 1; }

          # 图标三档必须在 bundle 根目录
          ICON_DIR="$(dirname "$PREFS_BIN")"
          for i in icon.png icon@2x.png icon@3x.png; do
            [ -s "$ICON_DIR/$i" ] || { echo "::error::缺少图标 $i"; exit 1; }
          done
          echo "图标: icon.png / icon@2x.png / icon@3x.png 均存在"

      # 产物只上传为 artifact（不发 Release）。下载方式见交付说明。
      # V0.0.43：即使后续校验失败也先传上去 —— 校验误报时还能拿到 deb 本地复核。
      - name: 上传产物（artifact，不发 Release）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aevon-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: 输出产物信息到日志
        run: |
          DEB="$(ls packages/*.deb | head -n1)"
          echo "产物: $(basename "$DEB")"
          echo "大小: $(wc -c < "$DEB") 字节"
          echo "MD5: $(md5 -q "$DEB")"
