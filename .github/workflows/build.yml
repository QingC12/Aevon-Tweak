          #    保留 `AevonGripHomeScreenNow` 的声明与导出（将来要按场景分档时直接用），
          #    但**不许**再在 moved 路径里按前台分叉 —— 用「if (home)」这个字面量做反向断言。
          grep -qF 'AevonGripHomeScreenNow' "$GH26" \
