          strings "$DYLIB" | grep -q 'AevonRingNoHoldRemoveV39' \
            || { echo "::error::圆盘长按移除没有删除干净（缺 AevonRingNoHoldRemoveV39）"; exit 1; }
          if strings "$DYLIB" | grep -q '长按移除'; then
            echo "::error::圆盘长按移除日志仍有残留"; exit 1
          fi
          ICON="$(find . -path '*Library/Aevon/AevonIcon.png' | head -n1)"
          [ -n "$ICON" ] || { echo "::error::deb 缺少 /var/jb/Library/Aevon/AevonIcon.png（包图标）"; exit 1; }
          ICON2="$(find . -path '*Library/Aevon/AevonIcon@2x.png' | head -n1)"
          [ -n "$ICON2" ] || { echo "::error::deb 缺少 AevonIcon@2x.png"; exit 1; }
          PREFICON="$(find . -path '*AevonPrefs.bundle/icon@3x.png' | head -n1)"
          [ -n "$PREFICON" ] || { echo "::error::deb 缺少设置 bundle 图标 icon@3x.png"; exit 1; }
          echo "V0.0.39 校验: 启动异常保护 + 崩溃回溯 + 圆盘长按移除已删 + 图标齐全 已编入"
          # ── V0.0.40：崩溃归因（外部模块崩溃不再误禁 Aevon）+ Sileo 图标纯路径 ──
